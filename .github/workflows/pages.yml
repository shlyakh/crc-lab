# Check each project and publish site/ (landing page, hail/, validation/) to GitHub Pages.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Every check, in one script shared with `just ci` and the pre-push hook for main
      - run: bash tools/ci.sh
      # Keep the D0 explainers at their existing Pages URL (/explainers/...)
      - run: mkdir -p site/explainers && cp docs/explainers/*.html docs/explainers/README.md site/explainers/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
