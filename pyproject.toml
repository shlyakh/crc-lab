[project]
name = "crc-lab"
version = "0.0.1"
description = "Climate Risk Commons lab: a Texas data explorer for CRC Open hazards; later, storm-event sources, hail and gust curves, and asset sets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "crc-sdk[zarr,raster,netcdf]==1.0.1",
    "crc-framework==1.0.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.13",
    "xarray>=2024.6",
    "h3>=4.1",
    "plotly>=5.22,<7",
]

[project.optional-dependencies]
# Phase 4 (deferred): solar-farm and building loaders.
assets = ["osmnx>=2.0", "geopandas>=1.0", "linkml>=1.8"]
# Notebook maps while exploring; the explorer itself uses MapLibre + deck.gl in the browser.
viz = ["lonboard>=0.10"]
# Flood lab (src/flood_lab): vector reading and reprojection; its tests run in CI with this extra.
flood = ["geopandas>=1.0", "pyogrio>=0.7", "pyproj>=3.6"]
# MRMS GRIB2 (crc_lab radar, flood_lab.reference.mrms); its tests run in CI with this extra.
radar = [
    "cfgrib>=0.9.15.1",
    "eccodes>=2.50.0",
    "eccodeslib==2.48.0.26",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "jupyter>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/crc_lab",
    "src/crc_data_explorer",
    "src/data_source_check",
    "src/flood_lab",
    "src/lab_common",
]

[tool.uv]
# rasterio 1.5.2 ships no macOS 14 wheel, so uv compiled it against Homebrew's GDAL, whose own copy of
# Arrow breaks pyarrow in the same process. 1.5.1 has a self-contained macOS 14 wheel.
constraint-dependencies = ["rasterio<1.5.2 ; sys_platform == 'darwin'"]
