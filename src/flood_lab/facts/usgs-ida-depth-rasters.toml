[[fact]]
name = "what_the_depth_is"
claimed = ""
observed = "NOT a hydrodynamic model. Depth = surveyed HWM elevation minus lidar ground elevation, within a 250 m circle around each mark, assuming a single constant water surface across that circle, connected low ground only, ground more than 1 ft below the mark treated as flowing water and removed. Sinks (subways, storm drains) ignored. Buildings inundated only if z_floor <= water level and the building has a subgrade space."
outcome = "confirmed"
source_url = "https://www.sciencebase.gov/catalog/file/get/63badf22d34e92aad3cd279e?f=__disk__74%2F82%2F91%2F74829135b81999cf615c9a3416efcb9003c0de8f"
passage = "\"These depth maps assume a constant water-surface elevation across the landscape around each HWM and show where potential inundation may have occurred during the rainfall event.\" ; \"1) The extent of inundation was limited by the land-surface elevation within a 250-meter distance buffer around each HWM location.\" ; \"5) All potential sinks were ignored.\""
note = "For validation this means the raster at a mark is almost a restatement of that mark (depth = mark minus lidar); it is not an independent observation away from the marks."
verdict_note = ""

[[fact]]
name = "resolution"
claimed = ""
observed = "1-ft cells (\"1-ft discretization\"), snapped to the source lidar. Checked on one raster (NYBRO31256_InundationDepth.tif): extent 1032257..1033231 ft by 236491..236935 ft = 974 x 444 pixels, so 1 ft cells. Depth values in feet."
outcome = "confirmed"
source_url = "https://www.sciencebase.gov/catalog/file/get/63badf22d34e92aad3cd279e?f=__disk__74%2F82%2F91%2F74829135b81999cf615c9a3416efcb9003c0de8f"
passage = "\"The polygons were converted to a tiff file raster with a 1-ft discretization and snapped to match the source lidar.\" ; \"The water depth data is presented as tiff files (raster format), in feet above land-surface elevation (Quantum Spatial, 2018)\""
note = "The metadata sentence \"The lidar has a 1-ft discretization\" is ambiguous (cell size or vertical rounding). Pixel size taken from the raster itself; vertical rounding of the lidar values not checked."
verdict_note = ""

