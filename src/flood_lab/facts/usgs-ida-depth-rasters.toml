[[fact]]
name = "vertical_datum"
claimed = "datum"
observed = "HWM elevations: NAVD88 feet. Ground elevation: NYC 2017 topobathymetric lidar DEM (Quantum Spatial 2018; NAVD88 per NYC). The depth rasters themselves are heights above ground in feet and carry no datum; the metadata page I read does not restate NAVD88 for the lidar."
outcome = "confirmed"
source_url = "https://www.sciencebase.gov/catalog/file/get/63badf22d34e92aad3cd279e?f=__disk__74%2F82%2F91%2F74829135b81999cf615c9a3416efcb9003c0de8f"
passage = "HWM_Measurements_Info.csv attribute: \"Measured_HWM_elevation_in_Feet: Measured elevation of HWM, in feet, referenced to NAVD 1988.\" ; lidar source: \"NYC 2017 LiDAR TopoBathymetric Hydroenforced Unfilled DEM (mosaic)\" (Quantum Spatial, 20180709) ; NYC page states NAVD88 Geoid 12B (see lidar-terrain)."
note = "Lidar datum is inferred from the NYC publication of the same DEM, not from this release."
verdict_note = ""

[[fact]]
name = "method"
claimed = ""
observed = "ArcMap 10.8.1 raster calculator: [HWM elevation raster] minus [lidar mosaicked with building z_floor from the DCP Building Elevation and Subgrade table]; one mark per site (best quality grade, higher elevation if tied). Validation: \"ensure that the inundation depths presented make logical sense\"; no numerical error statistic given. Accuracy depends on HWM, lidar, and first-floor data."
outcome = "confirmed"
source_url = "https://www.sciencebase.gov/catalog/file/get/63badf22d34e92aad3cd279e?f=__disk__74%2F82%2F91%2F74829135b81999cf615c9a3416efcb9003c0de8f"
passage = "\"Inundation rasters were validated to ensure that the inundation depths presented make logical sense in the context of the surroundings and landscape around each HWM.\" ; \"Accuracy of the inundation depth data is dependent on the accuracy of the HWM measurement collected by the U.S. Geological Survey (Capurso and others, 2023), building first-floor elevation dataset(Department of City Planning (DCP), 2023), lidar dataset (Quantum Spatial, 2018), and assumptions and constraints described in the metadata.\""
note = ""
verdict_note = ""

