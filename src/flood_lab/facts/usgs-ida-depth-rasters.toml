[[fact]]
name = "fields"
claimed = ""
observed = "Rasters: single band, depth in feet, ranges differ per mark. Three kinds per site: InundationDepth (outdoors), WaterLevelAbove1stFloor, WaterLevelBelow1stFloor (building footprints). HWM_Measurements_Info.csv columns: Site_name, Measured_HWM_elevation_in_Feet (4.2 to 240.7), Latitude, Longitude (NAD83, 40.58908..40.89424, -74.1566..-73.7651), HWM_measurement_number."
outcome = "confirmed"
source_url = "https://www.sciencebase.gov/catalog/file/get/63badf22d34e92aad3cd279e?f=__disk__74%2F82%2F91%2F74829135b81999cf615c9a3416efcb9003c0de8f"
passage = "'InundationDepth.tif' (depth of water, outside of buildings); 'WaterLevelAbove1stFloor.tif' (depth of water above 1st floor elevation of buildings, in ft); and 'WaterLevelBelow1stFloor.tif' (Distance below 1st floor to water surface, in ft)."
note = "Column names are from the CSV header; the metadata gives ranges 4.2 to 240.7 for the elevation column."
verdict_note = ""

