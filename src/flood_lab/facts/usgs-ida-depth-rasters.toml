known_biases = "Covers only discs of 250 m radius around 83 surveyed marks; everywhere else there is no depth. The depth is the mark minus lidar ground, assuming flat water, so it is derived from the marks and not an independent observation. Drains and subway spaces are ignored and the lidar is 2017, four years before the event."

