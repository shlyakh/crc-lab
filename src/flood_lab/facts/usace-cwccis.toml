[[fact]]
name = "feature_codes"
claimed = "Feature codes (CWWBS) relevant to buildings and to electric power, substation and utility relocation work"
observed = "Table 1 and Table 2 list CWWBS feature codes 02 to 20 with weights: 02 RELOCATIONS 5%; 03 RESERVOIRS 5%; 04 DAMS 15%; 05 LOCKS 2%; 06 FISH & WILDLIFE FACILITIES 5%; 07 POWER PLANT 10%; 08 ROADS, RAILROADS & BRIDGES 10%; 09 CHANNELS & CANALS 3%; 10 BREAKWATER & SEAWALLS 5%; 11 LEVEES & FLOODWALLS 5%; 12 NAVIGATION PORTS & HARBORS 10%; 13 PUMPING PLANT 5%; 14 RECREATION FACILITIES 5%; 15 FLOODWAY CONTROL & DIVERSION STRUCTURE 2%; 16 BANK STABILIZATION 2%; 17 BEACH REPLENISHMENT 2%; 18 CULTURAL RESOURCE PRESERVATION 2%; 19 BUILDINGS, GROUNDS & UTILITIES 5%; 20 PERMANENT OPERATING EQUIPMENT 2%; then COMPOSITE INDEX (WEIGHTED AVERAGE) 100%. For buildings the matching code is 19 (the document gives no narrower building code). For electric power or substation work there is no substation code: the candidates are 19 (the name includes UTILITIES), 07 POWER PLANT (hydropower plant, partly built from the Bureau of Reclamation Turbines and Generators index) and 02 RELOCATIONS (the usual code for relocating utilities, though the document does not define its content). The EM says the feature code list is in ER 1110-2-1302; that ER was not read."
outcome = "confirmed"
source_url = "https://publibrary.sec.usace.army.mil/api/download?id=9fcedc82-37ec-4b3c-e8de-1b9dfc89ebec&filename=CWCCIS_Mar_2026-Combined%20Tables.pdf&token=&preview=true"
passage = " 07 POWER PLANT 10% ; 19 BUILDINGS, GROUNDS & UTILITIES 5% ; 02 RELOCATIONS 5% ; COMPOSITE INDEX (WEIGHTED AVERAGE) 100% (tables 31 March 2026, Table 1, page 23) ; b. Civil Works Work Breakdown Structure Feature Code. The CW Work Breakdown Structure Feature Code can be found in ER 1110-2-1302, CW Cost Engineering. (EM 1110-2-1304, 31 March 2021, page 2) ; e. Bureau of Reclamation Construction Cost Trends. The Turbines and Generators index in this publication is one of the elements used to calculate the cost indices for Feature Code 07, Power Plants."
note = "Which code to use for substations is a choice for the study, not a statement of the document. The document defines no feature code content beyond the names."
verdict_note = ""

[[fact]]
name = "quarters_and_actual_vs_projected"
