observed = "USACE quarters are federal fiscal-year quarters: the column heads print '1Q25' over 'Oct - Dec' of 2024, '2Q25' Jan - Mar 2025, '3Q25' Apr - Jun 2025, '4Q25' Jul - Sep 2025, and the footnote reads 1st QTR = 2 OCT THRU 31 DEC/1 JAN, 2nd QTR = 2 JAN THRU 31 MAR/1 APR, 3rd QTR = 2 APR THRU 30 JUN/1 JUL, 4th QTR = 2 JUL THRU 30 SEPT/1 OCT. August 2025 is therefore in 4Q25 (fiscal year 2025). In the 31 March 2026 tables the headings 1Q26* to 4Q27* (page 24) and FY26* onward (Table 2, page 46) carry an asterisk, and the note says 'FY* indicates data developed based on OMB projections.' So the last actual quarter is 4Q25 (Jul - Sep 2025); all 2026 values (1Q26 = Oct - Dec 2025 to 4Q26 = Jul - Sep 2026) are projected. The September 2025 edition marked 3Q25* and 4Q25* as projected; the March 2026 edition prints them without the asterisk."
