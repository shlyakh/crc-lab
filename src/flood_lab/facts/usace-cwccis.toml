id = "usace-cwccis"
title = "USACE Civil Works Construction Cost Index System (CWCCIS), EM 1110-2-1304: cost indices by feature code, tables revised 31 March 2026"
publisher = "US Army Corps of Engineers (HQUSACE, Engineering and Construction; tables maintained by the Walla Walla District Cost Engineering Branch)"
checked_on = "2026-11-27"
stage = "F6"
level = "facts"
second_reader_stage = ""
used_for = ["FD4"]
known_biases = "The indices are built for USACE civil works construction (dams, levees, locks, power plants, and so on), not for private buildings or electric utility substations; no feature code is a substation or a commercial building. Feature 19 BUILDINGS, GROUNDS & UTILITIES has the same values as features 13, 14, 18 and 20 in every quarter printed. Quarters are US federal fiscal quarters (1Q = October to December of the previous calendar year). In the 31 March 2026 tables every quarter from 1Q26 (Oct-Dec 2025) onward is marked * and is projected from OMB inflation factors, so there is no actual 2026 value; the last actual quarter is 4Q25 (Jul-Sep 2025). The two quarters 3Q25 and 4Q25 were projections in the September 2025 edition and were changed to actual values in the March 2026 edition, so any figure taken from the September 2025 edition for those two quarters differs. The EM itself is dated 31 March 2021 and only points to tables published separately; the escalation instructions copy kept is the 30 September 2019 edition (examples use 2016 to 2019 data). The EM 1110-2-1304 and tables PDFs were fetched from the USACE document library and a web.archive.org copy because www.usace.army.mil, www.nww.usace.army.mil and www.publications.usace.army.mil return HTTP 403 to automated clients."

[[fact]]
name = "revision"
claimed = "Latest revision of EM 1110-2-1304 and of its index tables"
observed = "The manual text is EM 1110-2-1304 dated 31 March 2021 (supersedes the 30 September 2019 edition; 4 pages). It states that the cost index tables are published separately and updated at the end of March and September. The latest tables listed on the Walla Walla District page (archived copy read, 2026) are 'Current CWCCIS Indices 31 March 2026'; the earlier editions listed are 30 September 2025, 31 March 2025, 30 September 2024, 31 March 2024, 30 September 2023, 31 March 2022, 30 September 2021 and 31 March 2021. The 31 March 2026 tables file is 52 pages, footer 'EM 1110-2-1304 31 March 2026', PDF title 'EM 1110-2-1304 31 MAR 2026 CWCCIS': Table 1 quarterly (pages 1 to 38), Table 2 yearly (pages 39 to 49), Table 3 state adjustment factors (page 50), Table 4 historical state adjustment factors (pages 51 to 52). The next update (30 September 2026 tables) was not found on the page read."
outcome = "confirmed"
source_url = "https://www.nww.usace.army.mil/Missions/Cost-Engineering/CWCCIS-Indices/"
passage = "Current CWCCIS Indices 31 March 2026 ; CWCCIS Indices Archive Historical CWCCIS Tables 30 September 2025 31 March 2025 30 September 2024 31 March 2024 30 September 2023 31 March 2022 30 September 2021 31 March 2021 ; EM 1110-2-1304 - 31 March 2021 : This manual supersedes EM 1110-2-1304, dated 30 September 2019. ; 11. Index Tables and Examples. The cost index tables, which are located at https://www.usace.army.mil/Cost-Engineering/CWCCIS-Indices/, will be updated each year at the end of both March and September."
note = "Page read through web.archive.org (snapshot of 2026) because the live site returns 403 to curl and WebFetch. The 31 March 2026 tables PDF was downloaded from the link on that page (publibrary.sec.usace.army.mil). The newest tables are as of 31 March 2026; a 30 September 2026 edition may exist but is not listed on the page read."
verdict_note = ""

