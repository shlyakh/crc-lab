[[fact]]
name = "escalation_procedure"
claimed = "How the document says to escalate a cost from one date to another"
observed = "Instructions for Adjusting Costs Using Tables (file kept is the 30 September 2019 edition of the instructions; the formula is not tied to data). Ratio of the index at the target quarter to the index at the quarter of the known cost, multiplied by the known cost. Both indices must come from the same table and the same feature code. Table 1 for quarters, Table 2 for years. State adjustment factors only after the cost has been moved through time. The EM adds that indexing is for interim use: re-estimate at least every two years and not index more than two consecutive years; forecasts beyond two years may be unreliable."
outcome = "confirmed"
source_url = "https://usace.contentdm.oclc.org/utils/getfile/collection/p16021coll9/id/1552"
passage = "The following formula is used for the purpose of updating/escalating an existing project cost. Cost Index: Quarter A / Cost Index: Quarter B x Cost in Quarter B (Known) = Cost in Quarter A (Unknown). Cost Index A is the cost index for the quarter the project costs are updated to. Cost Index B is the cost index for the quarter the project costs are updated from. Note: Both cost indices must be from the same table and Feature Code. (Figure 1, page 2) ; 2. How to Update a Project Cost. Indices used in any calculation must be from the same table and CWWBS Feature Code. State adjustment factors should only be utilized after the project cost has been moved through time as needed using the appropriate cost indices. (page 1) ; 7. Policy. ... The procedure is to re-estimate project costs using current labor, equipment, and material rates at least every two years and use indexed values to escalate for inflation during the interim. Using index values to update project costs more than two consecutive years is not recommended. 12. Reliability. ... forecasting beyond two years may be unreliable. (EM 1110-2-1304, 31 March 2021, pages 1 and 2)"
note = "Files usace-cwccis/CWCCIS_Instructions_for_Adjusting_Costs.pdf (web.archive.org snapshot of 2026-03-02 of the USACE digital library file; the page footer says EM 1110-2-1304 30 Sep 2019) and usace-cwccis/EM_1110-2-1304_2021.pdf. Whether a March 2026 version of the instructions exists was not established. The text-extraction of the formula in the PDF shows the example numbers garbled, so only the formula words are quoted."
verdict_note = ""

