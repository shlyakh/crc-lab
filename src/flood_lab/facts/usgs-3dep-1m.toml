id = "usgs-3dep-1m"
title = "USGS 3DEP 1 m DEM tiles over the F1 study box (north Brooklyn, 500 m margin)"
publisher = "U.S. Geological Survey, 3D Elevation Program"
checked_on = "2026-11-25"
stage = "F1"
level = "facts"
second_reader_stage = ""
used_for = ["FD2", "FH2"]
known_biases = "Bare-earth model from 2013-14 lidar: buildings, grading, drainage and shoreline changes since then are absent. Water is hydro-flattened (a flat surface, here at -1.62 m), so water depth and channel shape are not terrain. Elevations are NAD83/NAVD88 metres; the tile CRS is EPSG:26918 (NAD83), the project CRS EPSG:32618 (WGS84); the two differ by about a metre at most and the numbers were used unchanged. Flight dates are a project range, not per-flight dates."

[[fact]]
name = "facts_identifier"
claimed = "USGS 3DEP 1 m DEM for the box, vintage before September 2021"
observed = "The National Map API lists 4 tiles of the 1 m DEM intersecting the margin box (total=4): (1) 'USGS one meter x58y451 NY CMPG 2013', project NY_CMPG_2013, published 2020-03-30, 269,599,375 B per API; (2) 'USGS one meter x59y451 NY CMPG 2013', same project, published 2020-03-30, 402,286,182 B; (3) 'USGS one meter x58y451 NJ SdL5 2014', project NJ_SdL5_2014, published 2020-03-30, 34,686,894 B; (4) 'USGS 1 Meter 18 x58y451 NJ_NE6County_B23', project NJ_NE6County_B23, published 2026-09-17, 45,328,865 B. ScienceBase item ids: 5eacfcc382cefae35a25102c (CMPG x58), 5eacfd5f82cefae35a25140e (CMPG x59), 5eacfcc382cefae35a251028 (SdL5 x58), 6aac9d8b1ba49b6a17badefa (B23 x58). Tile ids x58y451 and x59y451 are 3DEP 10 km tile indices (UTM 18N)."
outcome = "confirmed"
source_url = "https://tnmaccess.nationalmap.gov/api/v1/products?datasets=Digital%20Elevation%20Model%20(DEM)%201%20meter&bbox=-73.9941,40.6820,-73.9343,40.7275&max=100"
passage = "items[].title / publicationDate / sizeInBytes / downloadURL, total=4"
note = "The API listed no A24 (2024) or Z18_2014 tiles for this box, unlike the earlier F0 listing of a wider rectangle. The only post-Ida tile is B23 (not downloaded). API sizeInBytes differs by a few kB from the object sizes on S3 (downloaded CMPG x58 is 269,595,298 B, x59 402,288,761 B, SdL5 34,682,947 B)."
verdict_note = ""

[[fact]]
name = "lidar_flight_dates"
claimed = "terrain flown before September 2021 preferred; vintage known"
observed = "NY_CMPG_2013 (x58 and x59 tiles): source lidar begin 2013-08-06, end 2014-04-21. NJ_SdL5_2014 (x58): the same dates are stated, 2013-08-06 to 2014-04-21 (a copy of the CMPG range; the tile holds no data over the box, see coverage_space). NJ_NE6County_B23 (x58): begin 2023-04-13, end 2025-04-09, after Ida; listed, not downloaded. Only the project range is given; the individual flight dates inside the range are not in the tile metadata."
outcome = "confirmed"
source_url = "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1m/Projects/NY_CMPG_2013/metadata/USGS_one_meter_x58y451_NY_CMPG_2013_meta.xml"
passage = "<begdate>20130806</begdate> <enddate>20140421</enddate> ; B23: <begdate>20230413</begdate> <enddate>20250409</enddate> ; ScienceBase dates: {'type': 'Start', 'dateString': '2013-08-06'}, {'type': 'End', 'dateString': '2014-04-21'}"
note = "B23 passage from https://thor-f5.er.usgs.gov/ngtoc/metadata/waf/elevation/1_meter/geotiff/NJ_NE6County_B23/USGS_1M_18_x58y451_NJ_NE6County_B23.xml. 'current' is stated as 'publication date'. Both 2013-14 and the B23 flights straddle nothing relevant: 2013-14 pre-dates 2021-09-01 and 2023-09-29 by years."
verdict_note = ""

[[fact]]
name = "tile_chosen_and_downloaded"
claimed = "download the pre-Ida tile(s) covering the box"
observed = "Downloaded the two NY_CMPG_2013 tiles (672 MB, under the 1.2 GB limit) and the small NJ_SdL5_2014 tile (35 MB) for comparison. USGS_one_meter_x58y451_NY_CMPG_2013.tif alone covers the whole margin box and the study square; x59y451 adds only 6 columns (easting 589994 to 590000), which equal the x58 values to within 1e-6 m, so it is not needed. The SdL5 tile has no data over the box. Total downloaded about 707 MB."
outcome = "confirmed"
source_url = "https://tnmaccess.nationalmap.gov/api/v1/products?datasets=Digital%20Elevation%20Model%20(DEM)%201%20meter&bbox=-73.9941,40.6820,-73.9343,40.7275&max=100"
passage = "x58 raster bounds 579994 to 590006 E, 4499994 to 4510006 N; x59 bounds 589994 to 600006 E"
note = "Reads from f1/terrain/raw/raster_facts_output.txt (script f1/scripts/raster_facts.py, run with uv rasterio<1.5.2) and f1/terrain/raw/raster_water_output.txt"
verdict_note = ""

[[fact]]
name = "horizontal_crs_resolution"
claimed = "1 m cells, project CRS EPSG:32618"
observed = "All three files: CRS EPSG:26918 (NAD83 / UTM zone 18N), pixel size 1.0000000000003024 x 1.000000000000279 m (x58) and 1.0000000000000464 x 1.0 m (x59), size 10012 x 10012 px, float32, LZW. Bounds x58 (579993.9999999972, 4499993.999999997, 590006.0000000002, 4510006.0); x59 (589993.9999999998, 4499994.0, 600006.0000000002, 4510006.0). Nodata value -3.4028234663852886e+38. Tile sizes are 10,000 m plus a 6 m overlap each side."
outcome = "confirmed"
source_url = "f1/terrain/raw/raster_facts_output.txt (script f1/scripts/raster_facts.py, run with uv rasterio<1.5.2)"
passage = "crs EPSG:26918 ... res (1.0000000000003024, 1.000000000000279) size 10012 10012 bounds (579993.9999999972, 4499993.999999997, 590006.0000000002, 4510006.0) nodata -3.4028234663852886e+38 dtype float32 compress lzw"
note = "The raster header carries no vertical CRS (WKT has no VERT_CS)."
verdict_note = ""

