[[fact]]
name = "box_elevation_statistics"
claimed = "min, max, mean elevation for the margin box"
observed = "From USGS_one_meter_x58y451_NY_CMPG_2013.tif, margin box 585000-590000 E, 4504000-4509000 N (5000 x 5000 = 25,000,000 px): min -13.489982 m, max 31.369986 m, mean 9.228181 m, nodata pixels 0, pixels <= 0 m: 2,632,085 (10.53 %), of which exactly 0 m: 0. Study square 585500-589500 E, 4504500-4508500 N (16,000,000 px): min -13.489982, max 31.369986, mean 8.230928, nodata 0, <= 0 m: 1,900,819. The x59 sliver (6 x 5000 px): min 2.46, max 22.77, mean 12.31, no nodata."
outcome = "confirmed"
source_url = "f1/terrain/raw/raster_facts_output.txt (script f1/scripts/raster_facts.py, run with uv rasterio<1.5.2)"
passage = "margin box ... valid 25000000 nodata 0; min -13.490 max 31.370 mean 9.228; <=0 m: 2632085"
note = "Computed locally; the same box on the x58 tile read in raster_water.py gives identical counts."
verdict_note = ""

[[fact]]
name = "water_treatment"
claimed = "water is often hydro-flattened: what does the metadata say"
observed = "The tile metadata carries only the theme keyword Hydro-Flattened and no description of how water was treated. In the raster, 2,570,523 pixels (10.28 % of the margin box, 1,846,518 in the study square) hold exactly -1.62 m, one constant value, consistent with a flat water surface; 32,846 pixels are below -5 m and 28,615 below -10 m (minimum -13.49), values near -12.8 m being the most common among them. What those deep values are (channel or dredged-area bathymetry, or artefacts) is not stated in the metadata and was not determined."
outcome = "confirmed"
source_url = "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1m/Projects/NY_CMPG_2013/metadata/USGS_one_meter_x58y451_NY_CMPG_2013_meta.xml"
passage = "<themekey>Hydro-Flattened</themekey>"
note = "The reading of -1.62 m as the flattened river surface is an inference from the constant value. Pixels at or below 0 m are water for the most part; they are not land terrain."
verdict_note = ""

[[fact]]
name = "coverage_space"
claimed = "tiles cover the margin box"
observed = "x58y451 (CMPG 2013) covers the whole margin box without a nodata pixel. x59y451 covers a 6-pixel strip at the east edge. SdL5 x58y451 covers the same footprint but holds only nodata inside the box. B23 x58y451 footprint is the same tile (westbc -74.0538, eastbc -73.9341, southbc 40.6460, northbc 40.7371)."
outcome = "confirmed"
source_url = "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1m/Projects/NY_CMPG_2013/metadata/USGS_one_meter_x58y451_NY_CMPG_2013_meta.xml"
passage = "<westbc>-74.0538775123266</westbc> <eastbc>-73.9340434991584</eastbc> <northbc>40.7371094337443</northbc> <southbc>40.6458956206065</southbc>"
note = ""
verdict_note = ""

