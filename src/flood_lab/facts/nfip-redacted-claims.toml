[[fact]]
name = "licence"
claimed = "Public"
observed = "FEMA metadata has \"license\": null. The OpenFEMA terms page (read through a page-fetching tool that summarises, because curl got HTTP 403) contains no licence or public-domain wording; it asks users to cite the specific API endpoint including the version, record the access date, and state that the product uses the OpenFEMA API but is not endorsed by FEMA; FEMA and DHS logos may not be used; data provided \"as is\"."
outcome = "not checked"
source_url = "https://www.fema.gov/about/openfema/terms-conditions"
passage = "dataset metadata: license=null ; description: \"FEMA's terms and conditions and citation requirements for datasets (API usage or file downloads) can be found on the OpenFEMA Terms and Conditions page: https://www.fema.gov/about/openfema/terms-conditions.\" ; terms page summary (not verbatim, secondary reading by the fetch tool): \"Users should cite the specific API endpoint (including the version) either by name or preferably by URL.\""
note = "\"Public\" is not stated anywhere I could read. Do not write \"public domain\" on the data card; write \"OpenFEMA terms and conditions; cite endpoint, version and access date; not endorsed by FEMA\". Read the terms page itself in a browser before publication."
verdict_note = ""

[[fact]]
name = "fields"
claimed = "date of loss, year of loss, location fields and precision, amounts paid, cause of damage, flood zone"
observed = "84 fields. dateOfLoss (datetime, \"Date on which water first entered the insured building\", time always T00:00:00.000Z), yearOfLoss; location: state, countyCode (FIPS, \"may not reflect the individual county the property is located\"), censusGeoid (12 digits in the rows read, a block group; field text says \"census block\"), reportedZipCode (5 digits), latitude and longitude (decimal(9,1): ONE decimal place, 0.1 degree), reportedCity (stated \"currently unavailable\"); amounts: amountPaidOnBuildingClaim, amountPaidOnContentsClaim, amountPaidOnIncreasedCostOfComplianceClaim, netBuildingPaymentAmount, netContentsPaymentAmount, netIccPaymentAmount (dollars, decimal(12,2), may be negative), buildingDamageAmount and contentsDamageAmount (dollars, actual cash value); causeOfDamage (code 0 other, 1 tidal water overflow, 2 stream/river/lake overflow, 3 alluvial fan, 4 accumulation of rainfall or snowmelt, ...); ratedFloodZone and floodZoneCurrent (FIRM zones A, AE, AH, AO, X, VE ...); waterDepth (inches, sometimes feet), asOfDate."
outcome = "confirmed"
source_url = "https://www.fema.gov/api/open/v1/OpenFemaDataSetFields?$filter=openFemaDataSet%20eq%20'NfipClaims'%20and%20datasetVersion%20eq%203&$top=1000"
passage = "dateOfLoss datetime \"Date on which water first entered the insured building. When time is not specified in the field, it will default to T00:00:00.000Z\" ; latitude decimal(9,1) \"Approximate latitude of the insured building (to 1 decimal place). This represents the approximate location of the insured property. The precision has been lessened to ensure individual privacy. This may result in a point location that exists in an incorrect county or state. Use the state and county fields for record aggregation for these dimensions\" ; censusGeoid text \"The first digit of the census block number identifies the block group...\" ; causeOfDamage \"4 : Accumulation of rainfall or snowmelt;\" ; reportedCity \"NOTE: the city value is currently unavailable.\" ; asOfDate \"The effective date of the data in the file.\""
note = "Observed in the rows fetched: all 948 distinct rows have dateOfLoss at T00:00:00.000Z; latitude and longitude take values such as 40.6/-73.9 (a 0.1 degree cell is about 11 km by 8 km at New York, larger than most neighbourhoods); causeOfDamage is empty for a few rows (2 in each 2021-09-01 county tally); floodZoneCurrent is empty for 71 of 200 (Kings 2023 window) and 51 of 229 (Queens 2023 window) rows but filled for all 2021 rows. \"More than one cause of loss code can be selected\" per the field text."
verdict_note = ""

[[fact]]
name = "redaction"
claimed = "what redaction does to location and date"
observed = "Location is coarsened to a 0.1 degree grid point, 12-digit census block group id, 5-digit ZIP and county; address, city and policy holder are removed. The date of loss is NOT coarsened: rows carry the day (time 00:00)."
outcome = "confirmed"
source_url = "https://www.fema.gov/api/open/v1/OpenFemaDataSets?$filter=contains(title,%27Claims%27)%20or%20contains(name,%27Nfip%27)%20or%20contains(name,%27Fima%27)"
passage = "dataset description: \"It is derived from the National Flood Insurance Program system of record, staged in the program's reporting platform and redacted to protect policy holder personally identifiable information.\" ; latitude: \"The precision has been lessened to ensure individual privacy.\" ; all dateOfLoss values in rows fetched end in T00:00:00.000Z"
note = "The DELUGE preprint also says redacted claims are identifiable only \"by its Census Tract, Zip Code and the nearest 0.1° × 0.1° degree\"; in v3 the field is a block-group id (12 digits, e.g. 360470702011), finer than a tract."
verdict_note = ""

