id = "nfip-redacted-claims"
title = "OpenFEMA NFIP Redacted Claims (v3, entity NfipClaims)"
publisher = "FEMA, Federal Insurance and Mitigation Administration (OpenFEMA)"
checked_on = "2026-11-25"
stage = "F0"
level = "facts"
second_reader_stage = ""
used_for = ["FT5"]
known_biases = "Only claims on NFIP policies: uninsured, under-insured or out-of-programme losses are missing, and a claim exists only if the owner held a policy and filed. Locations are coarse (0.1 degree, block group) and the dataset is explicitly not an official federal report. Policies cluster in mapped floodplains, so pluvial losses outside them are under-counted."

[[fact]]
name = "identifier"
claimed = "OpenFEMA \"FIMA NFIP Redacted Claims\" (current version, v2) [task statement; requirements section 7 says only \"OpenFEMA\"]"
observed = "The current dataset is \"NFIP Redacted Claims\", identifier openfema-95, entity name NfipClaims, version 3 (web service /api/open/v3/NfipClaims). Version 2 (FimaNfipClaims) is no longer an API entity: the OpenFemaDataSets listing has no such name and https://www.fema.gov/api/open/v2/FimaNfipClaims returns a \"Page not found\" HTML page. The DELUGE preprint cites \"FIMA NFIP Redacted Claims Dataset v2\"."
outcome = "confirmed"
source_url = "https://www.fema.gov/api/open/v1/OpenFemaDataSets?$filter=contains(title,%27Claims%27)%20or%20contains(name,%27Nfip%27)%20or%20contains(name,%27Fima%27)"
passage = "identifier=openfema-95; name=NfipClaims; title=\"NFIP Redacted Claims\"; version=3; webService=https://www.fema.gov/api/open/v3/NfipClaims; depDate=null; listing of names containing Nfip/Fima/Claims: NfipClaims v3, NfipPolicies v3, NfipMultipleLossProperties v1, NfipCommunityStatusBook v1, NfipResidentialPenetrationRates v1 (no FimaNfipClaims)"
note = "The v3 field set was read (84 fields). Whether v2 values equal v3 values for the same claims was not compared."
verdict_note = "The requirements name the dataset and no version. The current version is 3; version 2, which the claim-date preprint used, is no longer served. Recorded so that F8 reads 3."

