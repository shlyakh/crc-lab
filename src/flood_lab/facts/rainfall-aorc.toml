[[fact]]
name = "fields"
claimed = ""
observed = "Eight variables. Precipitation is APCP_surface, long_name 'Total Precipitation', units 'kg/m^2' (equal to mm of liquid water), stored as int16 with scale_factor 0.1, _FillValue -32767, dims (time, latitude, longitude), array shape [8760, 4201, 8401] for a 365-day year, chunks [144, 128, 256], compressor zstd level 3. Hourly accumulation ends at the top of each hour. Other variables: TMP_2maboveground (K), SPFH_2maboveground (g/g per the registry text; kg/kg in a later sentence), DLWRF_surface and DSWRF_surface (W m-2), PRES_surface (Pa), UGRD_10maboveground and VGRD_10maboveground (m s-1)."
outcome = "confirmed"
source_url = "https://noaa-nws-aorc-v1-1-1km.s3.amazonaws.com/2023.zarr/.zmetadata"
passage = "APCP_surface/.zattrs: {'_ARRAY_DIMENSIONS': ['time','latitude','longitude'], '_FillValue': -32767, 'aorc_version': 'v1.1', 'crs': 'EPSG:4326', 'long_name': 'Total Precipitation', 'scale_factor': 0.10000000149011612, 'short_name': 'APCP_surface', 'units': 'kg/m^2'}; APCP_surface/.zarray: chunks [144,128,256], dtype <i2, shape [8760,4201,8401]. Registry: 'one-hour Accumulated Surface Precipitation (APCP) ending at the \"top\" of each hour, in liquid water-equivalent units (kg m-2 to the nearest 0.1 kg m-2)'"
note = ""
verdict_note = ""

[[fact]]
name = "coverage_space"
claimed = ""
observed = "Continental US (from 1979) and Alaska (from 1981) and hydrologically contributing areas; regular latitude/longitude grid, mesh 30 arc seconds (~800 m per the registry; 1 km in the bucket name); netCDF source grid 4201 latitudes 25.0 to 53.0 and 8401 longitudes -125.0 to -67; outermost rows and columns of the stored grid are filled with missing values. CRS attribute: EPSG:4326."
outcome = "confirmed"
source_url = "https://registry.opendata.aws/noaa-nws-aorc/"
passage = "It is defined on a latitude/longitude spatial grid with a mesh length of 30 arc seconds (~800 m), and a temporal resolution of one hour ... 4201 latitude values (ranging from 25.0 to 53.0), and 8401 longitude values (ranging from -125.0 to -67)"
note = ""
verdict_note = ""

[[fact]]
name = "coverage_time"
claimed = ""
observed = "Hourly from 1979-01-01 (CONUS) to the end of 2025: the 2025.zarr store holds 8760 hours and its last valid time value (time/60 chunk, 120 valid of 144) is 2025-12-31 23:00 UTC. No 2026 store exists on 2026-11-25. First store 1979.zarr. Registry says 'to the near-present'; update frequency 'To be determined'."
outcome = "confirmed"
source_url = "https://noaa-nws-aorc-v1-1-1km.s3.amazonaws.com/2025.zarr/time/60"
