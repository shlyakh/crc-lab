id = "rainfall-aorc"
title = "NOAA Analysis of Record for Calibration (AORC) v1.1"
publisher = "NOAA Office of Water Prediction (OWP), served through the NOAA Open Data Dissemination (NODD) program on AWS"
checked_on = "2026-11-25"
stage = "F0"
level = "facts"
second_reader_stage = ""
used_for = ["FH5", "FT5"]
known_biases = "Registry notice of 2026-04-02: about 0.04% of rows were incorrectly masked by brittle pipeline components and the Zarr files were being regenerated; whether corrected data are posted was not found. Data are produced with a 10-day lag so that corrections to the input Stage IV and NLDAS data are included, so AORC precipitation is not independent of Stage IV. Version 1.0 had issues that v1.1 addressed (Fall et al. 2023, Table 1)."

