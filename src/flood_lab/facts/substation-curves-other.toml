[[fact]]
name = "karagiannakis_4_4_1"
claimed = "Hazus anchor values (about 7% at 1.2 m, 15% at about 3 m), section 4.4.1"
observed = "Confirmed, from the arXiv copy 2504.20056 (pdf stamped as the Wiley OA article): section 4.4.1 Flood says HAZUS (FEMA 2013) classifies substations into low, medium and high voltage classes with high vulnerability; threshold of almost 1.2 m with 7% equipment damage for all classes; 15% at the maximum considered depth of approximately 3 m; equipment assumed about 0.91 m above ground. This is Karagiannakis's description of Hazus, not the Hazus table."
outcome = "confirmed"
source_url = "https://arxiv.org/pdf/2504.20056"
passage = "A threshold of almost 1.2 m, representing 7% equipment damage, is applied to all classes. The damage percentage increases to 15% at the maximum considered flooding depth of approximately 3 m (the depth is measured from ground level, assuming that equipment is located about 0.91 m above ground)."
note = "Secondary copy of the article (arXiv, arXiv API says arxiv:doi 10.1002/wcc.930)."
verdict_note = ""

