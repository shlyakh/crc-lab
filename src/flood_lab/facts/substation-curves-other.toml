[[fact]]
name = "williams_components"
claimed = ""
observed = "Three electricity components carry substation curves: 'grid exit point [high-voltage substation]', 'substation [medium-voltage substation]' and 'distribution substation [low-voltage substation]' (p. 6, section 3.2.2; Figure 7, p. 7). No voltage in kV is given, and the paper does not say whether the equipment is indoor or outdoor, which equipment the component holds, or its height above ground. Components were named with stakeholders 'to invoke a typical NZ infrastructure network component'; representative examples are in Data S3 (p. 3), which was not supplied and is not read. Participants were asked to treat facility-based components 'as the sum of all subcomponents within the facility' (p. 3), with Airfield and Port as the examples; the paper does not say whether substations were treated as facilities. The conclusion groups substations and grid exit points among 'above-grade electrical components' (p. 12). Number of responses (Data S4): substation 16, distribution substation 19, grid exit point 14."
outcome = "confirmed"
source_url = "file substation-curves-other/J Flood Risk Management - 2025 - Williams - Expert‐Derived Flood Damage Curves for Critical Infrastructure Network.pdf, pp. 3, 6-7, 12; file substation-curves-other/jfr370045-sup-0004-supinfo.pdf, p. 1"
passage = "p. 6: 'electricity (buried cables, distribution pole, transmission tower, grid exit point [high-voltage substation], substation [medium-voltage substation], distribution substation [low-voltage substation]; Figure 7)'. p. 3: 'In the case of facility-based network components (e.g., Airfield and Port), participants were asked to consider these as the sum of all subcomponents within the facility when making a damage estimate.' p. 12: 'above-grade electrical components (e.g., substations and Grid Exit Points)'. Data S4 Responses (n): Substation 16; Distribution substation 19; Grid exit point (GXP) 14."
note = "Mapping to the lab's assets is ours: the Con Edison area and transmission substations of the study area are high- or medium-voltage in US terms; the NZ classes are not defined in kV, so a mapping by voltage is an assumption [P]."
verdict_note = ""

[[fact]]
name = "williams_depth_definition"
claimed = ""
observed = "The hazard metric is 'water depth' (m) at 0.5, 1, 2 and 3 m. The paper gives a datum only for bridges ('depth relative to height above bottom of deck', p. 5) and stopbanks ('height above top of stopbank', p. 8); for substations no datum is stated: neither 'above ground' nor 'above the equipment base' appears. Experts also weighed flow velocity and duration through the min and max hazard conditions (p. 3)."
outcome = "confirmed"
source_url = "file substation-curves-other/J Flood Risk Management - 2025 - Williams - Expert‐Derived Flood Damage Curves for Critical Infrastructure Network.pdf, pp. 3, 5, 8"
passage = "p. 3: 'Respondents were asked to estimate a minimum (min) and maximum (max) damage percentage for flood water depths of 0.5, 1, 2 and 3 m for each network component (Data S4).' p. 5: 'bridge (depth relative to height above bottom of deck; urban bridge, rural bridge; Figure 5)'. p. 8: 'flood protection (height above top of stopbank; Figure 9)'."
note = "F6 reads it as inundation depth above ground at the substation [P], the lab's DepthAboveGround; this is our reading, not the paper's statement."
verdict_note = ""

[[fact]]
name = "williams_damage_measure"
claimed = ""
observed = "Damage is a 'percentage (%) of damage (i.e., 0% = no damage; 100% = complete damage)' (p. 3, section 2.2). It is not defined as a share of replacement cost, nor as loss of function. The discussion (pp. 10-11) says the curves may be used for loss as 'total component value or replacement cost multiplied by the damage estimate', with a high, unquantified uncertainty in that step. Data S4's heading calls the same numbers 'Damage probability (%)' while its columns say 'Damage percentage (%)'; the paper's definition is the damage percentage."
outcome = "confirmed"
source_url = "file substation-curves-other/J Flood Risk Management - 2025 - Williams - Expert‐Derived Flood Damage Curves for Critical Infrastructure Network.pdf, pp. 3, 10-11; file substation-curves-other/jfr370045-sup-0004-supinfo.pdf, p. 1"
passage = "p. 3: 'Damage estimates were collected as a percentage (%) of damage (i.e., 0% = no damage; 100% = complete damage)'. pp. 10-11: 'are also applicable to assess loss, from direct impact (i.e., total component value or replacement cost multiplied by the damage estimate) to estimate a loss range ... This application must, however, consider the high degree of uncertainty (not considered in the scope of the present study) in assuming the same hazard-consequence relation between direct damage (%) and direct economic loss ($).' Data S4: 'Damage probability (%) represents the mathematically aggregated result of responses for the given network component and hazard conditions'."
note = "As a damage ratio for FR1 (output=Ratio) the values are divided by 100 [I]; using them as a share of replacement value is the use the paper allows with its caveat."
verdict_note = ""

[[fact]]
name = "williams_curve_form"
claimed = ""
observed = "Discrete points only: one minimum and one maximum curve per component at 0.5, 1, 2 and 3 m (abstract, p. 1; section 3.2, p. 4). No value is given at 0 m or above 3 m, and no interpolation rule is stated. For each point Data S4 gives the aggregated value (expertise-weighted mean, Eq. 1, p. 4; weights early career 1, intermediate 2, senior 3, Table 1, p. 3) and the 50th, 5th and 95th percentiles of the responses. In Figure 7 (p. 7) triangles are the mean, boxes the 25th and 75th percentiles, whiskers the 5th and 95th."
outcome = "confirmed"
source_url = "file substation-curves-other/J Flood Risk Management - 2025 - Williams - Expert‐Derived Flood Damage Curves for Critical Infrastructure Network.pdf, pp. 1, 3-4, 7"
passage = "p. 1 (abstract): 'The 12 semi-structured workshops record responses for estimated minimum and maximum damage ratios at 0.5, 1, 2 and 3 m water depths. The 46 responses, weighted by participant expertise level, are aggregated into a discrete minimum and maximum damage curve for each component.' p. 4: 'The mathematically aggregated damage percentages (%) at 0.5, 1, 2 and 3 m water depths are presented for each infrastructure network component at the maximum (max) and minimum (min) hazard conditions, including reporting the 5th, 50th and 95th percentiles of each.'"
note = "For FR1 a table must run from 0 m to a stated maximum: the 0 m point (0) and the value held above 3 m are ours and tagged [P]; linear interpolation between 0.5, 1, 2 and 3 m is the FR1 rule, not the paper's."
verdict_note = ""

