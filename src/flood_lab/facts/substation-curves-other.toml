[[fact]]
name = "williams_elicitation"
claimed = "These curves are specific to New Zealand"
observed = "Expert elicitation in Aotearoa New Zealand: 12 semi-structured workshops (about 20 min to 2.5 h each), 46 experts (31 practitioners, 15 researchers), each estimating minimum and maximum damage percentages at 0.5, 1, 2 and 3 m for the components of their expertise; responses weighted by self-assigned expertise (Table 1) and aggregated by a weighted mean (Eq. 1); no calibration questions, no behavioural consensus. Ethics approval University of Canterbury HREC 2022/136. Responses concentrate in two regions of NZ (p. 11). The authors say the curves are bespoke to NZ, do not transfer well, and were not validated against observed damage; benchmarking (section 3.3, Figure 11, p. 8) found literature substation curves 'consistently lower than the max model' and lower than the min model 'by some margin'."
outcome = "confirmed"
source_url = "file substation-curves-other/J Flood Risk Management - 2025 - Williams - Expert‐Derived Flood Damage Curves for Critical Infrastructure Network.pdf, pp. 2-4, 8, 11"
passage = "p. 3: 'A total of 12 individual workshops were conducted, with the participation of 46 experts.' p. 4: 'Of the participants who recorded responses (n = 46), 68% (n = 31) were practitioners (asset owners/operators and engineering consultants) and 32% (n = 15) were researchers.' p. 8: 'Substations and water pump stations are the only literature-based flood damage curves that are consistently lower than the max model in the present study, with substations also being consistently lower than the min model by some margin.' p. 11: 'there is a higher concentration of responses from two regions of the country'."
note = """
Comparison at the depths of Williams's points (damage ratio; inundation depth above ground assumed for all three, [P] for Williams):
| depth | Nirandjan F2 | Bor 2026 EDR | Williams GXP min-max | Williams substation min-max | Williams distribution min-max |
| 0.5 m | 0.033 | 0.032 | 0.140-0.341 | 0.143-0.334 | 0.146-0.347 |
| 1 m   | 0.063 | 0.171 | 0.220-0.455 | 0.250-0.484 | 0.274-0.510 |
| 2 m   | 0.096 | 0.501 | 0.367-0.610 | 0.420-0.648 | 0.433-0.662 |
| 3 m   | 0.157 | 0.737 | 0.488-0.697 | 0.524-0.755 | 0.513-0.765 |
Nirandjan: spreadsheet values at those depths (substation-curves-nirandjan, rows 16, 26, 46, 66). Bor: our calculation [I] of Eq. 2 (p. 20 of arXiv 2605.23053v1) from Table 1 (HV, >345 kV): EDR = sum of dr_i (P_i - P_i+1), P_i = Phi(ln(d/theta_i)/0.40). Williams: Data S4 aggregated values / 100. Williams lies 4 to 11 times above Nirandjan at 0.5 m and 3 to 5 times at 3 m; Bor matches Nirandjan at 0.5 m and lies near Williams's max at 3 m, falling between Williams's min and max at 2 m and below Williams's min at 1 m and 0.5 m.
"""
verdict_note = ""

