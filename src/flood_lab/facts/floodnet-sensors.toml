passage = """
lowest_point_height_delta_inches | number | Difference in elevation, in inches, between the surface beneath the sensor (i.e., the surface being monitored for flooding) and the lowest point in the immediate local area, where flood water is expected to accumulate first.
date_removed | calendar_date | The date that the sensor was removed from this location, if applicable."""
