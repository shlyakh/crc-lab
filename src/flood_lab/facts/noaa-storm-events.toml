[[fact]]
name = "time_zone"
claimed = "time zone handling"
observed = "Times are in local standard time of the county or zone (\"usually in LST\"), with the zone in CZ_TIMEZONE. All 122 rows for the five New York City counties in 2021 and 2023 say EST-5, including events in September when New York is on daylight time, so the text clock is EST (UTC-5), one hour behind the wall clock. Dates here were matched on that EST clock as written."
outcome = "confirmed"
source_url = "https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/Storm-Data-Bulk-csv-Format.pdf"
passage = "PDF: \"begin_date_time Ex: 04/1/2012 20:48:00 MM/DD/YYYY hh:mm:ss (24 hour time usually in LST)\" ; \"cz_timezone Ex: EST-5, MST-7, CST-6 Time Zone for the County/Parish, Zone or Marine Name.\" ; file: select CZ_TIMEZONE,count(*) from n group by 1 -> [(EST-5,122)]"
note = "Sensitivity of the counts to the clock: shifting all times +1 hour (EST to EDT) changes events covering 2021-09-01 from 36 to 35, 2021-09-02 from 4 to 8, and 2023-09-29 stays 15. \"usually\" means the PDF does not guarantee LST for every row."
verdict_note = ""

