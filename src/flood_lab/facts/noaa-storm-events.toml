id = "noaa-storm-events"
title = "NOAA Storm Events Database, bulk CSV files"
publisher = "NOAA National Centers for Environmental Information (NCEI), from National Weather Service reports"
checked_on = "2026-11-25"
stage = "F0"
level = "facts"
second_reader_stage = ""
used_for = ["FV5", "FT5"]
known_biases = "Events are what the National Weather Service office for a county chose to enter, from spotters, public, media, officials and gauges; reporting depends on population, observers and office practice, so a flash flood entry means somebody reported it, and no entry means only that nobody did. Damage fields are estimates and are often 0.00K."

