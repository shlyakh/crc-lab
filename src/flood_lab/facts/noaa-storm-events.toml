[[fact]]
name = "fields"
claimed = "fields with units"
observed = "Details file has 51 columns (BEGIN_YEARMONTH ... EVENT_NARRATIVE, DATA_SOURCE); the PDF documents 50 of them and does not describe DATA_SOURCE (value \"CSV\" in all 136,982 rows of the two files). Units: injuries and deaths in persons; DAMAGE_PROPERTY and DAMAGE_CROPS in dollars as text with K or M suffix (\"10.00K = $10,000; 10.00M = $10,000,000\"); MAGNITUDE in knots (wind) or inches (hail), not used for floods; BEGIN_RANGE and END_RANGE in miles; TOR_LENGTH miles; TOR_WIDTH yards; coordinates decimal degrees; FLOOD_CAUSE text (\"Reported or estimated cause of the flood\", e.g. Heavy Rain). Locations file: YEARMONTH, EPISODE_ID, EVENT_ID, LOCATION_INDEX, RANGE, AZIMUTH, LOCATION, LATITUDE, LONGITUDE, LAT2, LON2."
outcome = "differs"
source_url = "https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/Storm-Data-Bulk-csv-Format.pdf"
passage = "PDF: \"damage_property Ex: 10.00K, 0.00K, 10.00M The estimated amount of damage to property incurred by the weather event (e.g. 10.00K = $10,000; 10.00M = $10,000,000)\" ; \"begin_range Ex: 0.59, 0.69, 4.84, 1.17 (in miles)\" ; \"flood_cause Ex: Ice Jam, Heavy Rain, Heavy Rain/Snow Melt  Reported or estimated cause of the flood.\" ; locations PDF names \"lat\" and \"lon\", the 2021 locations file header is: YEARMONTH,EPISODE_ID,EVENT_ID,LOCATION_INDEX,RANGE,AZIMUTH,LOCATION,LATITUDE,LONGITUDE,LAT2,LON2"
note = "Outcome \"differs\" is about the documentation, not about requirements.md: the documentation (PDF) and the files disagree in three places. (1) Locations columns are LATITUDE, LONGITUDE, LAT2, LON2 plus YEARMONTH, not lat and lon; LAT2/LON2 look like the same coordinates times 100000 (3817400, 9859400 for 38.29/-98.99, not explained in the PDF). (2) Date-time text in the files is \"01-SEP-21 22:00:00\" (DD-MON-YY), the PDF shows MM/DD/YYYY. (3) DATA_SOURCE is undocumented."
verdict_note = "Here it is the publisher's documentation that differs from the publisher's files; the requirements make no claim about the fields."

[[fact]]
name = "flood_event_types"
claimed = "Flash Flood, Flood, Heavy Rain, Coastal Flood"
observed = "All four exist in the permitted event list. Flash Flood and Flood and Heavy Rain are county-based (C); Coastal Flood is zone-based (Z). Also in the list: Lakeshore Flood (Z), Storm Surge/Tide (Z), Debris Flow (C)."
outcome = "confirmed"
source_url = "https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/Storm-Data-Bulk-csv-Format.pdf"
passage = "PDF Table from NWS Directive 10-1605 section 2.1.1: \"Coastal Flood Z ... Debris Flow C ... Flash Flood C ... Flood C ... Heavy Rain C ... Lakeshore Flood Z ... Storm Surge/Tide Z\""
note = "Consequence: a Coastal Flood entry for New York City is written against a forecast zone (e.g. SOUTHERN QUEENS), not a county, so a county filter misses it (the two files hold one: SOUTHERN QUEENS, zone type Z)."
verdict_note = ""

[[fact]]
name = "place_representation"
claimed = "county or zone FIPS, begin and end coordinates"
observed = "Each event carries CZ_TYPE (C county or parish, Z NWS public forecast zone, M marine), CZ_FIPS (county FIPS or zone number), CZ_NAME, STATE and STATE_FIPS, WFO, plus BEGIN_LAT/BEGIN_LON and END_LAT/END_LON (decimal degrees; in the New York rows 2 to 4 decimals) and begin/end range-azimuth-location text. Further points in the locations file (LOCATION_INDEX per event). For the five New York City counties: CZ_TYPE C, CZ_FIPS (unpadded in the file) 5 Bronx, 47 Kings, 61 New York, 81 Queens, 85 Richmond."
outcome = "confirmed"
source_url = "https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/Storm-Data-Bulk-csv-Format.pdf"
passage = "PDF: \"cz_type Ex: C, Z , M  Indicates whether the event happened in a (C) County/Parish, (Z) NWS Public Forecast Zone or (M) Marine.\" ; \"begin_lat Ex: 29.7898 The latitude in decimal degrees of the begin point of the event or damage path.\" ; file: duckdb, STATE='NEW YORK' and CZ_TYPE='C': BRONX 5 (18 events), KINGS 47 (28), NEW YORK 61 (17), QUEENS 81 (44), RICHMOND 85 (15) in 2021+2023"
note = ""
verdict_note = ""

