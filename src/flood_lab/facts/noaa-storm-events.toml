[[fact]]
name = "events_nyc_counties_2021-09-01"
claimed = ""
observed = "Five New York City counties (county-type events), events covering 2021-09-01 on the EST clock: Flash Flood 36, all other types 0 (Flood 0, Heavy Rain 0, Coastal Flood 0, Thunderstorm Wind 0). Events whose BEGIN date is 2021-09-01: 36. Flash Flood by county: BRONX 5, KINGS 7, NEW YORK 4, QUEENS 13, RICHMOND 7. Coastal Flood in the New York zones on this date: 0."
outcome = "not applicable"
source_url = "file via duckdb (script f0/scripts/noaa_counts.py, output f0/noaa_counts.out)"
passage = "filter: STATE=NEW YORK, CZ_TYPE=C, CZ_FIPS in (5,47,61,81,85); parsed BEGIN_DATE_TIME/END_DATE_TIME as written (EST); an event counts if date(begin) <= 2021-09-01 <= date(end). Result by EVENT_TYPE: [(Flash Flood, 36)]. Begin-date-only: [(Flash Flood, 36)]"
note = "All three dates have flash flood entries. The 2021-09-02 events began on 2021-09-01 at 23:56 EST (one of the four) or after midnight; 2021-09-01 holds 36 events, most at 17:45-23:00 EST. Largest damage entry for 2021-09-01 in the five counties: 54.00M (event 987540, New York county)."
