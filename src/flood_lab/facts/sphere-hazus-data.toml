[[fact]]
name = "assignment_rule"
claimed = ""
observed = "SPHERE assigns curves from flDmgXRef.csv in default_vulnerability.py (HazusFloodAnalysis, the fl*.csv path; HazusFloodAnalysis2 in hazus_flood2.py uses the inland-consequences tables instead). Basement = 1 when foundation_type is 'B' or 4, else 0 (line 116). A row matches when Occupancy equals the building's occupancy exactly, Basement equals the flag, StoriesMin <= number_stories < StoriesMax and Hazard<R|CA|CV> = 1 (lines 154-163; again 204-213). Riverine ('R') is used for every building with depth > -5 when the flood type is 'R' (lines 119-124); hazus_flood.py sets flood_peril_type 'R' where empty (line 364). Pandas path: the first matching row in file order (argmax, line 219); no match gives id 0 (line 222). DuckDB path (gather_damage_functions): every matching row with weight 1/count (lines 425-448, weight at line 429), so overlapping rows are averaged; buildings with no match get the first cross-reference row with the same first four occupancy letters, ordered by StoriesMin (gather_missing_functions, lines 460-488)."
outcome = "confirmed"
source_url = "https://github.com/Niyam-Projects/sphere/blob/2967fe660981a185579d6257c3d9df341b695687/packages/flood/src/sphere/flood/default_vulnerability.py"
passage = "line 116: gdf['Basement'] = self.buildings.foundation_type.isin(['B', 4]).astype(int); lines 157-163: stories_match = ((... >= ...StoriesMin) & (... < ...StoriesMax)) ... occupancy_match = ... == ...Occupancy ... basement_match = ... == ...Basement; line 219: matches = lookup_values[all_conditions.argmax(axis=1)]; line 222: matches[all_conditions.sum(axis=1) == 0] = 0; line 429: 1.0 / COUNT(*) OVER (PARTITION BY b.id) AS weight; lines 481-483: WHERE LEFT(b.occupancy_type, 4) = LEFT(x.Occupancy, 4) ORDER BY x.StoriesMin LIMIT 1"
note = "Line 105 replaces 'RES3' followed by a non-digit with 'RES3', which leaves the text unchanged."
verdict_note = ""

[[fact]]
name = "first_floor_missing"
claimed = ""
observed = "SPHERE's DuckDB loss path treats a missing first-floor height as 0: the depth read on a curve is hazard depth minus COALESCE(first_floor_height, 0) (default_vulnerability.py line 570; the same in hazus_flood2.py line 634), clamped to the curve's depth range (lines 576-588). The pandas path subtracts first_floor_height without a default (hazus_flood.py line 81). The lab does not take this rule: a building without a first-floor height is handled by its own rule at the event-loss step."
outcome = "confirmed"
source_url = "https://github.com/Niyam-Projects/sphere/blob/2967fe660981a185579d6257c3d9df341b695687/packages/flood/src/sphere/flood/default_vulnerability.py"
passage = "default_vulnerability.py line 570: '(h.depth - COALESCE(b.first_floor_height, 0)) AS eval_depth'; hazus_flood2.py line 634: '(h.depth - COALESCE(b.first_floor_height, 0)) AS eval_depth'; hazus_flood.py line 81: 'self.buildings.flood_depth - self.buildings.first_floor_height'"
note = ""
verdict_note = ""

[[fact]]
name = "assignment_vs_fast"
claimed = ""
observed = "For the 17,744 buildings of site/flood/data/assets_oed.csv (334 combinations of lab_occupancy_hazus, NumberOfStoreys and basement flag; flag = lab_subgrade Y/N, else lab_foundation_type 'B' or another stated type, as floors_values.py does), SPHERE's riverine cross-reference (first match) and FAST's rule (hazpy UDF.py) give the same structure curve for 17,743 buildings and differ for 1 [I]: B-3000349, EDU2, NumberOfStoreys 1900, no basement: FAST 652, SPHERE none (StoriesMax 1000). 5,842 buildings get no curve from either (no occupancy or storeys, or NSI occupancy codes with suffixes such as RES1-2SWB). No combination present matches more than one cross-reference row. Outside the data the rules also differ for storeys below 1 (SPHERE none, FAST a curve), for RES1 with a fractional storey count (FAST split level 111/112; SPHERE 129 and 111 overlap at 1.5 to 1.6, 107/108 at 2.5) and for RES2 with 2 or more storeys (SPHERE none, FAST 189). So the lab keeps FAST's assignment rule and takes only the values from SPHERE."
outcome = "confirmed"
source_url = "https://github.com/Niyam-Projects/sphere/blob/2967fe660981a185579d6257c3d9df341b695687/packages/data/src/sphere/data/flDmgXRef.csv"
passage = "flDmgXRef.csv: '652,...,EDU2,0,7,1000,1,...'; '129,...,RES1,0,1,2,1,...', '111,...,RES1,0,1.5,1.6,1,...', '189,...,RES2,0,1,2,1,...'. Script output: 'DISAGREE EDU2 1900.0 False FAST 652 SPHERE None buildings 1 / combinations 334 buildings agree 17743 disagree 1 / multi []'"
note = "1900 storeys is most likely a year entered as a storey count; it is a fault in the asset table, not in either rule. Tested in tests/flood/test_f6_curves.py."
verdict_note = ""

