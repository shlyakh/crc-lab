[[fact]]
name = "fields"
claimed = "row count and schema [V]"
observed = "Six physical columns: uuid (string), area_km2 (double), geometry (binary, WKB), start_date (string YYYY-MM-DD), end_date (string YYYY-MM-DD), __index_level_0__ (int64, a pandas index written by accident, not documented). Documented columns (paper Table 2): uuid, area_km2, start_date, end_date, geometry. Row count 2,646,302 (paper: 2,646,302). No nulls; uuid unique (2,646,302 distinct)."
outcome = "confirmed"
source_url = "https://eartharxiv.org/repository/view/12083/ (Table 2); file schema via pyarrow"
passage = "Table 2: \"uuid  A unique identifier for each record. | area_km2  Area of the reported location polygon. | start_date  The initial day (formatted as YYYY-MM-DD) for which there is documented textual evidence of an ongoing flood. | end_date  The final consecutive day (formatted as YYYY-MM-DD) for which there is documented evidence of the flood. If the aggregated news reports only indicate flooding on a single day, the end date is identical to the start date. | geometry  The spatial boundary of the reported location, utilizing the standard WGS 84 coordinate reference system (EPSG:4326)...\" ; text: \"The dataset consists of 2,646,302 individual records.\" ; file: pyarrow num_rows=2646302, columns uuid:string, area_km2:double, geometry:binary, start_date:string, end_date:string, __index_level_0__:int64"
