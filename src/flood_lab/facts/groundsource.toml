[[fact]]
name = "geometry_representation"
claimed = "date range, place polygon, area_km2"
observed = "Polygon (2,478,877 rows) or MultiPolygon (167,425 rows), stored as WKB bytes in the column geometry, CRS WGS 84 EPSG:4326 (x = longitude, y = latitude), GeoParquet metadata version 0.4.0 written by geopandas. Not points: a place with no polygon in the geocoder is a point buffered by 0.001 degrees, which is a polygon."
outcome = "confirmed"
source_url = "https://eartharxiv.org/repository/view/12083/ (Sections 2.3, Table 2); file geo metadata"
passage = "geo metadata: \"encoding\": \"WKB\", \"crs\": {... \"name\": \"WGS 84\" ... \"id\": {\"authority\": \"EPSG\", \"code\": 4326}}, \"geometry_type\": [\"MultiPolygon\", \"Polygon\"], \"version\": \"0.4.0\" ; paper 2.3: \"a small spatial buffer of 0.001° is applied around the returned point to generate a representative, two-dimensional geometry\" ; duckdb st_geometrytype: POLYGON 2478877, MULTIPOLYGON 167425"
note = "DEFECT in the file: the GeoParquet metadata uses the key \"geometry_type\" where the specification has \"geometry_types\"; DuckDB (2.0.1 with spatial) refuses to open the file with \"Geoparquet column 'geometry' does not have geometry types\". A reader must drop the geo metadata (done here with pyarrow replace_schema_metadata(None)) or read with pyarrow/geopandas. The CRS axis order in the PROJJSON is lat, lon, but the coordinates in the WKB are x=lon, y=lat (first row: lon 8.6, lat 54.8, which is in northern Europe)."
verdict_note = ""

[[fact]]
name = "area_km2_meaning"
claimed = "Document that area_km2 is the area of the named place, not of the flood."
observed = "area_km2 is the area of the geometry polygon of the reported place: the documentation says \"Area of the reported location polygon\". Checked on the file: on a random sample of 30,000 rows, area_km2 equals the geodesic (spheroid) area of the row geometry within 1% in 99.9% of rows (median ratio 1.0000000001). So it is the place, not the flood."
outcome = "confirmed"
source_url = "https://eartharxiv.org/repository/view/12083/ (Table 2)"
passage = "Table 2: \"area_km2  Area of the reported location polygon.\" ; script f0/scripts/gs_checks.py: area_km2 / (ST_Area_Spheroid(geometry)/1e6) over 30000 sampled rows: quantiles [0, 1%, 5%, 50%, 95%, 99%, 100%] = 0.923, 0.9977, 0.9995, 1.0000, 1.00046, 1.0021, 1.067 ; share within 1% = 0.99913"
note = "The paper also says: \"the dataset structure is entity-based rather than meteorology-based. Therefore, a single large-scale meteorological flood may result in multiple separate entries\". Place size filter: events with area over 5,000 km2 or diameter over 500 km are discarded (file max area_km2 = 4998.83)."
verdict_note = ""

[[fact]]
name = "production"
claimed = "how the records were produced"
observed = "News articles (about 7.5 million processed, about 5 million judged by the LLM to report an actual flood) read in 80 languages, translated to English with Cloud Translation, then Gemini extracts flooded places and dates; places are tied to WebRef entities or geocoded with the Google Maps Geocoding API to polygons; same-place reports on the same or consecutive days are merged into one row; places over 5,000 km2 or 500 km across, runs over 7 days and dates before 2000 are dropped."
outcome = "confirmed"
source_url = "https://eartharxiv.org/repository/view/12083/ (Section 2) and https://research.google/blog/introducing-groundsource-turning-news-reports-into-data-with-gemini/"
passage = "paper: \"In total, approximately 5 million of the 7.5 million processed articles were identified by the LLM as reporting an actual flood event.\" ; \"Entries reporting the exact same location on the same day, or on consecutive days, are concatenated.\" ; blog: \"The system identifies granular locations (neighborhoods and streets) and maps them to standardized spatial polygons using Google Maps Platform.\""
note = "The paper is \"a non-peer-reviewed preprint\" and \"an unreviewed preprint\" (EarthArXiv, March 9, 2026)."
verdict_note = ""

[[fact]]
name = "precision"
claimed = "stated precision or error rates"
observed = "Manual review of 400 random rows: 60% +/- 5% (95% CI) Accurate (place polygon and dates both match the article); a further 22% Approximate or Partial, so 82% practically useful; 18% Wrong. Earlier pipeline steps on 125 hand-labelled articles: classification 75% precision, 90% recall; dates 61% precision, 74% recall; places 64% precision, 69% recall. Recall against GDACS floods 2020-2026: 85% to 100% of severe events. Errors are stated not to be i.i.d.; no regional breakdown is given."
outcome = "confirmed"
source_url = "https://eartharxiv.org/repository/view/12083/ (Section 4.1)"
passage = "\"Based on this manual review, the pipeline achieved a precision of 60% ± 5% (95% CI), representing entries where both the extracted location and dates perfectly matched the source text (the 'Accurate' category). An additional 22% of the entries were classified as either 'Approximate' or 'Partial.' ... The remaining 18% of evaluated entries were classified as 'Wrong' and considered unusable.\" ; \"we report only the global precision metric.\""
note = "Failure modes named: same place name in several countries or states, date offsets from relative dates (\"the past weekend\", \"last September\" imputed as September 1st). The last matters here: 2021-09-01 is the first of a month."
verdict_note = ""

