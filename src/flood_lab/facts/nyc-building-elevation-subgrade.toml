stage = "F0"
level = "facts"
second_reader_stage = ""
used_for = ["FD5"]
known_biases = "Everything comes from what a vendor's operators could see in street-level photos and LiDAR from the road: buildings hidden by construction or obstruction (135,503 rows) have estimated grade, 14,039 rows have no measurement (value 0), and subgrade space reachable only from inside (cellars in large buildings) is not recorded, so 'no subgrade' means 'none seen'. Small accessory buildings such as sheds are excluded. The 1,000-row sample fetched is the first 1,000 by BIN and covers Manhattan only."

