[[fact]]
name = "fields"
claimed = ""
observed = "30 columns incl. computed regions. Main: bin (number, DOB building id), bbl (text, from the 22v1 DOB footprints), borough (code 1 Manhattan, 2 Bronx, 3 Brooklyn, 4 Queens, 5 Staten Island), block, lot, address, z_grade (number, FEET, NAVD88: elevation of the lowest adjacent grade), z_floor (number, FEET, NAVD88: elevation of the lowest actively used floor), subgrade (text), notes1, notes2, notes3 (text), x, y (NAD83 State Plane), latitude, longitude (WGS84), pluto_bbl, council, borocd, ctlabel, boroct2020, nta2020, ntaname, cdta2020, cdtaname. The data dictionary spells the notes fields notes_1..3 and the datum NADV88 in one place; the table has notes1..3."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/api/views/bsin-59hv.json"
passage = """
z_grade | number | The elevation of the building at it's lowest adjacent grade - the lowest point where the building touches the ground (feet).
z_floor | number | The elevation of what is estimated to be the lowest actively used floor (feet)
[dictionary, Column Information] z_grade ... Feet, recorded in the NAVD88 vertical datum"""
note = "Vertical datum NAVD88 (feet). Horizontal: NAD 1983 (x, y in State Plane feet; latitude and longitude WGS84). Street level elevation is not provided: \"This study does not contain measurements that indicate street level elevation.\""
verdict_note = ""

[[fact]]
