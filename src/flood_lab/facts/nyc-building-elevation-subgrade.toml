[[fact]]
name = "grade_estimates"
claimed = "read the guidance note on estimated grades"
observed = "Grade and floor were read by vendor operators from street-level LiDAR point clouds and photo imagery (captured every 16 feet, March to July 2021 per the dictionary). Where the lowest adjacent grade was below street level or hidden, the value is an estimate from context clues (door or window height); the estimate is flagged only through notes1 ('Property not Visible Due to Construction or Obstruction', 135,503 rows, or 'Property not Visible from Street', 12,082 rows; 147,585 in all), and there is no record of which of grade or floor was estimated. A value of 0 means no measurement: z_grade = 0 in 14,039 rows, z_floor = 0 in 14,038 (14,038 rows have both at 0, one row has z_grade 0 only). The estimated accuracy is called 'reasonable' without a figure."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/api/views/bsin-59hv/files/ae1b369c-6ce1-4805-9ad0-aca9f62f3182"
passage = """
In many instances where the lowest adjacent grade was below street level, the derived measurement in the dataset is an estimate. Any building centroid that has an estimated grade elevation will note “Property not visible due to construction or obstruction” under note_1. Estimates were made by individual data operators based on context clues in the imagery.
[dictionary] While note_1 records if estimates were taken, there is no record of which of the two observed measurements (or both) was the estimated value. DCP has established that the accuracy of estimated spot elevations is reasonable provided that one of the methodologies previously described has been followed.
[dictionary, z_grade] When no measurement has been taken, the field value will be 0"""
note = "The guidance PDF and the Excel dictionary disagree on dates: the dataset description says imagery \"collected ... between March and July of 2021\" and the limitations row says \"only records what was captured by the data vendor between March and August of 2022\"; the footprints are the DOB file of 2022-02-26. Counts from API queries: notes1 like '%Construction or Obstruction%' = 135503; notes1 like '%Not Visible%' or '%not Visible%' = 147585; z_grade=0 -> 14039; z_grade=0 and z_floor=0 -> 14038; z_floor=0 and z_grade>0 -> 0."
verdict_note = ""

[[fact]]
name = "subgrade_flag"
claimed = "subgrade-space flag"
observed = "Column subgrade is text with two values: 'Y' (472,003 rows) and 'N' (389,873 rows); the dictionary calls them Yes/No. 'Y' requires a space below street level not solely for parking AND a door or window through which water may enter, seen from outside. notes3 is filled exactly for the 472,003 'Y' rows ('Visible Door or Window in subgrade space', 310,268; the same plus 'Negative grade driveway walkway leading down to subgrade space', 161,735)."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/resource/bsin-59hv.json?$select=subgrade,count(*)&$group=subgrade"
passage = "[{\"subgrade\":\"Y\",\"count\":\"472003\"},{\"subgrade\":\"N\",\"count\":\"389873\"}]"
note = "Dictionary: \"There are two requirements for a structure to be marked \"Yes\" as having a subgrade space. There must be a space that goes below street level that is not solely designated for parking and there must be a door or window through which water may enter the structure.\" Guidance: \"This dataset should not be treated as an inventory of subgrade spaces in New York City.\""
verdict_note = ""

