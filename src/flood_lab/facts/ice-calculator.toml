id = "ice-calculator"
title = "Interruption Cost Estimate (ICE) Calculator 2.x"
publisher = "Lawrence Berkeley National Laboratory and Resource Innovations, Inc. (icecalculator.com)"
checked_on = "2026-11-25"
stage = "F0"
level = "facts"
second_reader_stage = ""
used_for = ["FM5"]
known_biases = "Costs are for interruptions up to 24 hours only (long outages are outside the survey-based method); the model is a survey-based econometric model (4,156 residential and 5,287 non-residential responses in 2.2); the underlying equations and coefficients are copyrighted and licensed, not published. The 2.0-versus-2.2 memorandum shows estimates changed between versions."

[[fact]]
name = "identifier"
claimed = "ICE Calculator 2.0 released 2025-04-28, 2.2 in February 2026"
observed = "Release dates from the site's own bundle (main-22UAKSGH.js, version table; JavaScript months are zero-based): interruption.2.0.0 new Date(2025,3,26) = 2025-04-26; interruption.2.1.0 new Date(2025,7,24) = 2025-08-24; interruption.2.2.0 new Date(2026,1,19) = 2026-02-19 ('New interruption cost model based on results from the Phase 1 and Phase 2 surveying activities'); Guam and Puerto Rico models 1.0.0 also 2026-02-19. The LBNL memo says version 2.0 was 'released in April 2025'. So 2.2 in February 2026 is confirmed; the day of 2.0 is 26 April per the site bundle, not 28 April."
outcome = "differs"
source_url = "https://icecalculator.com/main-22UAKSGH.js"
passage = "\"interruption.2.0.0\":{version:\"interruption.2.0.0\",releaseDate:new Date(2025,3,26) ... \"interruption.2.1.0\" ... new Date(2025,7,24) ... \"interruption.2.2.0\":{version:\"interruption.2.2.0\",releaseDate:new Date(2026,1,19),isDeprecated:!1 ; memo: 'version 2.0 (released in April 2025)'"
note = "Day of 2.0 release inferred from the app's own version table; the memo gives only the month."
verdict_note = ""

[[fact]]
name = "customer_classes"
claimed = "residential and non-residential"
observed = "Version 2.2 interruption model: two sectors, 'residential' and 'non-residential' (chunk for interruption.2.2.0). The main app bundle also defines a three-sector layout (Residential, Small-Medium Non-Residential, Large Non-Residential & Public Sector) for some other model version or region; which one was not determined. The 2.0/2.2 memo counts 'residential and non-residential' responses. Models for Guam and Puerto Rico are separate."
outcome = "confirmed"
source_url = "https://icecalculator.com/chunk-YS3XBJST.js"
passage = "sectors:[{sectorType:\"residential\",id:\"res\",name:\"Residential\",numberOfCustomers:0},{sectorType:\"non-residential\",id:\"nonres\",name:\"Non-Residential\",numberOfCustomers:0}]"
note = "Three-class layout found in main-22UAKSGH.js (initializeSectorsForRegion: res, smnr, lnrp); for 2.2.0 the two-class chunk applies."
verdict_note = ""

[[fact]]
name = "duration_limit"
claimed = "24 hours or less"
observed = "Confirmed by the FAQ for ICE 2: 'The focus of the updated ICE Calculator is on the costs of power interruptions lasting up to 24 hours.' Survey-based CDFs cannot provide complete information beyond 24 hours (DOE research cited). Exception: Puerto Rico and Guam can be estimated to 30 days (max CAIDI 43,200 minutes). Input bounds in the app: CAIDI max 1440 min, SAIDI max 2160, SAIFI max 100."
outcome = "confirmed"
source_url = "https://ice-calc-docs.s3.us-west-2.amazonaws.com/documents/FAQs+for+ICE+Calculator+2.pdf"
passage = "Does the ICE Calculator estimate the cost of power interruptions lasting longer than 24 hours? The focus of the updated ICE Calculator is on the costs of power interruptions lasting up to 24 hours."
note = ""
verdict_note = ""

[[fact]]
name = "reuse_terms"
claimed = "whether the damage-function coefficients may be used offline [V]"
observed = "NOT freely reusable offline. The online tool and its API stay in the public domain; the spreadsheets (the equations and coefficients) are available only under a licensing agreement; LBNL and partners hold copyright on the underlying models. The Phase 1 final report describes the econometric structure (residential: a GLM; non-residential: a Probit plus a GLM) and lists explanatory variables with significance, but no coefficient values were found in its text (grep of 'coefficient' hits only method sections; report not read in full). So a published coefficient set for offline use was not found; calling the API is the permitted route."
outcome = "differs"
source_url = "https://ice-calc-docs.s3.us-west-2.amazonaws.com/documents/FAQs+for+ICE+Calculator+2.pdf"
passage = "Those equations include both the explanatory variables included in the models and their coefficients. ... Berkeley Lab-and our partners-filed for and received copyright protection from the U.S. government. Users that wish to access the spreadsheets will now need to go through a process to secure a license. As always, access to the online version of the ICE Calculator-and the Application Programming Interface-will remain in the public domain.  ; site: 'Berkeley Lab and our research partners hold a copyright for the underlying models (e.g., the equations) used by the ICE Calculator.'"
note = ""
verdict_note = ""

