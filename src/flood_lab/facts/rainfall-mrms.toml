id = "rainfall-mrms"
title = "NOAA MRMS quantitative precipitation estimates (QPE)"
publisher = "NOAA NSSL / NWS NCEP (MRMS); archived on AWS by the NOAA NODD program and at Iowa State (mtarchive)"
checked_on = "2026-11-25"
stage = "F0"
level = "facts and second reader"
second_reader_stage = "F5"
used_for = ["FH4"]
known_biases = "Registry: MRMS was upgraded from version 11 to 12 on 2020-10-14 and products before that date should be used with caution (the AWS archive starts on 2020-10-14). Pass 1 has a 20-minute latency and Pass 2 a 1-hour latency (NSSL table); the grid resolution of the files was not read (no file downloaded) so it is not recorded here. The mtarchive copy for 2021-09-01 has no Pass 1 or 15-minute product, only Pass 2, RadarOnly 1H and PrecipRate."

[[fact]]
name = "identifier"
claimed = "MRMS (replays), FH4"
observed = "Products for the two storms: RadarOnly_QPE_01H (radar-only 1-hour accumulation, table frequency 2-min), RadarOnly_QPE_15M (15-minute accumulation), PrecipRate (radar precipitation rate, mm/hr, 2-min), MultiSensor_QPE_01H_Pass1 (multi-sensor 1-hour, 20-minute latency, 60-min frequency) and MultiSensor_QPE_01H_Pass2 (1-hour latency, 60-min frequency); units mm. Also 03H to 72H accumulations for Pass1, Pass2 and RadarOnly."
outcome = "confirmed"
source_url = "https://www.nssl.noaa.gov/projects/mrms/operational/tables.php"
passage = "209 6 1 PrecipRate 2-min mm/hr ... Radar Precipitation Rate; 209 6 2 RadarOnly_QPE_01H 2-min mm ... Radar precipitation accumulation 1-hour; 209 6 30 MultiSensor_QPE_01H_Pass1 60-min mm ... Multi-sensor accumulation 1-hour (20-minute latency); 209 6 37 MultiSensor_QPE_01H_Pass2 60-min mm ... Multi-sensor accumulation 1-hour (1-hour latency); 209 6 45 RadarOnly_QPE_15M 15-min mm ... Radar precipitation accumulation 15-minute"
note = ""
verdict_note = ""

