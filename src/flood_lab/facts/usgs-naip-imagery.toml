id = "usgs-naip-imagery"
title = "Aerial imagery of the F1 area: USGS NAIP (TNM image services) and NYS orthoimagery"
publisher = "USGS / USDA Farm Service Agency (NAIP); New York State ITS GIS Program Office (NYS orthoimagery)"
checked_on = "2026-11-25"
stage = "F1"
level = "facts"
second_reader_stage = ""
used_for = ["FD3"]
known_biases = "Imagery is for looking at substations, not for measurement; each image is a single date (NAIP 2019-08-30 in leaf-on summer, NYS 2018 in spring). It does not show the study events and cannot show change since its date."

[[fact]]
name = "naip_years_resolution"
claimed = "which years cover NYC, resolution"
observed = "At the centre point (lon -73.9710, lat 40.7040) the USGSNAIPImagery and USGSNAIPPlus catalogues hold one source image: NAIP quad m_4007317_nw_18_060_20190830, year 2019, acquired 2019-08-30, 0.6 m, 4 bands (CNIR), USDA-FSA-APFO. Service: mosaic 'primarily of 0.6 meter resolution 4-band imagery'. No other NAIP year for the point appeared in either catalogue."
outcome = "confirmed"
source_url = "https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/query"
passage = "Year 2019, acquisition_date 1567123200000, resolution_value 0.6, resolution_units METER, band_count 4, vendor USDA-FSA-APFO ; The USGS NAIP Imagery service is a mosaic primarily of 0.6 meter resolution 4-band imagery"
note = "An envelope query returned unrelated Alabama tiles and was discarded; only the point query was relied on. Older NYC NAIP years (for example 2017) may exist but were not returned."
verdict_note = ""

[[fact]]
name = "naip_licence"
claimed = "public domain?"
observed = "The service description says NAIP imagery downloads are public domain; copyright text 'USGS, USDA, The National Map: Orthoimagery. January 09, 2025.' No separate terms page was read."
outcome = "confirmed"
source_url = "https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer?f=json"
passage = "allows free downloads of public domain, NAIP compressed orthoimagery in JPEG 2000 (.jp2) format"
note = ""
verdict_note = ""

[[fact]]
name = "naip_request"
claimed = "how a small picture is requested"
observed = "exportImage on the ImageServer with bbox, bboxSR, imageSR, size, format and f=image. The request used (400 m square in EPSG:32618 so the ground size is exact; image 800 x 800 px = 0.5 m per pixel, finer than the 0.6 m native): https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/exportImage?bbox=586727.18,4506208.19,587127.18,4506608.19&bboxSR=32618&imageSR=32618&size=800,800&format=png&f=image . Service limit maxImageWidth/Height 4000. Result: 800 x 800 RGB PNG, 542,904 B, HTTP 200."
outcome = "confirmed"
source_url = "https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/exportImage"
passage = "maxImageWidth 4000, maxImageHeight 4000 ; response content-type image/png"
note = "Centre of the square in UTM 18N is (586927.18, 4506408.19), from lon -73.9710, lat 40.7040 by pyproj."
verdict_note = ""

[[fact]]
name = "nys_orthos"
claimed = "NYS GIS orthoimagery as an image service"
observed = "https://orthos.its.ny.gov/arcgis/rest/services lists the ImageServer 2018_4Band (4-band, natural colour or CIR, native pixel 0.1524 m = 6 in, up to 40,000 x 40,000 px per export, extent covering NYC) and a wms/ folder of year MapServers up to 2025 plus Latest, NAIP_2019. The program page lists Kings County as flown in 2026, 2024, 2022, 2020, 2018, 2016, 2014, 2012, 2010 and earlier. Test image from 2018_4Band, same square and size: 800 x 800 RGB PNG, 1,388,544 B: https://orthos.its.ny.gov/arcgis/rest/services/2018_4Band/ImageServer/exportImage?bbox=586727.18,4506208.19,587127.18,4506608.19&bboxSR=32618&imageSR=32618&size=800,800&format=png&f=image"
outcome = "confirmed"
source_url = "https://orthos.its.ny.gov/arcgis/rest/services/2018_4Band/ImageServer?f=json"
passage = "pixelSizeX 0.1524003048006096 ; description: 4-Band ESRI Dynamic Image Service for 2018 orthoimagery ; program page: 2018 18 Bronx, Broome, ... Kings, New York, ..."
note = "The acquisition dates of lot 18 were not read (the lot page returned 404); only the year 2018 is known. Years 2020 to 2024 exist for Kings County per the program page and are served by the wms MapServers; they were not fetched."
verdict_note = ""

[[fact]]
name = "nys_licence"
claimed = "terms"
observed = "The service record has licenseInfo and accessInformation empty; copyright text 'NYS ITS GIS Program Office'. The terms of use were not read."
outcome = "not checked"
source_url = "https://orthos.its.ny.gov/arcgis/rest/services/2018_4Band/ImageServer?f=json"
passage = "copyrightText: NYS ITS GIS Program Office ; licenseInfo: null"
note = "The program page links a Disclaimer at https://gis.ny.gov/ ; it was not opened."
verdict_note = ""

[[fact]]
name = "nyc_ortho"
claimed = "NYC's own orthoimagery as public tile or image service"
observed = "Not obtained. https://maps.nyc.gov/arcgis/rest/services returned HTTP 490 (an HTML page, not a service list). The tile address pattern https://maps.nyc.gov/xyz/1.0.0/photo/<year>/18/77207/98569.png8 for 2016, 2018, 2020, 2022 and 2024 returned HTTP 200 with the same 10,519-byte PNG each time (identical checksum, a placeholder), so no NYC imagery was seen. Whether NYC offers ortho tiles at another address, their year, resolution and terms: not checked."
outcome = "not checked"
source_url = "https://maps.nyc.gov/xyz/1.0.0/photo/2018/18/77207/98569.png8"
passage = "HTTP 200, 10519 bytes, identical for five years"
note = "The tile pattern was recalled, not read from a NYC page; the failure is not evidence that no service exists."
verdict_note = ""

[[fact]]
name = "detail_comparison"
claimed = "which source shows more detail"
observed = "The NYS 2018 image (0.15 m native) shows more detail than NAIP 2019 (0.6 m native): cars, roof equipment and container stacks resolve in NYS, while NAIP shows them as blocks. The NAIP image is leaf-on summer (2019-08-30), the NYS image spring (leaf-off, year 2018)."
outcome = "confirmed"
source_url = "https://orthos.its.ny.gov/arcgis/rest/services/2018_4Band/ImageServer/exportImage"
passage = "pixelSizeX 0.1524 vs resolution_value 0.6"
note = "Judgement from viewing the two test PNGs of the same square; no measurement."
verdict_note = ""

