id = "usgs-ida-high-water-marks"
title = "USGS high-water marks for the remnants of Hurricane Ida, five boroughs of New York City"
publisher = "U.S. Geological Survey, New York Water Science Center (via ScienceBase)"
checked_on = "2026-11-25"
stage = "F0"
level = "facts and second reader"
second_reader_stage = "F5"
used_for = ["FV1"]
known_biases = "Marks exist only where crews found and surveyed debris, mud or seed lines, up to 2.5 months after the event, in the five boroughs (159 marks at 83 sites; 54 sites in Brooklyn and Queens). Areas without such evidence, and basements and subway spaces, are not represented. Horizontal positions are map or phone fixes (WGS84 from digital map), and the whole set is tagged \"Riverine\" and mostly \"swift water\" although the event was pluvial."

