id = "ghcn-daily"
title = "Global Historical Climatology Network - Daily (GHCN-Daily), daily precipitation at three New York City stations"
publisher = "NOAA National Centers for Environmental Information (NCEI)"
checked_on = "2026-11-26"
stage = "F5"
level = "facts"
second_reader_stage = ""
used_for = ["FV5"]
known_biases = "Only used to choose dry days for the 311 baseline (F5, late calls). Three point gauges 6.2 to 15.9 km from the square's edge: rain that fell only on the square would be missed. NCEI's own use limitation: the stations were not managed for climate monitoring and the data are not homogenized. Which hours a day covers at these stations was not found in the readme (not checked)."

