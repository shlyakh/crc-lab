[[fact]]
name = "fields"
claimed = ""
observed = "The readme gives PRCP in tenths of mm; the Access Data Service with units=metric returns PRCP in mm as text (e.g. \"1.0\"), with DATE, STATION and NAME. A day with no report has no row or an empty value; the reader keeps it as missing, never zero."
outcome = "confirmed"
source_url = "https://www.ncei.noaa.gov/pub/data/ghcn/daily/readme.txt"
passage = "PRCP = Precipitation (tenths of mm)"
note = "That units=metric gives mm is read from the values (Central Park 2021-09-01: 181.1, the storm day), not from a documentation page."
verdict_note = ""

[[fact]]
name = "coverage_space"
claimed = ""
observed = "Point gauges. Central Park 8.2 km, LaGuardia 10.9 km and JFK 18.4 km from the square's centre (6.2, 8.1 and 15.9 km from its edge), computed from the station table's positions in EPSG:32618."
outcome = "confirmed"
source_url = "https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.txt"
passage = "USW00094728  40.7789  -73.9692 ; USW00014732  40.7794  -73.8803 ; USW00094789  40.6392  -73.7639"
note = ""
verdict_note = ""

[[fact]]
name = "coverage_time"
claimed = ""
observed = "The collection runs from 1880-01-01 to the present. Fetched: 2021-08-02 to 2021-10-01 and 2023-08-30 to 2023-10-29, 61 days at each of the three stations in each window, every day with a value."
outcome = "confirmed"
source_url = "https://www.ncei.noaa.gov/metadata/geoportal/rest/metadata/item/gov.noaa.ncdc:C00861/xml"
passage = "<gml:beginPosition>1880-01-01</gml:beginPosition> <gml:endPosition indeterminatePosition=\"now\"/>"
note = "Which hours a station's day covers (local standard time or the wall clock) is not stated in the readme; not checked."
verdict_note = ""

