[[fact]]
name = "use_limitation"
claimed = ""
observed = "NCEI says the stations were not managed to climate-monitoring standards and the data are not homogenized. Here only daily totals near 0 mm are used, to call a day dry."
outcome = "confirmed"
source_url = "https://www.ncei.noaa.gov/metadata/geoportal/rest/metadata/item/gov.noaa.ncdc:C00861/xml"
passage = "In general, the stations providing daily observations were not managed to meet the desired standards for climate monitoring. ... GHCNd data have not been homogenized to account for the potential artifacts associated with the various reporting practices at stations."
note = ""
verdict_note = ""

