[[fact]]
name = "element_counts"
claimed = "FD3 expects \"point, yard polygon where mapped\""
observed = "187 elements: 0 nodes, 184 ways, 3 relations. No substation is mapped as a bare point in this box: every one is a polygon (way or multipolygon relation). Points in FD3 will have to come from polygon centroids. The box is a rectangle, so it includes parts of Manhattan, Staten Island, the Bronx edge, Nassau and New Jersey (operators PSE&G and NJ Transit appear); 19 elements have centroid lon < -74.0 (west of the Hudson edge). It is not clipped to Brooklyn and Queens."
outcome = "differs"
source_url = "https://overpass-api.de/api/interpreter"
passage = "counts by element type (Python, from overpass.json): {\"way\": 184, \"relation\": 3, \"node\": 0} ; total 187"
note = "FD3 wording \"point\" is satisfied only through centroids."
verdict_note = ""

[[fact]]
name = "voltage_tag"
claimed = "voltage where tagged"
observed = "95 of 187 have a voltage tag (94 ways, 1 relation); 92 have none. Values are semicolon lists in volts: \"27000;4000\" 45; \"138000;27000\" 9; \"138000;13200\" 6; \"69000\" 5; \"345000;138000\" 5; \"138000\" 4; \"69000;13200\" 4; \"33000\" 3; \"230000;13800\" 2; \"345000\" 2; \"69000;33000\" 1; \"138000;69000\" 1; \"345000;138000;69000\" 1; \"13800\" 1."
outcome = "confirmed"
source_url = "https://overpass-api.de/api/interpreter"
passage = "voltage tag present: 95 (way 94, relation 1) ; absent: 92"
note = "Counted by me from overpass.json. Most \"27000;4000\" are NYC Transit traction substations (27,000/4,000 V)."
verdict_note = ""

