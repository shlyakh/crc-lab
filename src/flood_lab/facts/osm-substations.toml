known_biases = "Only what volunteers have mapped and tagged: 92 of 187 have no voltage, 139 no location, 51 no operator. Small indoor or basement substations in buildings are likely under-mapped; 35 traction substations (subway/rail) and some outside Brooklyn and Queens are in the set; no node-mapped substations at all."

