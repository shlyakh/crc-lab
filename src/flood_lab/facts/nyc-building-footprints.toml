[[fact]]
name = "fields"
claimed = "BIN, BBL, construction year, roof height `heightroof`, ground elevation `groundelev`, feature code, last status"
observed = "The Socrata table has 16 columns: the_geom, name, bin, doitt_id, shape_area, base_bbl, objectid, construction_year, feature_code, geom_source, ground_elevation, height_roof, last_edited_date, last_status_type, mappluto_bbl, shape_length. The names `heightroof` and `groundelev` are the SHAPEFILE names (HEIGHTROOF, GROUNDELEV); in the Socrata table and the GeoJSON they are `height_roof` and `ground_elevation`. Units: ground_elevation is feet, lowest elevation at the building ground level, NAVD88 when collected photogrammetrically or from modern sources, accuracy varies; height_roof is feet above ground elevation (not above sea level), zero or null means not available. construction_year: year completed, accurate for buildings built after 2017; before 2002 mostly from the tax roll, accurate to a decade at best; null (or 0) means not available. feature_code: 1000 Parking, 1001 Gas Station Canopy, 1002 Storage Tank, 1003 Placeholder (triangle for permitted bldg), 1004 Auxiliary Structure, 1005 Temporary Structure, 1006 Cantilevered Building, 2100 Building, 2110 Skybridge, 5100 Building Under Construction, 5110 Garage. last_status_type: Demolition, Alteration, Geometry, Initialization, Correction, Marked for Construction, Marked For Demolition, Constructed (also seen in the box: Split, Merged, Investigate Construction). bin: DOB building id, first digit borough (1 Manhattan, 2 Bronx, 3 Brooklyn, 4 Queens, 5 Staten Island); BINs ending 000000 (1000000, 3000000 ...) mean unassigned or unknown, so the BIN is not unique. base_bbl: tax lot the footprint lies in (text); mappluto_bbl: the key to join MapPLUTO (condominium billing BBL). doitt_id is the consistent unique building key; objectid is a synthetic key (\"Use DOITT_ID instead\"). shape_area and shape_length: \"Do not use\" (Web Mercator, not area preserving). Horizontal: published in WGS84 (GeoJSON), captured in NY State Plane Long Island East, NAD83, US foot (EPSG:2263). In the GeoJSON every property value is a string, numbers included."
outcome = "confirmed"
source_url = "https://raw.githubusercontent.com/CityOfNewYork/nyc-geo-metadata/master/Metadata/Metadata_BuildingFootprints.md"
passage = "GROUND_ELEVATION | GROUNDELEV | Lowest elevation at the building ground level, in feet. Calculated from LiDAR or photogrammetrically. | number | Accuracy varies but when collected photogrammetrically or from modern sources this value is based on the North American Vertical Datum of 1988 ; HEIGHT_ROOF | HEIGHTROOF | Roof height above ground elevation, in feet (not above sea level). | number | Records where this is zero or NULL mean that this information was not available. ; BIN ... In some cases where these 6 digits are all zeros (e.g. 1000000, 2000000, etc.) the BIN is unassigned or unknown. ... Due to \"million BINs\" this identifier is not unique ; FEATURE_CODE | FEAT_CODE | Type of Building. List of values: 1000 = Parking 1001 = Gas Station Canopy ... 5110 = Garage"
note = "Features captured: all buildings over 400 sq ft and taller than 12 ft, plus others with BINs; excluded: interior divisions, temporary trailers or tents, jet bridges, awnings, scaffolds, sidewalk sheds, small backyard sheds with no visible car access. Positional accuracy for photogrammetric features +/- 2 ft (95%); manual features less accurate. The ground_elevation datum is stated conditionally (NAVD88 only when collected photogrammetrically or from modern sources): older values may not be NAVD88. The portal's column descriptions for construction_year, feature_code, ground_elevation, height_roof, last_status_type are empty; the meanings come from the GitHub metadata page."
verdict_note = ""

