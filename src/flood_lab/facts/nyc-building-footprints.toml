passage = "FeatureCollection of 22960 features (my count) ; first feature properties: base_bbl 3017190001, construction_year 1958, ground_elevation 12, feature_code 2100, height_roof 65.16, last_status_type Constructed, bin 3325583, geom_source Photogrammetric, doitt_id 393051"
note = "Counts are mine, from /Users/yuri/work/crc/crc-lab/data/cache/flood/f1/scripts/analyse_f1.py and brooklyn_subset.py (output in f1/analysis-output.txt). height_roof maxima of 1,035 ft and ground_elevation up to 360 ft were not checked; the 360 ft value is implausible for this part of Brooklyn and is an outlier to inspect before use. The task named the box within_box on the geometry; the vertex extent (-73.990002, 40.684998 to -73.938501, 40.724502) shows edge-crossing features are included. A feature whose geometry crosses the box edge but whose vertices all lie outside was not tested for."
