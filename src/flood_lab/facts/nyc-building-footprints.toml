id = "nyc-building-footprints"
title = "NYC Building Footprints (BUILDING, `5zhs-2jue`)"
publisher = "NYC Office of Technology and Innovation (OTI, formerly DoITT), on NYC Open Data"
checked_on = "2026-11-25"
stage = "F1"
level = "facts"
second_reader_stage = ""
used_for = ["FD5"]
known_biases = "Footprints are updated daily by city staff, so the layer is the city as of the download, not as of a storm date; construction_year is reliable only after 2017 and mostly from the tax roll before 2002 (accurate to a decade at best). ground_elevation is a lowest-adjacent-ground value in feet, NAVD88 only for photogrammetric or modern sources, with accuracy that varies; height_roof is zero or null where unavailable. The BIN is not unique (million BINs for unassigned buildings) and a building may be split in several footprints sharing a BIN. Garages (feature code 5110) and other auxiliary structures are in the layer. Numbers in the GeoJSON are strings."

