[[fact]]
name = "rows_in_study_box"
claimed = ""
observed = "22,960 features returned for the box (lon -73.9900 to -73.9385, lat 40.6850 to 40.7245), one request, under the 50,000 limit, so no paging was needed (the first request already returned fewer than $limit rows). Of these 21,547 carry a Brooklyn BIN (first digit 3) and 1,413 a Manhattan BIN (first digit 1; the western edge of the box reaches the Lower East Side). All 22,960 have a BIN (none null); 3 of them are \"million BINs\" (unassigned), and 22,958 BINs are distinct (the same BIN on 3 rows). ground_elevation: 22,949 not null, of which 22,938 above 0 and 11 equal to 0 (11 null); Brooklyn BINs: 21,525 above 0. height_roof: 22,960 not null, 22,942 above 0 and 18 equal to 0; Brooklyn BINs: 21,531 above 0. construction_year: 22,630 not null (none zero), 330 missing. ground_elevation (ft): min 0, quartiles 24 / 36 / 50, max 360; height_roof (ft): min 0, quartiles 31.5 / 38.8 / 47.7, max 1,035. feature_code: 2100 Building 22,292; 5110 Garage 630; 5100 Under Construction 19; 2110 Skybridge 7; 1006 3; 1001 3; 1004 3; 1003 2; 1000 1. last_status_type: Constructed 22,708; Alteration 162; empty 29; Split 22; Merged 13; Correction 8; Investigate Construction 6; Initialization 6; Marked for Construction 3; Marked for Demolition 2; Demolition 1."
outcome = "confirmed"
