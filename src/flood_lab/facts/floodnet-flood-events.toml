id = "floodnet-flood-events"
title = "FloodNet: Street Flooding Events Measured by FloodNet Sensors"
publisher = "NYC Department of Environmental Protection (DEP), data from FloodNet (NYU and CUNY), on NYC Open Data"
checked_on = "2026-11-25"
stage = "F0"
level = "facts and second reader"
second_reader_stage = "F2"
used_for = ["FS3", "FV2", "FT1"]
known_biases = "Sensors sit only where the project could mount them (street furniture, mostly over sidewalks), usually above the local low point, so shallow floods and floods in the roadbed below curb height are missed; a sensor offline, not yet installed or retired records nothing, and the tables do not say when a sensor was offline. The network grew from 9 sensors in September 2021 to 68 in September 2023, so a count of sensors with events is mostly a count of where sensors were."

