name = "address"
claimed = "NYC Open Data `aq7i-eu5q`"
observed = "https://data.cityofnewyork.us/d/aq7i-eu5q resolves; SODA2 endpoint https://data.cityofnewyork.us/resource/aq7i-eu5q.csv works without token. The bulk endpoint https://data.cityofnewyork.us/api/views/aq7i-eu5q/rows.csv?accessType=DOWNLOAD (the one the task named) returned HTTP 410: \"This feature has been deprecated\", deprecatedAt 1791331200 (2026-10-07), sunsetAt 1797897600 (2026-12-22)."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/api/views/aq7i-eu5q/rows.csv?accessType=DOWNLOAD"
passage = "{\"code\":\"feature_deprecated\",\"deprecatedAt\":1791331200,\"deprecationInfoLink\":\"https://support.socrata.com/hc/en-us/articles/43491231777047\",\"error\":true,\"message\":\"This feature has been deprecated\",\"sunsetAt\":1797897600}"
note = "Outcome is about the download address, not the dataset id. The deprecation notice page was behind a bot check and could not be read; whether /resource/<id>.csv is also affected is not known. Both tables were fetched in full with /resource/<id>.csv?$limit=50000; the 3611 and 496 rows equal the count(*) from the API, so nothing was cut."
verdict_note = "The identifier is as the requirements give it. The retired bulk-download address was not a claim of the requirements; the reader uses the resource address."

[[fact]]
name = "fields"
claimed = ""
observed = "13 fields. sensor_name (text), sensor_id (text; key to the sensor table), flood_start_time and flood_end_time (timestamps, GMT), max_depth_inches (inches), onset_time_mins, drain_time_mins, duration_mins, duration_above_4_inches_mins, duration_above_12_inches_mins, duration_above_24_inches_mins (minutes; drain_time_mins empty in 1 row), flood_profile_depth_inches (JSON array, inches) and flood_profile_time_secs (JSON array, seconds from flood start). A flood event is a series of depth measurements above 10 mm, one-minute sampling, reviewed by a neural-network classifier and by a person. No borough or coordinates in this table."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/api/views/aq7i-eu5q.json"
passage = """
max_depth_inches | number | The maximum flood depth (in inches) measured at the sensor location during the event
flood_start_time | calendar_date | Start time of the measured flood event (i.e., time when flood waters began accumulating beneath sensor, in GMT)
duration_above_4_inches_mins | number | The amount of time during the flood event that measured water depths were equal to or greater than 4 inches.
A flood event is defined as a series of water depth measurements greater than 10 mm; all measured flood events presented here have undergone QC by a member of the FloodNet team."""
note = "Depth is as measured under the sensor, not at the lowest point of the street: see sensor table field lowest_point_height_delta_inches. 2 events (Q-davenport-ct-2-07znk0, 2021-01-16 and 2021-02-02) start before the sensor date_installed (2021-03-05)."
verdict_note = ""

