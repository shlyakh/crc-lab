[[fact]]
name = "sensors_with_event_2021-09-01"
claimed = "FS3 / §9 item 3: FloodNet had sensors recording inside candidate areas on both dates. Open (F0)."
observed = "New York local date 2021-09-01: 5 sensors with an event (5 events): Brooklyn 3, Queens 2, no other borough. Sensors: BK-9th-st-smith-st-0etvg0, BK-hoyt-st-5th-st-007sk0, BK-carroll-st-4th-av-0ery00, Q-russell-st-2-07zt40, Q-russell-st-1-07zqc0. Their GMT start times are 2021-09-02 00:11 to 02:03."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/resource/aq7i-eu5q.csv?$limit=50000"
passage = "flood_start_time (GMT) -> sensor: 2021-09-02T00:11:58 BK-9th-st-smith-st-0etvg0 27.76 in ; 2021-09-02T01:24:41 BK-hoyt-st-5th-st-007sk0 10.35 in ; 2021-09-02T01:27:16 BK-carroll-st-4th-av-0ery00 35.59 in ; 2021-09-02T01:51:03 Q-russell-st-2-07zt40 2.87 in ; 2021-09-02T02:03:01 Q-russell-st-1-07zqc0 1.50 in"
note = "Matching rule: an event belongs to a calendar date when its flood_start_time (stated to be GMT) converted to America/New_York local time falls on that date; the borough of the event is the borough of its sensor_id in kb2e-tjy3 (the events table has no borough). Alternative rules are given in the note. Counts are of distinct sensor_id. If the GMT date is used instead, 2021-09-01 has 0 events and 2021-09-02 has the same 5 sensors (Brooklyn 3, Queens 2): the whole Ida rainfall of the evening of 1 September local time falls on 2 September GMT. Counting events whose [start, end] interval overlaps the local day: 2021-09-01 gives the same 5; 2021-09-02 local gives 3 sensors (Brooklyn 1, Queens 2) because three events run past local midnight."
verdict_note = ""

