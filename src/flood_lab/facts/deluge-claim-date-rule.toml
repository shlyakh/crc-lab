[[fact]]
name = "rule_text"
claimed = "10 mm threshold on daily maximum hourly AORC rainfall, window d-3 to d+3"
observed = "Confirmed as stated in requirements FT5: step 1 daily maximum of hourly accumulated precipitation from NOAA AORC at the claim location for day d; step 2 keep d if it exceeds 10 mm; step 3 otherwise take the day in d-3..d+3 with the largest such value and move the claim to it if that exceeds 10 mm; step 4 otherwise discard the claim."
outcome = "confirmed"
source_url = "https://arxiv.org/pdf/2607.16050"
passage = "\"3.1.1 Temporal Uncertainty Correction. The dateOfLoss field in the NFIP claims data is known to be noisy where reported dates of loss often fail to align with precipitation events in the historical precipitation records. ... To mitigate this noise, we apply the following correction to the dateOfLoss field d: (1) Compute the daily maximum hourly accumulated precipitation from NOAA AORC [21] for day d at the location of the claim. (2) If the daily maximum hourly accumulated precipitation on day d exceeds 10 mm, accept dateOfLoss as reported. (3) Otherwise, search the window d' in {d - 3, ..., d + 3} and select the day with the largest daily maximum hourly precipitation. If this maximum exceeds 10 mm, update dateOfLoss to d'. (4) If no day's daily maximum hourly precipitation in the window exceeds 10 mm, discard the claim as erroneous.\""
note = "Threshold rationale in the paper: \"We adopt 10 mm as a conservative threshold for maximum hourly accumulated precipitation, sitting between two reference points\" (FFG about 25.4 mm; AMS heavy precipitation 7.62 mm in one hour). The paper does not say what rainfall location uncertainty (0.1 degree claim position) does to the daily maximum; the rule is applied \"at the location of the claim\" after the spatial correction of section 3.1.2."
verdict_note = ""

