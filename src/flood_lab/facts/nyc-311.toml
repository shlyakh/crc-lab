id = "nyc-311"
title = "311 Service Requests from 2020 to Present"
publisher = "NYC Office of Technology and Innovation (OTI), on NYC Open Data"
checked_on = "2026-11-25"
stage = "F0"
level = "facts"
second_reader_stage = ""
used_for = ["FV5", "FT5"]
known_biases = "Each row is a call, web or app report made by a person, so counts follow who knows the service and reports, where people are at home or online, and duplicate reports of one event (the dataset has no flag for duplicates). It holds only 'service requests that can be directed to specific agencies'. A report is not a measured flood and says nothing about depth; absence of complaints in an area is not absence of flooding."

[[fact]]
name = "identifier"
claimed = "311 service requests: NYC Open Data (find the current dataset id in F0)"
observed = "Current id for 2021 and 2023 is erm2-nwe9, '311 Service Requests from 2020 to Present' (rows from 2020-01-01; 23,266,679 rows on 2026-11-25; max created_date 2026-11-23). 2010 to 2019 is 76ig-c548 ('311 Service Requests from 2010 to 2019', found in the portal catalogue, not used here). The older per-year datasets (2004 to 2009) exist as well."
outcome = "confirmed"
source_url = "https://api.us.socrata.com/api/catalog/v1?domains=data.cityofnewyork.us&q=311%20service%20requests&limit=25"
passage = """
erm2-nwe9 | 311 Service Requests from 2020 to Present | dataset | updated 2026-11-25
76ig-c548 | 311 Service Requests from 2010 to 2019 | dataset | updated 2025-12-26
[erm2-nwe9 description] For data from 2010-2019 see: https://data.cityofnewyork.us/Social-Services/311-Service-Requests-from-2010-to-2019/76ig-c548/about_data"""
note = "The dataset description links a page about recent changes to this dataset (https://opendata.cityofnewyork.us/311-service-requests-from-2010-to-present-updates/); I did not read it, so I do not know when or why the table was split into 2010-2019 and 2020-to-present or whether the complaint-type renaming is described there."
verdict_note = ""

