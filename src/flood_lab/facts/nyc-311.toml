[[fact]]
name = "fields"
claimed = ""
observed = "Main fields: unique_key, created_date, closed_date (floating timestamps, no zone in the API; the dictionary I searched does not state a time zone), agency, complaint_type, descriptor, descriptor_2, location_type, incident_zip, incident_address, street_name, cross streets, status, resolution_description, community_board, council_district, police_precinct, bbl, borough (BRONX, BROOKLYN, MANHATTAN, QUEENS, STATEN ISLAND, or 'Unspecified'), x/y_coordinate_state_plane, open_data_channel_type, latitude, longitude, location, and others. The dictionary calls complaint_type 'Problem' and descriptor 'Problem Detail'."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/api/views/erm2-nwe9.json"
passage = """
complaint_type | text | This is the first level of a hierarchy identifying the topic of the incident or condition.
descriptor | text | This is associated to the Problem (formerly Complaint Type), and provides further detail on the incident or condition.
This dataset is updated daily and expected values for many fields will change over time. The lists of expected values associated with each column are not exhaustive."""
note = ""
verdict_note = ""

[[fact]]
name = "flood_complaint_types"
claimed = ""
observed = "Two naming schemes for the same DEP sewer requests appear in 2021 to 2023 data. Legacy: complaint_type 'Sewer' with descriptors 'Street Flooding (SJ)', 'Highway Flooding (SH)', 'Sewer Backup (Use Comments) (SA)', 'Catch Basin Clogged/Flooding (Use Comments) (SC)', 'Catch Basin Sunken/Damaged/Raised (SC1)', 'Catch Basin Grating Missing (SA4)', 'Catch Basin Search (SC2)', 'Manhole Overflow (Use Comments) (SA1)', 'Culvert Blocked/Needs Cleaning (SE)'. Current: complaint_type 'Sewer Maintenance' with descriptors 'Flooding on Street', 'Flooding on Highway', 'Backup', 'Catch Basin Clogged', 'Catch Basin Sunken', 'Catch Basin Grate Missing', 'Manhole Overflow', 'Culvert'. Both appear on 2023-09-29 (legacy 'Sewer/Sewer Backup' 923, current 'Sewer Maintenance/Backup' 870 in Brooklyn and Queens); on 2021-09-01/02 no 'Sewer Maintenance' rows appear in Brooklyn and Queens, only the legacy names. Related: 'Water System / Excessive Water In Basement (WEFB)' (2021) and 'Water Maintenance / Water in Basement' (2023); 'Standing Water' (a handful); 'Water Drainage / Drain/Pipe Clogged'."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/resource/erm2-nwe9.json?$select=complaint_type,descriptor,count(*)&$group=complaint_type,descriptor"
passage = """
[dictionary, DEP rows] Department of Environmental Protection | Sewer Maintenance | Backup | N/A | Yes | Sewer
Department of Environmental Protection | Sewer Maintenance | Catch Basin Clogged | N/A | Yes | Sewer
Department of Environmental Protection | Sewer Maintenance | Flooding on Street | N/A | Yes | Street
Department of Environmental Protection | Sewer Maintenance | Flooding on Highway | N/A | Yes | Highway
[2021-09-01/02, Brooklyn and Queens] Sewer | Sewer Backup (Use Comments) (SA) | 2245 ; Sewer | Street Flooding (SJ) | 424 ; Sewer | Catch Basin Clogged/Flooding (Use Comments) (SC) | 297
[2023-09-29] Sewer | Sewer Backup (Use Comments) (SA) | 923 ; Sewer Maintenance | Backup | 870 ; Sewer | Street Flooding (SJ) | 481 ; Sewer Maintenance | Flooding on Street | 469 ; Sewer | Catch Basin Clogged/Flooding (Use Comments) (SC) | 321 ; Sewer Maintenance | Catch Basin Clogged | 290"""
note = "A query on the legacy names alone would roughly halve the 2023 counts. The mapping between the two sets is mine; the dictionary lists the new names only. First created_date for Sewer Maintenance/Backup is 2020-03-02 (6,004 rows to 2026-11-23)."
verdict_note = ""

