[[fact]]
name = "scheme_twins"
claimed = ""
observed = "Read on 2026-11-26 (F5, second part) in the rows of the model square on 29 Sep 2023: of 106 flooding-related rows of the current scheme, 104 have a row of the legacy scheme of the same kind created 317 s or less later (95 at the same address, the rest within 25 m), with a different unique_key: one request held twice, once under each scheme. On 1-2 Sep 2021 only the legacy scheme occurs in the square. Counting the rows of both schemes therefore counts most 2023 requests twice; record f5-who-saw counts rows and requests (rows less twin pairs) apart."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/resource/erm2-nwe9.json"
passage = "nyc-311/sep29_2023/page_1.json, e.g. unique_key 59445530 2023-09-29T09:19:34 'Sewer Maintenance' 'Backup' 100 BAYARD STREET PHONE ; unique_key 58960528 2023-09-29T09:21:00 'Sewer' 'Sewer Backup (Use Comments) (SA)' 100 BAYARD STREET PHONE"
note = "The pairing rule (same kind; same address or within 25 m; within 600 s) is the lab's [P], in flood_lab.sources.nyc_311.twins."
verdict_note = ""

