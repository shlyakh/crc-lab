[[fact]]
name = "rmse_0_20_m"
claimed = "the 0.20 m of the published research model [S] (Kasaei et al. 2025, HESS 29:2043, abstract)"
observed = "The abstract says RMSE of 20 cm against high-water marks: same number as 0.20 m. Caveat: the paper validates against seven USGS marks inside its modeled area plus one from the Community Flood Watch Project (eight for Ida); the Mendeley record says \"18 locations\" for the calibration using two storms (Ida and 29 Sep 2023). The uncalibrated base run (no drain rate) had RMSE 40 cm and mean error 13 cm. Calibrated drain rate 13 mm/h."
outcome = "confirmed"
source_url = "https://hess.copernicus.org/articles/29/2043/2025/"
passage = "abstract: \"We generate a spatially continuous flood map of Ida with a root-mean-square error (RMSE) of 20 cm when compared to high-water marks\" ; text: \"we reference surveyed high-water marks (HWMs) from the USGS website for the event, finding seven locations within our modeled area; one more HWM is from the Community Flood Watch Project\" ; \"The calibrated drain rate of 13 mm h −1 from our model\" ; Mendeley: \"based on a calibration process that utilized two storms and high watermarks at 18 locations.\""
note = "The 20 cm is in-sample (a calibration error, not an independent test) on very few marks; do not compare a model validated against the full 159 marks to it as if like for like."
verdict_note = ""

[[fact]]
name = "single_drainage_rate"
claimed = "the model represented infiltration and stormwater conveyance as a single drainage rate"
observed = "Confirmed: infiltration and stormwater conveyance are lumped into one drain rate, applied as a spatially uniform, constant calibration parameter over the land area; bare-earth surface, no buildings, no explicit sewer."
outcome = "confirmed"
source_url = "https://hess.copernicus.org/articles/29/2043/2025/"
passage = "abstract: \"We modify the model to capture the volumetric effects of rainfall and parameterize soil infiltration and a stormwater conveyance system as the drainage rate.\" ; text: \"Because the model does not explicitly include infiltration or a stormwater system, we account for the drainage with a collective “drain rate”.\" ; \"For the Jamaica Bay watershed simulations, we assume a uniform, constant drain rate for the land area and use it as a calibration parameter\""
note = ""
verdict_note = ""

