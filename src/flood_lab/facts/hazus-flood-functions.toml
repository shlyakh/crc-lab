id = "hazus-flood-functions"
title = "FEMA Hazus 7 Flood and Inventory Technical Manuals; Hazus 4.0 depth-damage tables in FEMA's FAST tool"
publisher = "FEMA (Hazus 7.0 Flood Model Technical Manual and Inventory Technical Manual, June 2025); open-source tool repository nhrap-hazus/FAST on GitHub"
checked_on = "2026-11-26"
stage = "F6"
level = "facts"
second_reader_stage = ""
used_for = ["FR2", "FR3", "FM5"]
known_biases = "Hazus 7 does not analyse electric power substations in its flood model (mapping only) and neither manual tabulates a substation depth-damage point; the substation functional depth of 4 ft is a default for a component Hazus itself does not analyse. The manuals are for Hazus 7.0 (June 2025) while the current software is 7.2. The building depth-damage values come from FAST, whose tables are Hazus 4.0 (repository no longer updated since 2022); the default function assignments match the Hazus 7 manual, but the manual gives no curve points to compare values with. Licence: GPL-3.0 (FAST), Yuri's decision of 2026-11-26; neither manual carries a licence or terms-of-use statement."

[[fact]]
name = "identifier"
claimed = "Hazus Inventory Technical Manual 4.2 SP3, Table 10-12"
observed = "Read instead: Hazus 7.0 Inventory Technical Manual, June 2025 (file fema_rsl_hazus-7-invtm_06272025_1.pdf, 203 pages) and Hazus 7.0 Flood Model Technical Manual, June 2025 (fema_rsl_hazus-7-fltm_06272025_0.pdf, 83 pages), downloaded by Yuri. In Hazus 7 the substation flood defaults are in Inventory Technical Manual Table 9-13 'Electric Power System Classifications and Flood Model Default Parameters' (caption p. 9-16, rows p. 9-17; PDF pages 164-165), not Table 10-12. The 4.2 SP3 manual itself was still not read."
outcome = "differs"
source_url = "file hazus-flood-functions/fema_rsl_hazus-7-invtm_06272025_1.pdf, p. 9-16 to 9-17"
passage = "Hazus Inventory Technical Manual, Hazus 7.0, June 2025 ... 'For the Flood Model, Table 9-13 includes additional default values used for certain electric power system data.' 'Table 9-13 Electric Power System Classifications and Flood Model Default Parameters'"
note = "Earlier observation (F0, 2026-11-25): 'Not checked: https://www.fema.gov/sites/default/files/documents/fema_hazus-inventory-technical-manual-4.2.3.pdf and the Hazus page return HTTP 403 (Access Denied) to the client; no other copy of the manual found. The 4 ft (1.22 m) functional depth for slab-on-grade low- and high-voltage substations and its table number are unconfirmed.' Page numbers here are the printed ones; PDF page indices in brackets where given."
verdict_note = ""

[[fact]]
name = "substation_functional_depth"
claimed = "functional depth 4 ft (1.22 m) for the default slab-on-grade low- and high-voltage substations"
observed = "Table 9-13 (Inventory TM p. 9-17): ESSL Low Voltage Substation, ESSM Medium Voltage Substation and ESSH High Voltage Substation are all 'Slab on grade', FL Equipment Height 0 ft, FL Functional Depth 4 ft, each with the comment 'Component is not analyzed in the flood model, mapping only capabilities.' The same 4 ft holds for EDFLT and the three power-plant classes. So the claim holds and extends to the medium-voltage class; 4 ft = 1.2192 m [I]. The table has no anchored/unanchored split: Table 9-12 (p. 9-16) gives one label per voltage class '[different combinations for with or without anchored components]'. Voltage classes (p. 9-15): high 350 kV and above (Large, 500 kV), medium 150-350 kV (230 kV), low 34.5-150 kV (115 kV)."
outcome = "confirmed"
source_url = "file hazus-flood-functions/fema_rsl_hazus-7-invtm_06272025_1.pdf, Table 9-13, p. 9-17 (PDF p. 165)"
passage = "ESSL Low Voltage Substation | Slab on grade | 0 | 4 | Component is not analyzed in the flood model, mapping only capabilities. ESSM Medium Voltage Substation | Slab on grade | 0 | 4 | ... ESSH High Voltage Substation | Slab on grade | 0 | 4 | Component is not analyzed in the flood model, mapping only capabilities. (columns: FL Foundation Type, FL Equipment Height (ft), FL Functional Depth (ft), Comments). p. 9-16: 'The Functional Depth represents the assumed flood elevation where the facility is closed and people evacuated, because the equipment is assumed to be flooded. It should be noted that the functional depth for utility systems components is not editable by the user and is not directly linked to the equipment height specified for each component in the inventory. Analysis is not performed for Electric Power Systems but can be mapped for reference.'"
note = "For FM5: the 4 ft is a Hazus default for a component Hazus does not analyse in flood; use it as the outage threshold tagged [S] with this caveat."
verdict_note = ""

[[fact]]
name = "functional_depth_rule"
claimed = ""
observed = "A utility component is non-functional when the flood depth at its location exceeds the functional depth by 0.1 ft or more; the same rule for essential facilities. Functionality rests on damage to critical equipment rather than building damage. The functional depth is not editable and not linked to the equipment height or the flood-protection level."
outcome = "confirmed"
source_url = "file hazus-flood-functions/fema_rsl_hazus-7-fltm_06272025_0.pdf, section 9.4.2, p. 9-5; section 8.4.3, p. 8-3"
passage = "p. 9-5: 'In the Hazus Flood Model, Utility System Component functionality is based primarily on an estimation of damage to critical equipment rather than building damage. A determination is made based on the functional depth indicated for each facility type in the Damage Functions for Utility Systems dialog. If the depth of flooding at the component location exceeds the functional depth threshold by 0.1 feet or more, the component will be considered non-functional.' Footnote 24: 'the functional depth for Utility Systems Components is not editable by the user and is not directly linked to the equipment height specified for each component in the inventory.'"
note = ""
verdict_note = ""

[[fact]]
name = "building_functional_depth"
claimed = ""
observed = "No functional depth is given for ordinary (aggregated baseline inventory) buildings in either manual. For essential facilities, Inventory TM Table 7-15 (p. 7-18 to 7-19) gives: MDFLT, EFHS, EFHM, EFHL hospitals 0.5 ft; EFMC medical center 0.5 ft; FDFLT and EFFS fire station 2 ft; PDFLT and EFPS police station 1 ft; EDFLT default emergency center 0.5 ft; EFEO emergency center 1 ft; SDFLT, EFS1 school and EFS2 university 0.5 ft. Default first-floor heights there: 3 ft for hospitals and medical centres, 0 ft for the others."
outcome = "confirmed"
source_url = "file hazus-flood-functions/fema_rsl_hazus-7-invtm_06272025_1.pdf, Table 7-15, p. 7-18 to 7-19 (PDF pp. 127-128)"
passage = "Table 7-15 Essential Facilities Inventory Occupancy Classification and Flood Model Default Parameters ... EFHL Large Hospital Concrete Basement 3 Mid COM6 0.5 ... EFFS Fire Station Concrete Slab on Grade 0 Low GOV2 2 ... EFPS Police Station Concrete Basement 0 Low GOV2 1 ... EFS1 School Masonry Slab on Grade 0 Low EDU1 0.5. 'Functional Depth: The general assumption is that when the depth of flooding reaches the functional depth, typically the facility is closed and people evacuated.'"
note = "Searched both manuals for 'functional depth'; the only tables are 7-15 (essential facilities) and the utility tables of section 9."
verdict_note = ""

[[fact]]
name = "substation_damage_functions"
claimed = "Hazus-type substation curve (FEMA 2013) of about 7% at 1.2 m and 15% at about 3 m, as compiled by Nirandjan et al. as F2.1-F2.3"
observed = "Not found: neither Hazus 7 manual tabulates a depth-damage point for electric substations, by voltage class or anchoring. Flood TM Table 9-1 (p. 9-2) lists Electric Power Substations as 'Mapping Only Capabilities'; footnote 21 (p. 9-3) says default damage functions for electric power facilities exist in the 'Damage Functions for Utility Systems' dialog but are not enabled and give no results. For the utility components Hazus does analyse (water, wastewater, oil, gas): damage is read at depth minus equipment height (Equation 9-1, printed as an image; equipment height rounded to whole feet), interpolated between 1-ft increments, maximum damage at 10 ft (p. 9-3 to 9-4). The damage-function library also holds USACE New York District (Passaic River, 1985) models for 10 utility facilities 'such as electric power substations' (p. 5-20), without values. The FAST tables hold no electric-substation curve (only building curves for COM3 'Cleaners substation' and COM4 'Utility Company')."
outcome = "not checked"
source_url = "file hazus-flood-functions/fema_rsl_hazus-7-fltm_06272025_0.pdf, Table 9-1 p. 9-2, section 9.4.1 p. 9-3 to 9-4, section 5.4.1.2.4 p. 5-20"
passage = "p. 9-3: 'In the Hazus Flood Model, Utility System Components reach maximum damage at 10 feet of flooding.' Footnote 21: 'The Hazus Flood Model contains default damage functions for electric power facilities viewable in the Damage Functions for Utility Systems dialog; however, these damage functions are not enabled, and no results will be produced for electric power facilities included in the inventory.' p. 9-4: 'The Hazus Flood Model extrapolates the percent damage between the 1-foot increments listed in the Damage Functions for Utility Systems dialog.' p. 5-20: 'Also included in the damage functions are models for 10 utility facilities, such as electric power substations, pump houses, and water treatment plants (USACE, 1985).'"
note = "The substation curve values live only in the Hazus software's database (the dialog), which was not read."
verdict_note = ""

[[fact]]
name = "nirandjan_comparison"
claimed = "Nirandjan F2.1-F2.3: 0.0694 at 1.2 m and 0.1569 at 3.0 m"
observed = "No Hazus 7 value to compare point by point (see substation_damage_functions). What can be compared [I]: all 62 points of F2.1-F2.3 (0 to 3.05 m, `substation-curves-nirandjan`) equal, to 6e-17, linear interpolation in feet through (0 ft, 0), (3 ft, 0.06), (7 ft, 0.10), (10 ft, 0.16), held at 0.16 at 3.05 m (10.007 ft). So F2 is a table defined on a foot grid ending at 10 ft, the form Hazus uses for utility damage functions (1-ft increments, maximum at 10 ft, Flood TM p. 9-3 to 9-4); 1.2 m = 3.94 ft gives 0.0694 and 3.0 m = 9.84 ft gives 0.1569. Whether these are the values in Hazus's utility dialog for ESSL/ESSM/ESSH is not established."
outcome = "not checked"
source_url = "file substation-curves-nirandjan/Table_D2_Hazard_Fragility_and_Vulnerability_Curves_V1.1.0.xlsx sheet F_Vuln_Depth; file hazus-flood-functions/fema_rsl_hazus-7-fltm_06272025_0.pdf p. 9-3 to 9-4"
passage = "Computed from the 62 points recorded in substation-curves-nirandjan.toml (fact f2_curves): max |F2(d) - interp(d/0.3048, [0,3,7,10], [0,0.06,0.10,0.16])| = 5.6e-17."
note = "The breakpoints are an inference from the values, not read from any document."
verdict_note = ""

[[fact]]
name = "building_depth_reference"
claimed = "depth measured from first-floor elevation (FR3)"
observed = "Hazus defines flood depth as flood elevation minus ground surface elevation (Flood TM p. 2-3); building damage functions are indexed by depth relative to the top of the finished first floor, i.e. depth above ground minus the first-floor height above grade (FFHAG): stated for essential facilities (p. 8-2) and implied for the basement curves (-4 ft is '4 ft below the top of the First Floor Height Above Grade', p. 5-13). The Inventory TM (p. 5-10) warns that FFHAG is not the first-floor elevation: it is the height in feet above the ground to the top of the finished floor. Default FFHAG by foundation type is Inventory TM Table 5-13 (p. 5-18), read-only; the FFHAG dialogs are not functional in Hazus 7.0 (p. 5-16). For the aggregated inventory, grid depths are area-weighted per census block in 0.5 ft increments (p. 5-2). FAST computes depth in structure = grid depth - FirstFloorHt, then caps it to -4..24 ft, the range of its tables."
outcome = "differs"
source_url = "file hazus-flood-functions/fema_rsl_hazus-7-fltm_06272025_0.pdf p. 2-3, 5-13, 8-2; fema_rsl_hazus-7-invtm_06272025_1.pdf p. 5-10, 5-16; https://github.com/nhrap-hazus/hazpy/blob/a207732fdb08723d91c34d4671f4770286f8a962/hazpy/flood/modules/UDF.py"
passage = "Flood TM p. 2-3: 'Depth: Flood depth is the difference between flood and ground surface elevations.' p. 8-2: 'percent damage for each essential facility is interpolated from the one-foot depths shown in the damage function library based on flood depth at the facility location minus the first flood height above grade for that facility.' Inventory TM p. 5-10: 'FFHAG is not synonymous with first floor elevation or lowest floor elevation. FFHAG is the assumed number of feet above the ground surface to the top of the finished floor.' hazpy UDF.py (used by FAST): 'depth = rastervalue - FFHeight' ... 'depth = 24 if depth > 24 else depth; depth = -4 if depth < -4 else depth'."
note = "Differs only in wording: FR3's 'from first-floor elevation' should read 'above the top of the finished first floor (depth above ground minus first-floor height above grade)'."
verdict_note = ""

