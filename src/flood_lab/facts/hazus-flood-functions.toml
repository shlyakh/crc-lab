[[fact]]
name = "fast_vs_hazus7"
claimed = ""
observed = "The FAST Hazus 4.0 lookup tables assign the same default function IDs as the Hazus 7 manual: riverine, all 33 occupancy groups and every RES1 storey/basement row of Table 5-2 (e.g. R11N 129, R11B 704 'RAMPP Inserted'); coastal V and A rows of Tables 5-3 and 5-4 (658, 114-118, 120, 667, 190, 659, 660; 107-110, 112, 189). Each LUT row's 29 values (-4 to 24 ft) equal the row of the full library flBldgStructDmgFn.csv with the same ID (all 196 + 64 + 64 rows). The values themselves cannot be compared with Hazus 7, which prints none. Differences in method noted by FAST's code: Hazus-MH rounds first-floor height to 0.5 ft and caps the grid at 24 ft before subtracting it; FAST subtracts first."
