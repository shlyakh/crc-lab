[[fact]]
name = "current_version"
claimed = ""
observed = "Current Hazus is 7.2 (Internet Archive copy of FEMA's Hazus page, snapshot 2026-11-14): 'Hazus 7.2 is available'; Hazus 6.1 is no longer available for download since 2026-03-03; not all functionality of 6.1 and earlier exists in 7.0, 7.1 or 7.2. The Hazus 4.2 SP3 manual is therefore an old version."
outcome = "confirmed"
source_url = "http://web.archive.org/web/20261114021132/https://www.fema.gov/flood-maps/products-tools/hazus"
passage = "Hazus 7.2 Release Hazus 7.2 is available ... Hazus 6.1 No Longer Available for Downloads FEMA no longer supports the download of Hazus 6.1 as of March 3, 2026 due to the retirement of ArcGIS Desktop. To continue your work, please download Hazus 7.2 from the Map Service Center."
note = "Secondary (web.archive.org copy)."
verdict_note = ""

[[fact]]
name = "address"
claimed = ""
observed = "Machine-readable depth-damage functions: FEMA's open-source Flood Assessment Structure Tool repository https://github.com/nhrap-hazus/FAST, folder Lookuptables: Building_DDF_Riverine_LUT_Hazus4p0.csv, Building_DDF_CoastalA_LUT_Hazus4p0.csv, Building_DDF_CoastalV_LUT_Hazus4p0.csv, Content_DDF_*_LUT_Hazus4p0.csv, Inventory_DDF_LUT_Hazus4p0.csv, AllDDF.xlsx, flBldgContDmgFn.csv, OccupancyTypes.csv (plus DefaultDDFAssignmentTables.xlsx). These are Hazus 4.0 tables for buildings and contents. Not downloaded; whether they contain substation (essential/utility) curves was not checked. Current Hazus 7.2 data come with the software from the FEMA Map Service Center (msc.fema.gov did not respond, HTTP 000)."
outcome = "confirmed"
source_url = "https://github.com/nhrap-hazus/FAST"
passage = "Lookuptables/README.txt: 'DDFs and other tables were obtained from Hazus 4.0 SQL database. We verified that no additions, changes, or deletions to the DDFs occurred in Hazus 3.1, 3.2, and 4.0.'"
