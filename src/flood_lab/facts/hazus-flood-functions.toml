observed = "Default structure functions (Flood TM Tables 5-2 riverine p. 5-3 to 5-7, 5-3 coastal V p. 5-7 to 5-8, 5-4 coastal A p. 5-8 to 5-9), by occupancy, stories and basement: RES1 one storey no basement USACE-IWR (129), one storey with basement BCAR Jan 2011 (704), two and three or more storeys and split level FIA or FIA (modified) for basements (107-112); RES2 FIA (189); RES3A-F USACE-Chicago apartment grade/sub-grade (204/205); RES4-6, COM1-10, IND1-6, AGR1, REL1, GOV1-2, EDU1-2 USACE-Galveston (e.g. COM1 217, COM4 431, EDU1 643). Coastal V and A replace RES1-RES3B with BCAR Jan 2011 and FIA V-zone functions (658, 114-118, 120, 667, 190, 659, 660). Sources: FEMA BCAR (2011), FIMA (FIA) credibility-weighted claims to 2001, USACE Chicago, Galveston and IWR (p. 5-9). FIA basement curves are modified to total damage (adds 7% at -4 ft and 4% at -1 ft, p. 5-14)."
outcome = "confirmed"
