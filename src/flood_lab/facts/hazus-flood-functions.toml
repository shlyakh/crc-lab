known_biases = "FEMA's own pages and documents returned HTTP 403 to the data-source-check client (www.fema.gov), so the Inventory Technical Manual, Table 10-12 and the 4 ft functional depth were NOT read. The current-version statement comes from an Internet Archive copy of FEMA's Hazus page (secondary). The FAST lookup tables are Hazus 4.0 data; the repository is archived by its owner ('no longer receiving updates')."

