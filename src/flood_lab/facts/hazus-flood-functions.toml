passage = "p. 5-9: 'The default damage functions provided within Hazus were compiled from the following sources: FEMA Benefit-Cost Analysis Re-engineering (BCAR) report (2011), the Federal Insurance and Mitigation Administration (FIMA) FIA credibility-weighted damages, and the U.S. Army Corps of Engineers (USACE) Chicago District, Galveston District, and Institute for Water Resources (IWR).' Table 5-2: 'RES1 1 No Basement USACE - IWR One story, no basement, Structure 129'; 'RES1 1 Basement BCAR - Jan 2011 One story, w/ basement, Structure (B14) 704'."
