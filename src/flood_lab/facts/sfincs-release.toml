[[fact]]
name = "docker_images"
claimed = ""
observed = "Docker Hub repositories: deltares/sfincs-cpu and deltares/sfincs-gpu. sfincs-cpu has 23 tags: latest (2026-11-06), sfincs-v2.5.0-Hautacam (2026-11-02), sfincs-v2.4.1 (2026-08-18), sfincs-v2.4.0-Galibier-Release, sfincs-v2.3.3, sfincs-v2.3.2, sfincs-v2.3.1, sfincs-v2.3.0-mt-Faber-Release, sfincs-v2.2.0-col-dEze-Release, sfincs-v2.1.3 ... down to sfincs-v2.0.0-AlpeDHuez, plus latestbranch. The v2.5.0 release notes name the tag 'sfincs-v2.5.0-Hautacam-Release', which does not exist on Docker Hub (registry returns MANIFEST_UNKNOWN); the real tag is sfincs-v2.5.0-Hautacam."
outcome = "differs"
source_url = "https://hub.docker.com/v2/repositories/deltares/sfincs-cpu/tags?page_size=100&ordering=last_updated"
passage = "tags: ['latest','sfincs-v2.5.0-Hautacam','sfincs-v2.4.1','sfincs-v2.4.0-Galibier-Release','sfincs-v2.3.3','sfincs-v2.3.2','sfincs-v2.3.1','sfincs-v2.3.0-mt-Faber-Release',...]; docker manifest inspect deltares/sfincs-cpu:sfincs-v2.5.0-Hautacam-Release -> 'no such manifest'"
note = ""
verdict_note = ""

[[fact]]
name = "docker_architectures"
claimed = "native Apple Silicon support [V] (section 8)"
observed = "Every sfincs-cpu tag, including latest, sfincs-v2.5.0-Hautacam, sfincs-v2.4.1 and sfincs-v2.3.3, lists only architecture amd64, os linux (the 'unknown' entry on latest is the attestation manifest). The image config blob of sfincs-v2.5.0-Hautacam says architecture amd64, os linux. No arm64 image exists, so on Apple Silicon the container runs through emulation (--platform linux/amd64). Native Apple Silicon support is NOT confirmed by any image; a native build would need compiling the source (GPL-3.0) from GitHub."
outcome = "differs"
source_url = "https://hub.docker.com/v2/repositories/deltares/sfincs-cpu/tags?page_size=100&ordering=last_updated"
passage = "latest: [('amd64',None,'linux',220486690),('unknown',None,'unknown',1196)]; sfincs-v2.5.0-Hautacam: [('amd64',None,'linux',220420953)]; config blob sha256:4a411c8a...: architecture=amd64 os=linux"
note = ""
verdict_note = ""

