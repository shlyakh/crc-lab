[[fact]]
name = "curve_number_fault"
claimed = "Releases v2.3.0 and v2.4.0 have a documented fault in curve-number infiltration when storecumprcp = 0 [S] (same record)"
observed = "Not in the Zenodo record (its description has no mention of storecumprcp or curve number). It is in GitHub release notes: v2.4.0 lists 'Fixed bug with Curve Number infiltration if storecumprcp = 0 (default).' and v2.5.0 lists 'Fixed bug with Curve Number infiltration if storecumprcp = 0 (default), now really.' So the fix in v2.4.0 was incomplete (v2.4.0 affected, fixed in v2.5.0). v2.3.0 release notes do not mention it; whether v2.3.0 is affected is not documented there (the v2.4.0 note implies the fault predates 2.4.0)."
outcome = "differs"
source_url = "https://api.github.com/repos/Deltares/SFINCS/releases/tags/v2.5.0_Hautacam_release"
passage = "v2.5.0 notes: 'Fixed bug with Curve Number infiltration if storecumprcp = 0 (default), now really.' ; v2.4.0 notes: 'Fixed bug with Curve Number infiltration if storecumprcp = 0 (default).' ; v2.3.0 notes: no match for storecumprcp/curve"
note = "The claim's source ('same record') is wrong; correct source is the GitHub release notes."
verdict_note = ""

