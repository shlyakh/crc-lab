observed = "Both are served. AMS estimates are computed first (regional L-moments); partial-duration estimates are derived indirectly from the AMS estimates using Langbein's formula. At the point, the 1-hour AMS depths (AEP 1/2,1/5,1/10,1/25,1/50,1/100,1/200,1/500,1/1000) are 1.21, 1.62, 1.93, 2.35, 2.65, 2.98, 3.34, 3.88, 4.32 in. The partial-duration series is the one tabulated below; use one series consistently when reading return periods."
outcome = "confirmed"
source_url = "https://www.weather.gov/media/owp/hdsc_documents/Atlas14_Volume10.pdf"
passage = "Partial duration series-based precipitation frequency estimates were calculated indirectly from AMS-based precipitation frequency estimates using Langbein's formula."
note = ""
verdict_note = ""

