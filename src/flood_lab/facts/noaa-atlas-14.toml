[[fact]]
name = "reading_of_city_intensities"
claimed = ""
observed = "READING FOR ONE POINT AND ONE DURATION (60 minutes, PDS central estimate) ONLY; the storm duration behind the city's intensities is not confirmed. Taking 1 in/hr = 1 in in 60 min: 1.77 in/hr lies between the 5-year (1.66) and the 10-year (1.96); 2.13 in/hr lies between the 10-year (1.96) and the 25-year (2.36); 3.66 in/hr lies between the 100-year (2.98) and the 500-year (3.88). Note that 3.66 equals the upper 90% bound of the 50-year depth (3.66) and 1.77 and 2.13 fall inside the 90% bounds of the 5-, 10- and 25-year values, so the return-period reading is uncertain. Not a transfer of return periods to the city maps."
outcome = "confirmed"
