id = "nyc-stormwater-flood-maps"
title = "NYC Stormwater Flood Maps"
publisher = "NYC Department of Environmental Protection (DEP), published on NYC Open Data"
checked_on = "2026-11-25"
stage = "F0"
level = "facts and second reader"
second_reader_stage = "F2"
used_for = ["FS1", "FH3"]
known_biases = "Rain-only maps from a model with the drainage system assumed fully working and catch basins clear; parks of 100,000 sq ft or more, non-residential non-commercial lots of 250,000 sq ft or more and lots with railway were masked out, so flooding there is not shown. Areas under 0.25 acre are dropped (with exceptions), and coastal storm surge is not modelled. The publisher says very little observed data on surface flooding exists to check the maps against."

