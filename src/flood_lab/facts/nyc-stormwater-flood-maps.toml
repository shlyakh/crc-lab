[[fact]]
name = "coverage_space"
claimed = ""
observed = "Citywide, all five boroughs (one layer per scenario for the whole city). CRS NAD 1983 StatePlane New York Long Island FIPS 3104 (US feet). Masking: parks >= 100,000 sq ft, non-residential non-commercial PLUTO lots >= 250,000 sq ft, and lots intersecting railway infrastructure were masked out for lack of drainage information. Rainfall assumed uniform over the city. Brooklyn and Queens are covered (13 sewershed models, including Newtown Creek-Brooklyn, Coney Island-Owl's Head, Jamaica-26th Ward, Tallman Island, Rockaway, Bowery Bay)."
outcome = "confirmed"
source_url = "plan appendix B (Map masking); layer dictionaries (Additional geospatial information)"
passage = """
Some areas of the City were masked out because there was insufficient information about their drainage infrastructure to represent the flood risk. These include Open Space Parks from the NYC Planimetric Database greater-than-or-equal-to 100,000 square feet, Non-Residential and Non-Commercial PLUTO Lots greater-than-or-equal-to 250,000 square feet, and PLUTO lots that intersected railway infrastructure.
NAD 1983 StatePlane New York Long Isl FIPS 3104 (US Feet)"""
note = ""
verdict_note = ""

[[fact]]
name = "coverage_time"
claimed = ""
observed = "No event time: the maps are design-scenario ponding depths (peak depth per cell), not a historical date. The terrain is the 2017 Hydro-Enforced DEM; the models were calibrated mostly on events smaller than a 5-year storm. The dataset was created 2024-07-03; the plan is dated May 2021."
outcome = "confirmed"
source_url = "plan appendix B"
passage = "the 2D mesh was constructed using Geographic Information System (GIS) processing of the 2017 Hydro-Enforced Digital Elevation Model (DEM) ... the peak ponding depth that occurs under the simulated scenario was exported from each grid cell in the 2D mesh of the H&H model."
note = ""
verdict_note = ""

[[fact]]
name = "storm_duration"
claimed = "storm DURATION behind each intensity **[V]**"
observed = "Not stated for 1.77, 2.13 or 3.66 in/hr in the dataset description, in any of the four dictionaries, in the viewer text, or in the Resiliency Plan. The plan (2021) describes its Moderate scenario as \"approximately two inches of rain falling in one hour\" (10-year) and Extreme as \"approximately 3.5 inches of rain falling in one hour\" (100-year), i.e. one hour, but with rounded figures, not 2.13 and 3.66, and it has no Limited scenario. The 2024 DEP stormwater analysis report (searched by text for 1.77, 2.13, 3.66 and \"per hour\") does not contain those figures; it uses 2.1 in/hr for its own analysis."
outcome = "not checked"
source_url = "https://www1.nyc.gov/assets/orr/pdf/publications/stormwater-resiliency-plan.pdf"
passage = "This scenario reflects approximately two inches of rain falling in one hour (also referred to as the 10-year storm, with approximately 10 percent chance of occurrence in any given year) combined with 2.5 feet of SLR ... This scenario reflects approximately 3.5 inches of rain falling in one hour (also referred to as the 100-year storm, with approximately 1 percent chance of occurrence in any given year) combined with 4.8 feet of SLR"
note = "Duration of the 1.77, 2.13 and 3.66 in/hr rainfalls: not found in a primary source; do not state one. The \"in/hr\" label together with the plan suggests one-hour design storms but that is an inference. The plan also says 1.75 in/hr is the 5-year one-hour storm, close to but not equal to 1.77; the plan does not say the Limited map uses it. Return periods against Atlas 14 are for F3."
verdict_note = ""

[[fact]]
name = "model"
claimed = "model used **[V]**"
observed = "Hydrologic and hydraulic (H&H) models built in Innovyze InfoWorks ICM: 13 models, one per sewershed draining to a water resource recovery facility, 1D sewer network coupled to a 2D overland mesh (Phase 2), from the City calibrated LTCP models. 10-year scenarios: direct 1D-2D run. 100-year scenario: a composite approach (5-year run, then the remaining 100-year minus 5-year volume placed on the 2D mesh without sewers). Oakwood Beach used rain-on-mesh only. Plan is dated May 2021; the dictionaries only say \"hydrologic and hydraulic computer models\"."
outcome = "confirmed"
source_url = "https://www1.nyc.gov/assets/orr/pdf/publications/stormwater-resiliency-plan.pdf"
passage = """
The models were built in Innovyze’s InfoWorks ICM software which facilitates coupling of a 1-dimensionsal (1-D) rainfall-runoff and sewer routing component with a 2-dimensional (2D) overland flow and flood visualization component.
Phase 2 modeling developed an H&H model for each hydraulically independent area of the city, resulting in 13 different models"""
note = "The plan describes the Moderate (10-yr) and Extreme (100-yr) maps. Which approach produced the 1.77 in/hr Limited map is not stated. Whether a given layer used the 1D-2D or the composite approach is stated only for 10-yr and 100-yr."
verdict_note = ""

[[fact]]
name = "licence"
claimed = "NYC Open Data terms **[V]**"
observed = "No licence is attached to the dataset (Socrata licenseId is None). Terms: the general NYC Open Data terms (see passage). Each layer dictionary adds a disclaimer: informational purposes only, not for design or flood plain determination, no warranty."
outcome = "confirmed"
source_url = "https://cityofnewyork.github.io/opendatatsm/publicpolicies.html"
passage = """
[Technical Standards Manual, public policies page] Local Law 11 of 2012, specifically § 23-502 d, requires that data sets must be available without registration requirement, license requirement, or usage restrictions, except as provided below. ... DoITT may require third party entities such as application developers to explicitly identify the source, version, and modifications made to a public data set, should they publicly re-publish it elsewhere or incorporate the public data set into an application. ... By accessing data sets and feeds available through the NYC OpenData portal (or the “Site”), the user agrees to all of the Terms of Use of NYC.gov as well as the NYC.gov Privacy Policy. The user also agrees to any additional terms of use defined by entities providing data or feeds through the Site. ... Public data sets made available on the NYC OpenData portal are provided for informational purposes. The City does not warranty the completeness, accuracy, content, or fitness for any particular purpose or use of any public data set made available on the NYC OpenData portal ...
[Technical Standards Manual, 5/12/2023 revision, section 2.3.2, https://www.nyc.gov/content/dam/nycgov/opendata/downloads/open-data-coordinators/NYC_OpenData_TechnicalStandardsManual.pdf] Upon publication to NYC Open Data, datasets become a public resource available to anyone, without restriction or licensing requirements (see NYC Open Data’s Terms of Use for more information).
[Layer dictionary, limitations] The City disclaims any liability for errors and make no warranties express or implied ... Any determination of topography or contours, or any depiction of physical improvements, property lines or boundaries is for general information only and shall not be used for the design, modification, or construction of improvements to real property or for flood plain determination."""
note = "Fact 5 of the task (general NYC Open Data terms), repeated under each source. I did not find a stand-alone Terms of Use page for the portal: https://www.nyc.gov/html/data/terms.html and the old PDF address return 404, and https://opendata.cityofnewyork.us/overview/#termsofuse redirects to a script-built nyc.gov page that gave no terms text to curl. The passage comes from the Open Data team's own Technical Standards Manual (web page of the NYC github organisation, and the PDF), which quotes the Terms of Use. The nyc.gov-wide terms the passage refers to are at https://www.nyc.gov/main/terms-of-use (read; general website terms; a search of its text for 'open data', 'data set' and 'public data' found no passage on data sets). The Socrata API shows licenseId = None for every dataset below, i.e. no licence is attached on the portal."
verdict_note = ""

