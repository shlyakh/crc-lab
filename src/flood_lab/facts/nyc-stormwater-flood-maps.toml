[[fact]]
name = "sea_level_assumptions"
claimed = "Limited and Moderate: current sea levels; Moderate: 2050 sea level rise; Extreme: 2080 sea level rise"
observed = "Names confirmed. Quantities: 2050 layer = 'High Estimate of 30 inches sea level rise' (NPCC 90th percentile, 2050s); 2080 layer = 'High Estimate of 58 inches sea level rise' (NPCC 90th percentile, 2080s). The Resiliency Plan (May 2021) gives the same as 'MHHW + 2.5 feet' and 'MHHW + 4.8 feet'. For the two 'Current Sea Levels' layers no tide level is stated in the dictionaries or in the plan."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/api/views/9i7c-xyvv/files/6ce7b252-a38c-47ae-a823-680f443227e5 (inside the zip: dictionaries for the 2050 and 2080 layers); https://www1.nyc.gov/assets/orr/pdf/publications/stormwater-resiliency-plan.pdf"
passage = """
[2050 layer dictionary, Flooding_Category] 3 - Future High Tides 2050 ... Future High Tides 2050 category sourced from DCP Flood Hazard Mapper High Tide 2050s High Estimate of 30 inches sea level rise.
[2080 layer dictionary] 3 - Future High Tides 2080 ... High Tide 2080s High Estimate of 58 inches sea level rise.
[Plan, Table 2] Moderate 10-yr MHHW + 2.5 feet ; Extreme 100-yr MHHW + 4.8 feet"""
note = "The plan describes only two scenarios (Moderate, Extreme). The two current-sea-level layers and the 2.13/1.77/3.66 figures are not in the plan: it says \"approximately two inches of rain falling in one hour\" and \"approximately 3.5 inches of rain falling in one hour\". The plan is dated May 2021, the maps were republished in 2024; whether the plan describes the 2024 maps exactly is not stated."
verdict_note = ""

[[fact]]
name = "min_area_and_depth_rule"
claimed = "they show areas of at least 0.25 contiguous acres with 4 inches or more **[S]**"
observed = "The rule is stated as claimed, but the data dictionary adds an exception: the dataset 'contains some potential flooding areas less than 0.25 acres due to proximity and overlap with masking layers'. The plan says the threshold was set 'through an iterative approach' and uses 'greater-than-or-equal-to four (4) inches' in one place and 'greater than 4 inches' in another."
outcome = "differs"
source_url = "Inside the zip: each layer dictionary, sheet Dataset Information, row \"How is this data collected?\"; plan Appendix B, Mapping approach"
passage = "The New York City Stormwater Flood Maps show areas of potential flooding of at least 0.25 contiguous acres with flood depths of 4 inches or more.  This dataset contains some potential flooding areas less than 0.25 acres due to proximity and overlap with masking layers."
note = "Outcome is \"differs\" only in the sense that the rule is not strict; the rule itself is confirmed. A loader must not assume every polygon part is at least 0.25 acre."
verdict_note = ""

[[fact]]
name = "depth_classes"
claimed = "the two depth classes (4 in to 1 ft, over 1 ft)"
observed = "Two depth classes exist (code 1 = 4 in to under 1 ft, code 2 = 1 ft and greater), but the two layers with sea-level rise carry a THIRD code, 3, which is not a depth class: 'Future High Tides 2050' / '2080', coastal tidal inundation taken from the NYC Flood Hazard Mapper. The two current-sea-level layers have codes 1 and 2 only (per their dictionaries; the Limited layer could not be read, see 'layers')."
outcome = "differs"
source_url = "Inside the zip: Column Information sheet of each layer dictionary, row Flooding_Category"
passage = """
[2080 and 2050 layers] 1 - Nuisance Flooding (greater or equal to 4 in. and less than 1 ft.)
2 - Deep and Contiguous Flooding (1 ft. and greater)
3 - Future High Tides 2080   (2050 layer: Future High Tides 2050)
[Current-sea-level layers] 1 - Nuisance Flooding (greater or equal to 4 in. and less than 1 ft.)
2 - Deep and Contiguous Flooding (1 ft. and greater)
[Plan] The maps depict two ranges of ponding depth: 1) Areas with ponding depth greater than 4 inches 2) Areas with ponding depth greater than 1 foot. In the maps, the areas with ponding depth greater than 1 foot are displayed on top of the areas greater than 4 inches"""
note = "Plan: the 1-foot areas are drawn on top of the 4-inch areas; in the geodatabases the three classes are separate non-overlapping-by-code rows (one multipolygon per code), I did not test whether code 1 geometry also contains code 2 areas. The plan says tidal layers are \"overlaid in the map on top of all rainfall-derived flooding\". The loader should drop or separate code 3 before rasterising depth classes."
verdict_note = ""

