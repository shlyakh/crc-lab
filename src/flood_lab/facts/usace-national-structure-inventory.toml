[[fact]]
name = "structures_in_study_box"
claimed = ""
observed = "22,896 structure records in one FeatureCollection (HTTP 200, 20,114,815 bytes, 42 property fields per record). By county of the census block (cbfips prefix): 21,452 Kings (36047, Brooklyn) and 1,444 New York (36061, Manhattan). By st_damcat: RES 15,355; COM 5,808; PUB 953; IND 780. By occupancy-type family (letters of occtype): RES 15,645 (RES3 14,624, RES1 731, RES4 223, RES5 59, RES6 8); COM 5,490 (COM1 1,532, COM8 1,158, COM4 999, COM2 674, COM7 548, COM3 542, COM5 22, COM9 10, COM6 5); IND 780 (IND2 543, IND5 132, IND3 78, IND1 19, IND4 8); REL 629; EDU 274; GOV 50; AGR 28. Commonest occtype: RES3B 5,042; RES3A 4,125; RES3C 2,705; COM1 1,437; COM8 1,158; RES3D 1,034; COM4 999; RES3E 942. By foundation type found_type: B (basement) 17,118 (74.8%); S (slab) 5,416; C (crawl) 362; no P, I, F or W. found_ht (ft): min 0.25, first quartile 2, median 2, third quartile 2, max 2, mean 1.59, no nulls; values 0.25 (4,690), 0.5 (695), 0.75 (31), 2.0 (17,480) only. val_struct (depreciated replacement value, USD, August 2025): sum 64,510,636,650 (64.5 billion), median 552,126; minimum 199, maximum 494,780,196; fullrep (not depreciated) sum 87,026,696,899. source: P (parcel) 15,543, H (HIFLD) 7,353."
outcome = "confirmed"
source_url = "https://nsi.sec.usace.army.mil/nsiapi/structures?bbox=-73.9900,40.6850,-73.9900,40.7245,-73.9385,40.7245,-73.9385,40.6850,-73.9900,40.6850"
passage = "FeatureCollection of 22896 features (my count) ; found_type {'B': 17118, 'S': 5416, 'C': 362} ; found_ht value counts {0.25: 4690, 0.5: 695, 0.75: 31, 2.0: 17480} ; val_struct median 552126.358368, sum 64510636650.06361"
note = "Statistics are mine (scripts analyse_f1.py, nsi_county.py in f1/scripts). The st_damcat classes and the occtype letters disagree (occtype REL, EDU, GOV fall under PUB in st_damcat, as inferred from the counts; not read from the documentation). found_ht takes only four values and is 2 ft for 76% of records, which looks like assignment from foundation-type rules, not measurement (same observation as in the F0 sample). The study's Brooklyn buildings are those with cbfips starting 36047; the box also returns 1,444 Manhattan records."
verdict_note = ""

[[fact]]
name = "join_fields_to_city_buildings"
claimed = "which identifier fields could join it to the city's buildings"
observed = "There is no BIN, BBL or DOITT id in the 42 fields. What exists: (1) x, y: WGS84 longitude and latitude of the structure point (all inside the box; the structure is placed at the footprint or parcel centroid), so the join to city footprints or BES centroids is spatial (point in polygon, or nearest); (2) fd_id: integer, unique per record (22,896 distinct), the NSI's own record key; (3) bid: text built on an Open Location Code (plus code) of the footprint plus suffixes, for example \"87G8M2RX+Q8H-3-4-3-4\", filled in 11,596 records, empty (\"\") in the others; (4) ftprntid: footprint id, either \"none_<number>\" (11,300 records) or \"<county FIPS>_<number>\" such as \"36047_158616\" (5,647 distinct values over the other 11,596 records, so several records share a footprint: stacked structures); (5) usastrucid: filled in 9,744 records (for example \"7913338\"), empty in the others; (6) cbfips: 15-digit Census 2020 block id; (7) ftprntsrc: footprint source (P 11,280; NGA 9,657; Bing 1,852; ORNL 87; H 20). None of the ids was matched to a city id here."
outcome = "confirmed"
source_url = "https://nsi.sec.usace.army.mil/nsiapi/structures?bbox=-73.9900,40.6850,-73.9900,40.7245,-73.9385,40.7245,-73.9385,40.6850,-73.9900,40.6850"
passage = "first feature: geometry {'type': 'Point', 'coordinates': [-73.952602, 40.694044]} ; properties bid '', fd_id 74109145, ftprntid 'none_265587', usastrucid '', ftprntsrc 'P', cbfips '360470241001000' ; another record: bid '87G8M2RX+Q8H-3-4-3-4', usastrucid '7913338'"
note = "No spatial join was run in this task, so the match rate of NSI points to city footprint polygons is not known. Note the NSI footprint ids (FIPS_number, Bing, NGA) are not the city's BIN or DOITT id. The meaning of bid, ftprntid and usastrucid is inferred from values; the documentation page was not re-read for these three."
verdict_note = ""

