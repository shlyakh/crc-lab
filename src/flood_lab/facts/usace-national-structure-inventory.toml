[[fact]]
name = "fields"
claimed = "occupancy type, foundation type or basement, first-floor height found_ht, replacement value val_struct, stories, ground elevation"
observed = "All present in the public 2026 schema and in my sample: occtype (e.g. RES3C, COM4; Hazus-style damage function name), st_damcat (RES/COM/IND/PUB), found_type (C crawl, B basement, S slab, P pier, I pile, F fill, W solid wall), found_ht (\"foundation height of the structure in feet from the ground elevation\"), num_story, val_struct (depreciated replacement value in dollars), val_cont, val_vehic, fullrep (full non-depreciated replacement value, new in 2026), depindex, sqft, ftprntsqft, bldheight (metres), ground_elv (feet, NAVD88) and grnd_elv_m (metres, NAVD88), med_yr_blt (median of the census tract, not the building), firmzone, zone_sub, static_bfe, x/y WGS84. A basement is only the found_type=B flag: the detailed `basement` field (finished/unfinished/none) is a restricted field for federal users and mission partners. Sample record keys (43): bid, bldgtype, bldheight, cbfips, creprcnt, crerank, depindex, fd_id, firmzone, found_ht, found_type, ftprntid, ftprntsqft, ftprntsrc, fullrep, grnd_elv_m, ground_elv, med_yr_blt, novehprob, num_story, o65disable, occtype, pctlowclr, pop2amo65, pop2amu65, pop2pmo65, pop2pmu65, resunits, source, sqft, st_damcat, static_bfe, students, u65disable, usastrucid, val_cont, val_struct, val_vehic, vehperunit, x, y, zone_sub."
outcome = "confirmed"
source_url = "https://www.hec.usace.army.mil/confluence/nsi/technicalreferences/latest/technical-documentation"
passage = "found_ht \"Describes the foundation height of the structure in feet from the ground elevation.\" ; found_type \"(C = Crawl, B = Basement, S = Slab, P = Pier, I = Pile, F = Fill, W = Solid Wall)\" ; val_struct \"Value in dollars of the structure. The base NSI estimates depreciated replacement value.\" ; fullrep \"The full, not depreciated, estimated replacement value of the structure record.\" ; grnd_elv_m \"Ground elevation (in meters, NAVD88) at the structure.\" ; ground_elv \"Ground elevation (in feet, NAVD88) at the structure.\" ; Private fields: \"basement Basement type of the structure (i.e. finished, unfinished, none).\""
note = "The doc list has no number-of-stories unit note; num_story is a count. Sample shows ground_elv 96.04 ft and grnd_elv_m 29.27 m for a Crown Heights point, consistent with each other. Ground elevation source per the doc: USGS National Elevation Dataset 10 m, so it is coarser than the 1 m lidar."
verdict_note = ""

[[fact]]
name = "price_year"
claimed = "price year of the values"
observed = "Values are at August 2025 price levels; replacement cost, not market value; land excluded. val_struct is depreciated replacement value, fullrep is not depreciated. USACE normally uses depreciated, FEMA Hazus often full."
outcome = "confirmed"
source_url = "https://www.hec.usace.army.mil/confluence/nsi/technicalreferences/latest/frequently-asked-questions"
passage = "\"What is the price level of the NSI? NSI dollar values represent estimated replacement costs as of approximately August 2025. NSI values reflect full and depreciated replacement cost, not market value. They exclude land value and broader market effects such as location premiums.\" ; technical documentation: \"All values are reported in August 2025 price levels.\""
note = "Event-year losses for 2021 would need deflating by a price index; the NSI itself gives none."
verdict_note = ""

[[fact]]
name = "licence"
claimed = "Public"
observed = "No licence or terms of use stated in the documentation pages I read (API guide, technical documentation, FAQ, release notes, mission page). The mission says the aim is to \"Provide access to the data to as many people and agencies as possible\". Some fields are restricted to federal users. The nsi.sec.usace.army.mil site root returned 403 and the NSI home page was not read."
outcome = "not checked"
source_url = "https://www.hec.usace.army.mil/confluence/nsi/technicalreferences/latest/mission-vision-and-goals"
passage = "Goals: \"Provide access to the data to as many people and agencies as possible.\" ; technical documentation: \"Some NSI fields are restricted to federal users and mission partners because they contain source-specific, sensitive, licensed, or otherwise restricted information.\""
note = "\"Public\" in requirements.md is plausible (the API answers anonymously) but no statement was found; look for terms on the NSI download page or a USACE statement."
verdict_note = ""

[[fact]]
name = "known_limits"
claimed = ""
observed = "Stated by the publisher: a modeled national inventory, not a structure-by-structure verification; errors possible in location, occupancy, square footage, stories, foundation type and height, population, value; meant for screening and regional use; \"not intended for legal or regulatory determinations\"; local review and surveys recommended; stacked structures (several records on one footprint, with value divided); structure placed at footprint or parcel centroid; garages not separate."
outcome = "confirmed"
source_url = "https://www.hec.usace.army.mil/confluence/nsi/technicalreferences/latest/technical-documentation"
passage = "\"The NSI Base dataset should be understood as a modeled national exposure inventory rather than a structure-by-structure verification dataset.\" ; \"individual structure records may contain errors in location, occupancy type, square footage, number of stories, foundation type, foundation height, population, or value.\" ; FAQ: \"NSI is not intended for legal or regulatory determinations or for analyses requiring precise structure-level accuracy.\""
note = "In my sample 1,586 records sit on 1,586 fd_id but fewer footprints (stacked structures); count distinct ftprntid to count buildings (FAQ advice)."
verdict_note = ""

[[fact]]
name = "sample_summary"
claimed = ""
observed = "Sample box lon -73.96..-73.95, lat 40.66..40.67 (Prospect Heights / Crown Heights, Brooklyn): 1,586 structure records in one FeatureCollection, 1,390,724 B. st_damcat RES 1250, COM 265, PUB 57, IND 14; found_type B 1238, S 322, C 26; found_ht 0.25 to 2 ft (no nulls); num_story mostly 2 (1004), then 3 (217), 1 (149), 4 (114); val_struct median 466,231 USD; source P (parcel) 1258, H (HIFLD) 328; top occtype RES3A 417, RES1-2SWB 407, RES3C 111. No nulls in found_ht, val_struct, ground_elv, fullrep, num_story."
outcome = "confirmed"
source_url = "https://nsi.sec.usace.army.mil/nsiapi/structures?bbox=-73.96,40.66,-73.96,40.67,-73.95,40.67,-73.95,40.66,-73.96,40.66"
passage = "FeatureCollection of 1586 features (my count); first feature properties: found_ht 2, found_type B, occtype RES3C, val_struct 2409559.7452, fullrep 3393746.12, ground_elv 96.040825, grnd_elv_m 29.273243, num_story 2, med_yr_blt 1938"
note = "Statistics are mine. Note: found_ht never exceeds 2 ft in this box and basements are flagged for 78% of records: the values look like regional-distribution assignments (doc: foundation types assigned from tax-assessor data and \"regional distributions\"), not measured first-floor heights, and will differ from the city Building Elevation and Subgrade table."
