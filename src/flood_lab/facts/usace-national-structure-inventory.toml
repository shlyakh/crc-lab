id = "usace-national-structure-inventory"
title = "National Structure Inventory (NSI) 2026 Base"
publisher = "U.S. Army Corps of Engineers (NSI development team)"
checked_on = "2026-11-25"
stage = "F0"
level = "facts"
second_reader_stage = ""
used_for = ["FD5"]
known_biases = "A modeled inventory, not a survey: attributes are estimated from parcels, footprints, Census data and regional distributions, so foundation height, basement and values are typical rather than measured. Prices are August 2025, the inventory reflects roughly 2025 buildings and population, and stacked structures are counted as several records on one footprint."

