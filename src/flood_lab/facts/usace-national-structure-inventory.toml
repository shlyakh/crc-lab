[[fact]]
name = "address"
claimed = ""
observed = "API root https://nsi.sec.usace.army.mil/nsiapi/ (the bare root returns 404 JSON, the site root 403; the documented endpoints work). Structures by polygon: GET https://nsi.sec.usace.army.mil/nsiapi/structures?bbox=lon,lat,lon,lat,... (a closed ring of at least 4 corner pairs; not min/max form); by county: ?fips=<5-digit FIPS>; optional &fmt=fc (feature collection, default) or &fmt=fs (feature stream); POST of a GeoJSON polygon for complex shapes. /stats?bbox=... for summary. State GeoPackage and GeoParquet downloads on the NSI Download page (the download tool still serves 2022 data per the release notes)."
outcome = "confirmed"
source_url = "https://www.hec.usace.army.mil/confluence/nsi/technicalreferences/latest/api-reference-guide"
passage = "\"The root url of the NSI API is: https://nsi.sec.usace.army.mil/nsiapi/\" ; \"https://nsi.sec.usace.army.mil/nsiapi/structures?bbox=-81.58418,30.25165,-81.58161,30.26939,-81.55898,30.26939,-81.55281,30.24998,-81.58418,30.25165\" ; \"https://nsi.sec.usace.army.mil/nsiapi/structures?fips=15005&fmt=fs\" ; \"For situations where the same structure inventory is leveraged multiple times, it is best to download the inventory, store it locally\""
