[[fact]]
name = "nyc_topobathy_2017_identifier_vintage"
claimed = "\"NYC topobathymetric lidar\""
observed = "NYC Open Data 7sc8-jtbz \"Topobathymetric LiDAR Data (2017)\", provider Office of Technology and Innovation (OTI), made public 3/11/2019. Collected by Quantum Spatial: topographic (Leica ALS80, at least 8 pulses/m2) 2017-05-03 to 2017-05-17 in 50% leaf-off; bathymetric (Riegl VQ-880-G) 2017-07-04 to 2017-07-26. This is the most recent NYC-owned vintage I found: a search of the NYC Open Data catalogue (Socrata discovery API, q=lidar and q=elevation) found no later lidar DEM; the other NYC DEM, dpc8-z3jc, is from 2010 lidar. It pre-dates Ida (2021-09) by four years. (The USGS tiles A24/B23 are newer but also post-date the event.)"
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/api/views/7sc8-jtbz.json"
passage = "\"Topographic and bathymetric LiDAR data was collected for New York City in 2017.  Topographic data was collected for the entire city, plus an additional 100 meter buffer, using a Leica ALS80 sensor equipped to capture at least 8 pulse/m<sup>2</sup>. Dates of capture for topographic data were between 05/03/2017 and 05/17/2017 during 50% leaf-off conditions.\" ; \"Date Made Public\": \"3/11/2019\" ; attribution \"Office of Technology and Innovation (OTI)\""
note = "\"Most recent vintage\" rests on a catalogue search, which is not proof that nothing newer exists."
verdict_note = ""

[[fact]]
name = "nyc_topobathy_2017_resolution_crs_datum"
claimed = "\"1 m\"; \"vertical datum recorded\""
observed = "Resolution 1 foot (not 1 m). Horizontal: NAD83, New York State Plane Long Island, US survey feet (EPSG:2263). Vertical: NAVD88, Geoid 12B, US survey feet. Products: bare-earth DEM, hydro-flattened DEM, hydro-enforced DEM filled and unfilled, highest-hit DSM, classified LAZ."
outcome = "differs"
source_url = "https://data.cityofnewyork.us/api/views/7sc8-jtbz.json"
passage = "\"The horizontal datum for all datasets is NAD83, the vertical datum is NAVD88, Geoid 12B, and the data is projected in New York State Plane - Long Island. Units are in US Survey Feet.\" ; GitHub metadata (Metadata_LiDAR_Summary.md): \"2017 | 1 foot | Topographic: 5/3/2017 - 5/17/2017 ... Bathymetric: 7/4/2017 - 7/26/2017\"; \"New York State Plane Coordinates, Long Island East Zone, NAD83, US foot (epsg:2263)\" ; \"Vertical Datum NAVD88 Geoid 12B\""
note = "GitHub summary https://github.com/CityOfNewYork/nyc-geo-metadata/blob/master/Metadata/Metadata_LiDAR_Summary.md was read (stream, not kept). Resampling 1 ft (0.3048 m) to a 1 m project grid is straightforward."
verdict_note = ""

[[fact]]
name = "nyc_topobathy_2017_access_size_tiling"
claimed = ""
observed = "Access: whole-city attachments on https://data.cityofnewyork.us/City-Government/Topobathymetric-LiDAR-Data-2017-/7sc8-jtbz (Socrata files API; asset ids are in the metadata.attachments field). Whole-city sizes (Content-Range of a 1-byte ranged GET): Bare_Earth_Hydroenforced_Filled.zip 12,626,260,567 B; Bare_Earth_Hydroenforced_Unfilled.zip 15,570,842,895 B; Bare_Earth_Topographic_Hydroflattened.zip 15,571,266,230 B; Highest_Hit.zip 30,067,537,190 B; TopoBathymetric_Classified_LAZ.zip 109,471,608,019 B; the description says the files total 180 GB. Per-borough tiles can be had from https://finder.nyc.gov/orthoimagery (named in the description; not opened) and the NYS GIS FTP ftp://ftp.gis.ny.gov/elevation/DEM/NYC_TopoBathymetric2017_Hydroenforced_Unfilled/ (cited by the USGS release). Brooklyn+Queens share of each zip: not determinable from what I read. Tile size: not verified from a primary source (a web search summary said 25,000 ft x 25,000 ft; treat as unconfirmed)."
outcome = "not checked"
source_url = "https://data.cityofnewyork.us/api/views/7sc8-jtbz.json"
passage = "description: \"Please note that the total size is 180GB, so the download may take some time ...\" ; \"You can also visit https://finder.nyc.gov/orthoimagery to download raw LiDAR data for specific tiles.\" ; Content-Range: bytes 0-0/15570842895 (Bare_Earth_Hydroenforced_Unfilled.zip)"
note = "No file downloaded. The unfilled hydro-enforced DEM is the one the USGS Ida depth release used."
verdict_note = ""

