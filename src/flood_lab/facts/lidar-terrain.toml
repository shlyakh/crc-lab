id = "lidar-terrain"
title = "Lidar terrain for New York City: USGS 3DEP 1 m DEM and NYC 2017 topobathymetric lidar DEM"
publisher = "U.S. Geological Survey (3DEP); City of New York Office of Technology and Innovation (OTI)"
checked_on = "2026-11-25"
stage = "F0"
level = "facts"
second_reader_stage = ""
used_for = ["FD2"]
known_biases = "The 1 m grid is a patchwork of lidar projects from 2013 to 2025, none from the Ida year; the city product is 1 ft and from 2017, so buildings, grading and drainage changes since then are absent. Bare-earth models remove buildings; hydro-flattening and hydro-enforcement alter water bodies and culverts, which matters for pluvial flooding."

[[fact]]
name = "identifier"
claimed = "USGS 3DEP or NYC topobathymetric lidar (no identifiers); FD2 \"1 m lidar digital elevation model for the area, with its vintage and vertical datum recorded\""
observed = "Candidates: (A) USGS 3DEP \"Digital Elevation Model (DEM) 1 meter\", ScienceBase collection 543e6b86e4b0fd76af69cf4c, in this box as projects NY_LongIsland_A24, NJ_NE6County_B23, NY_CMPG_2013, NY_LongIsland_Z18_2014, NJ_SdL5_2014 (27 tiles); (B) NYC Open Data 7sc8-jtbz \"Topobathymetric LiDAR Data (2017)\" (Office of Technology and Innovation), also on the NYS GIS Clearinghouse; (C) NYC Open Data dpc8-z3jc \"1 foot Digital Elevation Model (DEM)\" from 2010 lidar. Neither NYC product is 1 m."
outcome = "differs"
source_url = "https://tnmaccess.nationalmap.gov/api/v1/products?datasets=Digital%20Elevation%20Model%20(DEM)%201%20meter&bbox=-74.05,40.55,-73.70,40.80&max=100"
passage = "TNM Access API: total=27 products for bbox; items include \"USGS 1 Meter 18 x60y451 NY_LongIsland_A24\", \"USGS one meter x59y451 NY CMPG 2013\", \"USGS 1 Meter 18 x58y451 NJ_NE6County_B23\" ; NYC: name=\"Topobathymetric LiDAR Data (2017)\" id 7sc8-jtbz ; name=\"1 foot Digital Elevation Model (DEM)\" id dpc8-z3jc"
note = "Differs from FD2 only in that the city product is 1 ft, not 1 m, and the USGS 1 m product is a mix of projects. The 1 m grid is available from USGS only."
verdict_note = ""

[[fact]]
name = "usgs_3dep_vintage"
claimed = "\"with its vintage\""
observed = "Brooklyn/Queens area is split between projects in the 3DEP catalogue: NY_CMPG_2013 (lidar 2013-08-06 to 2014-04-21; the only 3DEP source listed for tiles x59y449-452, lon -73.94..-73.82), NY_LongIsland_A24 (flown 2024-03-24 to 2024-04-16, published 2026-08-19; east tiles x60, x61), NJ_NE6County_B23 (2023-04-13 to 2025-04-09, published 2026-09-17; west tiles x58), older NY_LongIsland_Z18_2014 and NJ_SdL5_2014 (published 2020-03-30). Everything newer than 2021-09 (A24, B23) post-dates Ida; the 2013-14 and 2014 projects pre-date it."
outcome = "confirmed"
source_url = "https://www.sciencebase.gov/catalog/item/6a8905171ba49bf481207cc1"
passage = "A24 item dates: {\"type\": \"Start\", \"dateString\": \"2024-03-24\"}, {\"type\": \"End\", \"dateString\": \"2024-04-16\"}, Publication 2026-08-19 ; B23 item dates: Start 2023-04-13, End 2025-04-09, Publication 2026-09-17 ; CMPG 2013 item dates: Start 2013-08-06, End 2014-04-21, Publication 2020-03-30"
note = "Dates are collection dates stated on each tile's ScienceBase item (B23 spans two years across a multi-county project). The x58..x61 tile numbers are 3DEP 10 km tile indices (UTM 18N)."
verdict_note = ""

[[fact]]
name = "usgs_3dep_resolution_crs_datum"
claimed = "\"vertical datum recorded\""
observed = "1 m cells; tiles are 10,000 m x 10,000 m GeoTIFFs in NAD83 UTM zone 18N (metres; zone from the tile name, 18); bare-earth elevations in metres referenced to NAVD88. Geoid model not named on the tile record pages I read."
outcome = "confirmed"
source_url = "https://thor-f5.er.usgs.gov/ngtoc/metadata/waf/elevation/1_meter/geotiff/NY_LongIsland_A24/USGS_1M_18_x60y451_NY_LongIsland_A24.xml"
passage = "\"The spatial reference used for tiles of the one-meter DEM within the conterminous United States (CONUS) is Universal Transverse Mercator (UTM) in units of meters, and in conformance with the North American Datum of 1983 (NAD83). All bare earth elevation values are in meters and are referenced to the North American Vertical Datum of 1988 (NAVD88).\" ; \"This is a 10,000 meter by 10,000 meter tile.\""
note = "Stated in the collection-level text repeated on each tile; the A24 and B23 tile XML both carry it. Not checked inside the GeoTIFF headers (nothing downloaded)."
verdict_note = ""

[[fact]]
name = "usgs_3dep_access_size"
claimed = ""
observed = "Access: TNM Access API https://tnmaccess.nationalmap.gov/api/v1/products (dataset \"Digital Elevation Model (DEM) 1 meter\", bbox parameter) returns a downloadURL per tile on s3 (https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1m/Projects/<project>/TIFF/USGS_1M_18_x__y___<project>.tif). The 27 tiles intersecting the Brooklyn-Queens rectangle total 5,154 MB in all projects together (duplicates between projects): A24 5 tiles 1,110 MB, B23 3 tiles 264 MB, CMPG_2013 11 tiles 2,300 MB, LongIsland_Z18_2014 5 tiles 1,257 MB, NJ_SdL5_2014 3 tiles 224 MB. A single-vintage cover with the newest data per tile = 3 B23 + 5 A24 + the 4 x59 CMPG 2013 tiles = about 2.3 GB. Tiles also cover Staten Island, Manhattan, the Bronx edge and Nassau, so this overstates Brooklyn+Queens. One tile is 7 MB to 525 MB. The first TNM call returned HTTP 504; the retry succeeded."
outcome = "confirmed"
source_url = "https://tnmaccess.nationalmap.gov/api/v1/products?datasets=Digital%20Elevation%20Model%20(DEM)%201%20meter&bbox=-74.05,40.55,-73.70,40.80&max=100"
passage = "items[].sizeInBytes summed per project (my arithmetic); example: {\"title\": \"USGS 1 Meter 18 x60y451 NY_LongIsland_A24\", \"sizeInBytes\": 157021442, \"downloadURL\": \"https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1m/Projects/NY_LongIsland_A24/TIFF/USGS_1M_18_x60y451_NY_LongIsland_A24.tif\"}"
note = "Sizes are from the API listing; no tile downloaded (rule: facts only)."
verdict_note = ""

