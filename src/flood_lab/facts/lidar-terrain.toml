[[fact]]
name = "fields"
claimed = ""
observed = "Both are single-band elevation rasters of the bare earth. USGS: metres, NAVD88, 1 m cells, 10 km tiles. NYC: US survey feet, NAVD88 Geoid 12B, 1 ft cells (NYC 2010 DEM dpc8-z3jc: \"Cell values correspond to the ground elevation value (feet) above sea level\"). Product variants for NYC 2017: bare earth, hydro-flattened, hydro-enforced filled and unfilled, plus DSM (highest hit)."
outcome = "confirmed"
source_url = "https://data.cityofnewyork.us/api/views/dpc8-z3jc.json"
passage = "\"The DEM was generated by interpolating the LiDAR ground points to create a 1 foot resolution seamless surface. Cell values correspond to the ground elevation value (feet) above sea level.\" ; \"The elevations in this DEM represent the topographic bare-earth surface.\""
note = "Raster headers not inspected (nothing downloaded)."
verdict_note = ""

