# F3 drainage allowance (FH3). PROPOSED, NOT FROZEN.
# F3 stopped before the freeze: the monotonicity check of FH8 fails (docs/flood/reports/F3-solver.md).
# The value below is the best single fit of the calibration runs; it becomes frozen only on Yuri's word.
allowance_mm_per_h = 30.0
tag = "P"
frozen_on = "not frozen: proposed 2026-11-25, awaiting Yuri's decision on FH8 (F3 report)"
objective = "Smallest sum, over the Limited (1.77 in/hr) and Moderate (2.13 in/hr) current-sea-level maps, of the squared log ratio of modelled to city area in each class (4 in to 1 ft; 1 ft and over), on study-area land outside footprints, pits and water, after the model's wet patches under a quarter acre are removed. Allowances tried: 20, 25, 30, 35, 40, 50 mm/h. One-hour storm at the stated intensity [P], one dry hour after."
note = "Limited alone fits best near 30 mm/h, Moderate alone near 35 mm/h. CSI (wet) at 30 mm/h is below the proposed 0.5 on both maps. No official sewer-district layer was found, so the per-district fallback of FH3 was not tried."

