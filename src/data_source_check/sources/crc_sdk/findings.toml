[[finding]]
id = "CRC-019-JRC"
source = "jrc-flood"
kind = "observation"
title = "The publisher's masks of spurious depths and permanent water are not read"
documented = "docs/sources/jrc.md does not mention them. GloFAS README (F01 and the file description): the release includes, per tile, 'the permanent water bodies used to patch the flood hazard maps' and 'the spurious depth map that identifies areas where depths >10m are predicted in small channels (<3,000km^2) for the 10-year return period, plus a 2km buffer'. EFAS holds Europe_permanent_water_bodies.tif and Europe_spurious_depth_areas.tif."
observed = "crc-sdk requests the depth files only (crc_sdk/providers/jrc.py:186-246). In the GloFAS tiles read here, pixels inside the spurious-depth mask: Texas box 268,433, Austin 1,245, Fremont 5,137, Houston 0. Pixels deeper than 10 m at 100 years, and how many of them lie inside the mask: Fremont 126, all 126 inside; Austin 2,201, 21 inside; Texas box 192,437, 8,393 inside. Largest depth: Texas box 108.2 m, Austin 21.8 m, Fremont 20.5 m, Houston 10.1 m, Rhine 22.9 m. These depths are fitted and delivered like any other. The EFAS mask and both permanent-water layers were not read by the assessment."
consequence = "Depths the publisher itself marks as doubtful reach the user unmarked; in the Fremont box every depth above 10 m is of that kind. Depths above 10 m outside the mask (most of those in the Texas box) are not explained by it; whether they are permanent water bodies was not examined."
evidence = [
  "crc_sdk/providers/jrc.py:186-246",
  "publisher file README.txt of CEMS-GLOFAS/flood_hazard, lines 38-49, read 2026-11-17",
  "exploration table 'Depths above 10 m and the publisher's spurious-depth mask' (draft records data/cache/validation/drafts/records/jrc-flood.json), run of 2026-11-17",
]
basis = "reproduced"
status = "open"
found_on = "2026-11-17"
framework_version = "0.11.1"

[[finding]]
id = "CRC-020-JRC"
source = "jrc-flood"
kind = "observation"
title = "With a cache, a pixel's source_id depends on the box asked for"
documented = "docs/concepts.md:43 gives the row key as (hazard_name, horizon, pathway, cell_index, source_id). No page says what source_id is made from."
observed = "source_id is the SHA-256 of the dataset name, the tile and the pixel's row and column (crc_sdk/connectors/adapters.py:299-301, 741-743); with a cache the row and column are those of the local crop (crc_sdk/workflows/jrc.py:502-511). All 22,201 fitted pixels of the Austin box are also in the Texas-box output with the same curve (difference of location 0); of 2,000 of them compared, 0 have the same source_id in the two outputs. Per area, the ids equal the reference's computed from the crop position in every sampled pixel, and equal the position in the publisher's file in 0 of 2,000 (621 of 2,000 in the Texas box, where the crops of two tiles begin at the tile's first row and column). Without a cache the position is the file's (read in the code, not run)."
consequence = "Outputs for two boxes cannot be joined, compared or de-duplicated on source_id, and the same request with and without a cache gives different ids for the same pixel."
evidence = [
  "crc_sdk/connectors/adapters.py:299-301, 741-743",
  "crc_sdk/workflows/jrc.py:502-511",
  "check records jrc-flood/source-id[*] (draft records data/cache/validation/drafts/records/jrc-flood.json), run of 2026-11-17",
  "same_pixel_in_two_areas in data/cache/validation/jrc-flood/probes/probes.json (tools/probes/jrc_flood_probes.py), 2026-11-17",
]
basis = "reproduced"
status = "open"
found_on = "2026-11-17"
framework_version = "0.11.1"

[[finding]]
id = "CRC-021-JRC"
source = "jrc-flood"
kind = "defect"
title = "A cache made under a relative path cannot be read offline from another working folder"
documented = "No page says a cache is tied to the working folder it was made from. The documentation's example uses a relative path (docs/sources/jrc.md:19)."
observed = "The manifest stores each crop's path as the cache path was given (for .cache('cache', ...): 'cache/aoi/rp10-....tif'). A run in offline mode from another working folder, given the absolute path of the same cache, ends with FileNotFoundError 'cems-glofas-river-flood cannot be materialized offline; missing or invalid cached AOI resources: ID18_N40_W130:RP10, ...'; from the working folder the cache was made in, the same run completes. Tried on the Fremont box with four return periods."
consequence = "A cache built with a relative path (as in the documentation's example, .cache('cache/efas', mode='reuse')) stops working offline when it is moved, mounted elsewhere or used by a job started in another folder. The message says the resources are missing or invalid, though the files are present and unchanged."
evidence = [
  "crc_sdk/workflows/jrc.py:109-132, 449-465",
  "docs/sources/jrc.md:19",
  "relative_cache in data/cache/validation/jrc-flood/probes/probes.json (tools/probes/jrc_flood_probes.py), 2026-11-17",
]
basis = "reproduced"
status = "open"
found_on = "2026-11-17"
framework_version = "0.11.1"

[[finding]]
id = "CRC-022-JRC"
source = "jrc-flood"
kind = "observation"
title = "A state-sized box is fitted pixel by pixel in one process: 27 minutes and 5.8 GB of memory for the Texas box"
documented = "docs/sources/jrc.md gives no time or size. Its example is a box of 0.7 by 0.5 degrees."
observed = "GloFAS for the Texas box (201,757,502 pixels in four tiles, 9,851,138 curves, 10,703,386 rows): 1,604 s and a peak of 5,804 MB on an arm64 Mac with 16 GB, the 28 crops (about 0.6 GB at the publisher) fetched in the same run. The smaller boxes took 10 s (Austin, 22,201 curves) to 54 s (Houston, 212,867 curves). The table is validated in a separate worker process (crc_sdk/connectors/parquet.py:232), which fails with BrokenProcessPool when the calling script is read from standard input. Read in the code: the output file is written only at the end of the run."
consequence = "A user asking for a state or a country should expect tens of minutes and several GB per run, with nothing kept if the run stops before the end; a larger box may not fit in memory. One machine, one run."
evidence = [
  "crc_sdk/connectors/adapters.py:640-803",
  "crc_sdk/connectors/parquet.py:232",
  "exploration table 'crc-sdk's runs' (draft records data/cache/validation/drafts/records/jrc-flood.json), run of 2026-11-17",
]
basis = "reproduced"
status = "open"
found_on = "2026-11-17"
framework_version = "0.11.1"
