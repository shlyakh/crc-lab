[[finding]]
id = "CRC-022-JRC"
source = "jrc-flood"
kind = "observation"
title = "A state-sized box is read in one process: 2 h 31 min and 5.5 GB of memory for the Texas box on 1.0.0 (27 minutes and 5.8 GB on 0.11)"
documented = "docs/sources/jrc.md gives no time or size. Its example is a box of 0.7 by 0.5 degrees."
observed = "GloFAS for the Texas box (201,757,502 pixels in four tiles, 9,851,138 curves, 10,703,386 rows): 1,604 s and a peak of 5,804 MB on an arm64 Mac with 16 GB, the 28 crops (about 0.6 GB at the publisher) fetched in the same run. The smaller boxes took 10 s (Austin, 22,201 curves) to 54 s (Houston, 212,867 curves). The table is validated in a separate worker process (crc_sdk/connectors/parquet.py:232), which fails with BrokenProcessPool when the calling script is read from standard input. Read in the code: the output file is written only at the end of the run. On crc-sdk 1.0.0 (2026-11-25), where nothing is fitted: the same box, read from the publisher by `JRC(...).select(area=...).read()`, took 9,081 s and a peak of 5,483 MB for 11,069,311 rows, on the same machine; Houston took 111 s and the Rhine box 137 s. That read was the fifth try: of the four earlier tries, one ended on a connection reset 38 s into the download and one on a reset when the machine woke from sleep after 4 h 23 min of reading; how the other two ended is not recorded. Nothing of a failed read is kept."
consequence = "On 1.0.0 a user asking for a state should expect hours, not tens of minutes. At 0.11 a user asking for a state or a country should expect tens of minutes and several GB per run, with nothing kept if the run stops before the end; a larger box may not fit in memory. One machine, one run."
evidence = [
  "crc_sdk/connectors/adapters.py:640-803",
  "crc_sdk/connectors/parquet.py:232",
  "exploration table 'crc-sdk's runs' (site/validation/data/records/jrc-flood.json), run of 2026-11-17",
]
basis = "reproduced"
status = "open"
found_on = "2026-11-17"
framework_version = "0.11.1"

[[finding]]
id = "CRC-023-JRC"
source = "jrc-flood"
kind = "observation"
title = "Flooded pixels with one depth, or with a depth lower than one at a shorter return period, are left out; the only trace is one count that also holds every dry pixel"
documented = "docs/sources.md:33 describes the output as 'original pixels and quantile knots' and does not mention pixels left out. The rule is in the code (crc_sdk/_climate_io.py:173-189), and a comment says JRC's maps 'are inconsistent at a few pixels; those are skipped and counted, not repaired' (crc_sdk/_climate_sources.py:463-464). The read reports one number: 'Skipped N source supports whose values are not a quantile curve: fewer than two valid probability values, or values that decrease as probability rises.' (crc_sdk/_climate_sources.py:149-151)."
observed = "Counted from the publisher's files by the reference reader, and equal to crc-sdk's own skipped count in every area. Houston: 1,045,703 skipped = 1,019,627 dry + 22,086 with one depth + 3,990 with a decreasing depth. Austin: 336,778 = 335,707 + 931 + 140. Fremont: 77,632 = 76,398 + 459 + 775. Rhine (EFAS): 2,440,888 = 2,433,343 + 6,815 + 730. So of the pixels the publisher shows flooded at some return period, the share left out is 26,076 of 278,654 in Houston (9.4%), 1,071 of 25,494 in Austin (4.2%), 1,234 of 10,603 in Fremont (11.6%) and 7,545 of 161,898 on the Rhine (4.7%). The warning carries no support_id and no split."
consequence = "A pixel that floods only at the longest return period, and a pixel where the publisher's depths are inconsistent, are absent from the output in the same way as a pixel that never floods, and the reported count cannot tell the three apart: in Houston it is 40 times the number of flooded pixels dropped. A user who reads 'no row' as 'no flood' undercounts flooded area by the shares above. 'A few' in the code comment is 775 of 10,603 flooded pixels in the Fremont box."
evidence = [
  "crc_sdk/_climate_io.py:173-189",
  "crc_sdk/_climate_sources.py:149-151, 463-464",
  "docs/sources.md:33",
  "check records jrc-flood/delivered[*] and the table 'Pixels by area' (records of jrc-flood, run of 2026-11-24 on crc-sdk 1.0.0)",
]
basis = "reproduced"
status = "fixed"
fixed_in = "1.1.0"
upstream_ref = "https://github.com/RiskThinking/crc-sdk/issues/59"
found_on = "2026-11-24"
framework_version = "1.0.0"
note = "Fixed by pull request #64 (answer to our issue #59), released in crc-sdk 1.1.0. Shown on 2026-11-26 by tools/repro/crc_023_jrc_skipped_pixels.py against crc-sdk 1.1.0 (the GloFAS tile near Fremont, the JRC server): of 10,603 flooded pixels 9,828 are returned, the 459 with one depth among them (the return periods without a depth read as 0 m, counted in an unmapped_depth_as_zero note of 2,631 pixels); the 775 whose depth decreases are left out unrepaired and counted in their own source_no_data warning; the 76,398 dry pixels are in a dry_pixels note and no longer in the skipped count. The offline jrc-flood assessment, ported to this rule, confirms it on constructed files. The live jrc-flood re-run has not been made."

