id = "jrc-flood"
title = "JRC flood hazard maps (GloFAS, EFAS)"
kind = "pass-through"
tier = 2
tier_reason = "Tier 2: no crc-lab result depends on it yet; next week's flood study uses it for one chapter."
publisher = "European Commission JRC, Copernicus Emergency Management Service"
original = "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-GLOFAS/flood_hazard and CEMS-EFAS/flood_hazard"
purpose = "River flood depth at the publisher's return periods, per pixel of the publisher's maps, as the knots of a quantile curve. Nothing is fitted unless the user asks."
adds = "From crc-sdk 1.0 nothing is added to the depths: each pixel of JRC's maps comes back with the depths the publisher gives at its return periods, placed at probabilities 1 - 1/T, with an identifier built from the pixel's position, the H3 cell of its centre and its outline. A pixel with fewer than two depths, or with a depth lower than one at a shorter return period, is left out and counted. Up to 0.11 crc-sdk fitted a Gumbel curve per pixel; that assessment is kept as the previous version."
compared = "JRC's files are read whole by an independent reader. In five areas (Texas, Houston, Austin, Fremont, the Rhine) the reader decides for every pixel whether it should be delivered and with which depths, and that is compared with crc-sdk's rows pixel by pixel. The pixels requested, the files read, the identifiers, the cells, the release, the licence and the recorded provenance are checked separately, as is a box outside a product's coverage."
entry_points = ["JRC"]
explorer = "explore/#tab=crc&source=jrc_flood"
drafted_by = "agent (Claude, with Yuri's plan of 2026-11-24), 2026-11-24"
notes = "Assessed at crc-sdk 1.0.0 on the default path, where nothing is fitted. The explicit fit, `fit(QuantileFit(...))`, is not assessed yet. The review maps and the comparisons with FEMA zones, USGS gauges and Harvey marks were made from crc-sdk 0.11 output and are shown with the previous version. On 2026-11-24 the publisher's server did not answer, so crc-sdk read the copy of the publisher's files held from 2026-11-17 and 2026-11-23; its own downloads were not exercised."

[options]
product = ["efas", "glofas"]

[assessed_options]
product = ["efas", "glofas"]

[status]
exploration = "assessed"
verification = "assessed"
validation = "not assessed"

[[statement]]
id = "files"
text = "Reads the publisher's README.txt, for GloFAS the tile index `tile_extents.geojson`, and one depth file per return period written in the code (GloFAS 10, 20, 50, 75, 100, 200, 500 years; EFAS also 30 and 40) for every GloFAS tile whose extent meets the box, or for EFAS the one continental file."
code_ref = "crc_sdk/_providers/jrc.py:62-84; crc_sdk/_climate_sources.py:421-453"

[[statement]]
id = "transport"
text = "Reads each depth file by range requests for the window of the box only, pinned to the file's ETag so that a file changed during the read is refused."
code_ref = "crc_sdk/_climate_io.py:404-420, 423-515, 626-650"
note = "Not exercised on 2026-11-24: the publisher's server did not answer, so crc-sdk read the copy of the publisher's files held. The values it decoded from those files are compared in the values checks."

[[statement]]
id = "release"
text = "Reads the release from the README (the text after 'Dataset version') and refuses to run when it is not the one written in the code (GloFAS 2.1.2, EFAS 3.1.1). The file addresses hold no version."
code_ref = "crc_sdk/_climate_sources.py:306-330; crc_sdk/_providers/jrc.py:62-80"

[[statement]]
id = "area"
text = "Takes every pixel of the publisher's grid that the box touches."
code_ref = "crc_sdk/_climate_io.py:105-133, 166-170"

[[statement]]
id = "nodata"
text = "Treats the file's nodata value and non-finite values as no depth."
code_ref = "crc_sdk/_climate_io.py:139-141, 173-178"

[[statement]]
id = "selection"
text = "Returns a row for a pixel that has two or more depths, none lower than a depth at a shorter return period. Every other pixel is left out."
code_ref = "crc_sdk/_climate_io.py:173-189; crc_sdk/_climate_sources.py:457-463"

[[statement]]
id = "skipped-count"
text = "Counts the pixels left out and reports the number once for the read, in a warning that names both reasons together. Pixels that are simply dry are in the same number."
code_ref = "crc_sdk/_climate_io.py:171, 189-190; crc_sdk/_climate_sources.py:137-150"

[[statement]]
id = "knots"
text = "Places a depth published for the return period T at the probability 1 - 1/T. A return period with no depth at the pixel gives no knot."
code_ref = "crc_sdk/_climate_sources.py:445-453; crc_sdk/_climate_io.py:173-178, 191-193"

[[statement]]
id = "depths"
text = "Returns the publisher's depths unchanged, in metres."
code_ref = "crc_sdk/_climate_io.py:173-178, 191-193; crc_sdk/_climate_sources.py:482-496"

[[statement]]
id = "identifier"
text = "Names the pixel `jrc:<product>:<tile>:<row>:<column>` by its row and column in the publisher's file (`continental` for EFAS), so that the same pixel has the same name whatever box asked for it."
code_ref = "crc_sdk/_climate_sources.py:457; crc_sdk/_climate_io.py:95-104, 150-153, 198-203"

[[statement]]
id = "cell"
text = "Gives each row the H3 cell of resolution 9 that holds the centre of the pixel, and the pixel's outline as its geometry."
code_ref = "crc_sdk/_climate_io.py:154-165, 194-197, 208-212"

[[statement]]
id = "no-fit"
text = "Fits nothing: every row holds a quantile curve made of the published knots, and no fit and no failure."
code_ref = "crc_sdk/_climate_io.py:191-193, 204-214"

[[statement]]
id = "labels"
text = "Labels every row with the variable `jrc:<product>:flood_depth` and with no scenario and no period."
code_ref = "crc_sdk/_climate_sources.py:482-496; crc_sdk/_climate_io.py:204-207"

[[statement]]
id = "licence"
text = "Records the Open Database License (`ODbL-1.0`) for every file, with the attribution 'Copernicus Emergency Management Service; European Commission Joint Research Centre'. The licence is written in the code and is not read from the publisher."
code_ref = "crc_sdk/_climate_sources.py:310-318, 431-432, 450-451"

[[statement]]
id = "provenance"
text = "Records for every file its address, a SHA-256, the licence, the attribution and the retrieval time. For a depth file the checksum is of the window crc-sdk cut from it, not of the publisher's file."
code_ref = "crc_sdk/_climate_io.py:423-515; crc_sdk/_source_io.py:359-397"

[[statement]]
id = "coverage"
text = "For a box that lies outside a product's coverage, returns no rows and raises no error."
code_ref = "crc_sdk/_climate_sources.py:436-441; crc_sdk/_climate_io.py:105-133"
