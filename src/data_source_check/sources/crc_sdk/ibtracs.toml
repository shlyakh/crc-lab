id = "ibtracs"
title = "IBTrACS tropical cyclone tracks"
kind = "pass-through"
tier = 1
tier_reason = "Tier 1: feeds a crc-lab result today, or is the release most CRC users consume. Feeds the storm tracks and the storm player of the Texas data explorer."
publisher = "NOAA NCEI"
original = "https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv"
purpose = "Best-track points of tropical cyclones by basin, as published, for inspection. Not asset winds or return-period curves."
explorer = "explore/#tab=crc&source=ibtracs"
adds = "Nothing is added to the values. crc-sdk downloads NOAA's CSV file for a basin or period, keeps a checksummed copy, and hands back every row and column as text, with empty values made null. It can also select storms by id or seasons by year. No number is parsed, converted or fitted."
compared = "NOAA's ten files are downloaded independently and read with Python's csv module; every value is compared with what crc-sdk returns, in order. The file addresses, the cached bytes, the header, the two filters and the manifest are checked separately."
entry_points = ["IBTrACS"]
notes = "Assessed at crc-sdk 0.11.2: the statement, the code references and the records below describe that version. The port to 1.0 is pending. Longitudes in NOAA's files are not wrapped to -180..180 (values up to 266.9 occur where a track crosses the date line); crc-sdk passes them through as strings. SEASON runs to 2027 because southern-hemisphere seasons are labelled by their second year. About four values in five are missing: most columns belong to one agency each."

[options]
agency = ["BOM", "CMA", "HKO", "NADI", "NEWDELHI", "REUNION", "TOKYO", "USA", "WELLINGTON", "WMO"]

[status]
exploration = "assessed"
verification = "assessed"

[[statement]]
id = "address"
text = "Requests `<root>/ibtracs.<name>.list.v04r01.csv`, where the name is the subset spelled exactly as one of the eleven crc-sdk accepts, except `active`, which is requested as `ACTIVE`, the spelling of NOAA's file."
code_ref = "crc_sdk/workflows/ibtracs.py:27-43, 72-74"

[[statement]]
id = "bytes"
text = "Saves the response unchanged as `source.csv` and records its SHA-256. A download shorter than the announced length is refused."
code_ref = "crc_sdk/workflows/ibtracs.py:116-131, 157"

[[statement]]
id = "header"
text = "Reads line 1 as column names and line 2 as units. Requires the columns SID, SEASON and ISO_TIME. The units go to the manifest only; they are not in the data."
code_ref = "crc_sdk/workflows/ibtracs.py:132-150, 170-171"

[[statement]]
id = "columns"
text = "Keeps every column, in the file's order, under NOAA's names."
code_ref = "crc_sdk/workflows/ibtracs.py:172, 196"

[[statement]]
id = "strings"
text = "Delivers every value as a string. Nothing is parsed into a number or a date, and no unit is converted."
code_ref = "crc_sdk/workflows/ibtracs.py:201-203"

[[statement]]
id = "trim"
text = "Removes leading and trailing whitespace from every value."
code_ref = "crc_sdk/workflows/ibtracs.py:218-221"

[[statement]]
id = "null"
text = "Turns a value that is empty after trimming into null. NOAA marks a missing value with a single space."
code_ref = "crc_sdk/workflows/ibtracs.py:236-244"

[[statement]]
id = "rows"
text = "Keeps every data row in the file's order. Rows are not dropped, merged, sorted or de-duplicated."
code_ref = "crc_sdk/workflows/ibtracs.py:174-186, 194-215"

[[statement]]
id = "storms"
text = "`for_storms(ids)` keeps the rows whose SID is in the list. These are track points, not complete storms across basin files."
code_ref = "crc_sdk/workflows/ibtracs.py:76-80, 222-225"

[[statement]]
id = "seasons"
text = "`years(a, b)` keeps the rows whose SEASON, read as an integer, lies in a..b inclusive. SEASON is NOAA's season label, not the calendar year of the point."
code_ref = "crc_sdk/workflows/ibtracs.py:82-85, 226-234"

[[statement]]
id = "provenance"
text = "Writes a manifest beside the snapshot with the address, version, subset, SHA-256, retrieval time, ETag, Last-Modified, units, a terms address and a citation. The batches themselves carry no metadata."
code_ref = "crc_sdk/workflows/ibtracs.py:142-158"

[[statement]]
id = "reuse"
text = "In `reuse` mode (the default) a cached snapshot is served without asking NOAA whether the file has changed. NOAA rewrites these files in place."
code_ref = "crc_sdk/workflows/_remote.py:91-115; docs/sources/observations.md:42"
note = "Read in the code, not shown on data: showing it needs NOAA to change a file between two runs. Left to monitoring (phase V4)."
